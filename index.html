/* ============================================================
   METEOROLOGÍA PARA LA OBRA
   Fuente: Open-Meteo (api.open-meteo.com), sin clave y con previsión
   horaria a 16 días. Regla del Documento 3: el día bueno es seco, sin
   viento y sin sol directo sobre el paño. Soleado no es favorable.
   ============================================================ */
const ORIENTACIONES=[['N',0],['NE',45],['E',90],['SE',135],['S',180],['SO',225],['O',270],['NO',315]];
function cfgObra(){
  D.config.obra=Object.assign({
    activo:EDICION==='personal',
    lat:null,lon:null,
    umbrales:{tMin:5,tMax:30,probLluvia:30,precip:0,precipPrevia:0,racha:40},
    panos:[{id:'p1',nombre:'Paño 1',orientacion:180}],
    cache:null
  },D.config.obra||{});
  return D.config.obra;
}

/* ---------- posición del sol, por hora ---------- */
function posicionSolar(fecha,horaMin,lat,lon,tz){
  const d=parse(fecha);
  const inicio=new Date(d.getFullYear(),0,1);
  const dia=Math.round((d-inicio)/86400000)+1;
  const h=horaMin/60;
  const g=2*Math.PI/365*(dia-1+(h-12)/24);
  const eq=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)
    -0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const dec=0.006918-0.399912*Math.cos(g)+0.070257*Math.sin(g)-0.006758*Math.cos(2*g)
    +0.000907*Math.sin(2*g)-0.002697*Math.cos(3*g)+0.00148*Math.sin(3*g);
  const off=eq+4*lon-60*tz;
  const tst=horaMin+off;
  const ha=(tst/4)-180;
  const rad=Math.PI/180, la=lat*rad, haR=ha*rad;
  const cosZ=Math.sin(la)*Math.sin(dec)+Math.cos(la)*Math.cos(dec)*Math.cos(haR);
  const z=Math.acos(Math.max(-1,Math.min(1,cosZ)));
  const alt=90-z/rad;
  // azimut medido desde el sur y llevado a grados desde el norte
  const azSur=Math.atan2(Math.sin(haR),Math.cos(haR)*Math.sin(la)-Math.tan(dec)*Math.cos(la));
  let az=(azSur/rad+180)%360;
  if(az<0)az+=360;
  return {alt:Math.round(alt*10)/10,az:Math.round(az*10)/10};
}
function solDirecto(pano,pos,nubes){
  if(pos.alt<5)return false;                       // sol demasiado bajo
  if(nubes>=70)return false;                       // cubierto: no calienta el paño
  let dif=Math.abs(pos.az-pano.orientacion);
  if(dif>180)dif=360-dif;
  return dif<85;
}

/* ---------- descarga con caché de 3 horas ---------- */
const CACHE_MIN=180;
function cacheValida(){
  const c=cfgObra().cache;
  if(!c||!c.ts)return false;
  return (Date.now()-new Date(c.ts).getTime())<CACHE_MIN*60000;
}
async function traerMeteo(forzar){
  const o=cfgObra();
  if(!o.activo||o.lat===null||o.lon===null)return null;
  if(!forzar&&cacheValida())return o.cache.datos;
  const u='https://api.open-meteo.com/v1/forecast?latitude='+o.lat+'&longitude='+o.lon+
    '&hourly=temperature_2m,precipitation_probability,precipitation,wind_gusts_10m,cloud_cover,shortwave_radiation'+
    '&forecast_days=16&timezone=auto';
  try{
    const r=await fetch(u);
    if(!r.ok)throw new Error('respuesta '+r.status);
    const j=await r.json();
    o.cache={ts:AHORA(),datos:j};
    await guardar(false);
    return j;
  }catch(e){
    console.warn('meteo',e);
    return o.cache?o.cache.datos:null;
  }
}
function meteoDisponible(){const c=cfgObra().cache;return !!(c&&c.datos);}
function meteoDesfasada(){return meteoDisponible()&&!cacheValida();}

/* ---------- evaluación de un día ---------- */
function horasDe(datos,fecha){
  const H=datos&&datos.hourly;
  if(!H)return [];
  const out=[];
  H.time.forEach((t,i)=>{
    if(t.slice(0,10)!==fecha)return;
    out.push({min:Number(t.slice(11,13))*60,
      t:H.temperature_2m[i],prob:H.precipitation_probability[i],
      mm:H.precipitation[i],racha:H.wind_gusts_10m[i],nubes:H.cloud_cover[i],
      rad:H.shortwave_radiation?H.shortwave_radiation[i]:null});
  });
  return out;
}
function evaluarDia(fecha,datos){
  const o=cfgObra();
  const d=datos||(o.cache&&o.cache.datos);
  if(!d)return null;
  const hs=horasDe(d,fecha).filter(x=>x.min>=8*60&&x.min<=19*60);
  if(!hs.length)return null;
  const ayer=horasDe(d,addDays(fecha,-1));
  const u=o.umbrales;
  const motivos=[],avisos=[];
  const tMin=Math.min(...hs.map(x=>x.t)), tMax=Math.max(...hs.map(x=>x.t));
  const probMax=Math.max(...hs.map(x=>x.prob||0));
  const mm=hs.reduce((a,x)=>a+(x.mm||0),0);
  const mmAyer=ayer.reduce((a,x)=>a+(x.mm||0),0);
  const racha=Math.max(...hs.map(x=>x.racha||0));
  if(tMin<u.tMin)motivos.push('mínima de '+Math.round(tMin)+' °C, por debajo de '+u.tMin);
  if(tMax>u.tMax)motivos.push('máxima de '+Math.round(tMax)+' °C, por encima de '+u.tMax);
  if(mm>u.precip)motivos.push('se esperan '+mm.toFixed(1)+' mm de lluvia');
  if(mmAyer>u.precipPrevia)motivos.push('llovió el día anterior ('+mmAyer.toFixed(1)+' mm): el soporte estará húmedo');
  if(probMax>u.probLluvia)avisos.push('probabilidad de lluvia del '+Math.round(probMax)+' %');
  if(racha>u.racha)motivos.push('rachas de '+Math.round(racha)+' km/h');
  else if(racha>u.racha*0.75)avisos.push('rachas de hasta '+Math.round(racha)+' km/h');
  const tz=-new Date().getTimezoneOffset()/60;
  const panos={};
  o.panos.forEach(p=>{
    const sol=[],buenas=[];
    hs.forEach(x=>{
      const pos=posicionSolar(fecha,x.min+30,o.lat,o.lon,tz);
      if(solDirecto(p,pos,x.nubes||0))sol.push(x.min);else buenas.push(x.min);
    });
    panos[p.id]={nombre:p.nombre,orientacion:p.orientacion,sol,buenas,
      tramos:agrupaHoras(buenas),tramosSol:agrupaHoras(sol)};
  });
  const sinSombra=o.panos.filter(p=>!panos[p.id].buenas.length);
  if(sinSombra.length===o.panos.length&&o.panos.length)
    motivos.push('sol directo todo el día en todos los paños');
  const estado=motivos.length?'rojo':(avisos.length?'ambar':'verde');
  return {fecha,estado,motivos,avisos,tMin:Math.round(tMin),tMax:Math.round(tMax),
    mm:Math.round(mm*10)/10,probMax:Math.round(probMax),racha:Math.round(racha),panos};
}
function agrupaHoras(mins){
  if(!mins.length)return [];
  const s=mins.slice().sort((a,b)=>a-b),out=[];
  let ini=s[0],ant=s[0];
  s.slice(1).forEach(m=>{
    if(m===ant+60)ant=m;
    else{out.push([ini,ant+60]);ini=m;ant=m;}
  });
  out.push([ini,ant+60]);
  return out;
}
const COLOR_EST={verde:'var(--ok)',ambar:'var(--warn)',rojo:'var(--bad)'};

/* ---------- incidencia propuesta a 48 h ---------- */
/* días con trabajo de obra planificado, sea jornada de fin de semana,
   un rato entre semana o cualquier bloque que exija estar allí */
function diasDeObra(){
  const m={};
  Object.values(SEM).forEach(w=>{
    (w.jornadas||[]).forEach(j=>{m[j.fecha]=w.id;});
    (w.bloques||[]).forEach(b=>{
      if(b.estado==='anulado'||b.estado==='hecho')return;
      if(b.tipo==='coche'){m[b.fecha]=w.id;return;}
      if(b.tipo!=='trabajo'||!b.tareaId)return;
      const t=tareaPorId(b.tareaId);
      if(t&&(t.desplaza||t.contexto==='obra'))m[b.fecha]=w.id;
    });
  });
  return m;
}
function tareaPorId(id){
  for(const p of D.proyectos)for(const h of p.hitos)for(const t of h.tareas)if(t.id===id)return t;
  return null;
}
function jornadasEnRiesgo(){
  if(!meteoDisponible())return [];
  const m=diasDeObra(),out=[];
  Object.keys(m).forEach(f=>{
    const d=diffDias(hoyISO(),f);
    if(d<0||d>2)return;
    const e=evaluarDia(f);
    if(e&&e.estado==='rojo')out.push({fecha:f,ev:e,semana:m[f]});
  });
  return out.sort((a,b)=>a.fecha<b.fecha?-1:1);
}
/* el mejor día alternativo de los próximos siete, sin sacarte de tus franjas */
function mejorAlternativa(fecha){
  let mejor=null;
  for(let i=1;i<=7;i++){
    const f=addDays(fecha,i);
    if(esPasado(f))continue;
    const e=evaluarDia(f);
    if(!e)continue;
    const puntos={verde:2,ambar:1,rojo:0}[e.estado];
    if(!mejor||puntos>mejor.puntos)mejor={fecha:f,estado:e.estado,puntos};
    if(puntos===2)break;
  }
  return mejor&&mejor.puntos>0?mejor:null;
}

function aplicarMalTiempo(fecha,v){
  const w=SEM[semanaId(lunesDe(fecha))];
  if(!w){cerrar();return;}
  const foto={bloques:copia(w.bloques),jor:copia(w.jornadas||[]),deuda:copia(D.deuda||[])};
  if(v==='mover'){
    const alt=mejorAlternativa(fecha);
    if(!alt){toast('No hay ningún día mejor en los próximos siete');cerrar();return;}
    const otro=alt.fecha, dest=SEM[semanaId(lunesDe(otro))]||w;
    w.jornadas=(w.jornadas||[]).filter(j=>{
      if(j.fecha!==fecha)return true;
      dest.jornadas=dest.jornadas||[];
      dest.jornadas.push({fecha:otro,mes:mesDe(otro)});
      return false;
    });
    const mueve=w.bloques.filter(b=>b.fecha===fecha&&b.estado!=='hecho');
    mueve.forEach(b=>{b.fecha=otro;b.motivo='Movida por meteorología.';sello(b);});
    if(dest!==w){
      w.bloques=w.bloques.filter(b=>mueve.indexOf(b)<0);
      dest.bloques=dest.bloques.concat(mueve);
      sello(dest);recalcularSemana(dest);
    }
    registrarDiaPerdido(fecha,'movida');
    toast('Movida al '+DIAS3[diaSemana(otro)]+' '+espCorto(otro)+', que está en '+alt.estado);
  }
  if(v==='anular'||v==='interior'){
    w.bloques.forEach(b=>{
      if(b.fecha!==fecha)return;
      if(v==='interior'&&!(b.tipo==='coche'||b.proyecto==='CASA'))return;
      if(b.estado==='hecho')return;
      b.estado='anulado';sello(b);
      if(b.tareaId){D.deuda=D.deuda||[];D.deuda.push({id:uid('deu'),tareaId:b.tareaId,proyecto:b.proyecto,
        nombre:b.nombre,horas:(b.fin-b.ini)/60,semanaOrigen:w.id});}
    });
    w.jornadas=(w.jornadas||[]).filter(j=>j.fecha!==fecha);
    registrarDiaPerdido(fecha,v);
    toast('Jornada anulada. No consume cuota.');
  }
  if(v==='nada')registrarDiaPerdido(fecha,'mantenida');
  recalcularSemana(w);
  cerrar();guardarPronto();render();
  registrarAccion('Jornada por mal tiempo',()=>{w.bloques=foto.bloques;w.jornadas=foto.jor;D.deuda=foto.deuda;recalcularSemana(w);});
}
function registrarDiaPerdido(fecha,decision){
  D.meteo=D.meteo||{perdidos:[]};
  const e=evaluarDia(fecha);
  D.meteo.perdidos=D.meteo.perdidos.filter(x=>x.fecha!==fecha);
  D.meteo.perdidos.push({fecha,decision,estado:e?e.estado:'?',motivos:e?e.motivos:[],ts:AHORA()});
  INC.push({id:uid('inc'),fecha,tipo:'meteorología',alcance:decision,motivo:(e&&e.motivos[0])||''});
}
function diasPerdidos(desde,hasta){
  return ((D.meteo&&D.meteo.perdidos)||[]).filter(x=>x.fecha>=desde&&x.fecha<=hasta);
}

  }

    '<div class="row"><button class="btn ghost" data-act="cerrar">Cerrar</button></div>');return;}
  let h='<h3>'+DIAS[diaSemana(fecha)]+' '+esp(fecha)+'</h3>'+

     '<span class="kpi"><b>'+e.tMin+'–'+e.tMax+' °C</b><i>temperatura</i></span>'+
     '<span class="kpi"><b>'+e.mm+' mm</b><i>lluvia · '+e.probMax+' %</i></span>'+

  if(e.avisos.length)h+='<div class="warnbox" style="margin-bottom:10px">'+e.avisos.map(esc).join('<br>')+'</div>';

     '<p class="tiny muted" style="margin:3px 0 8px">El SATE no se aplica con el sol dando en el paño. Estas son las horas en sombra.</p>';
  o.panos.forEach(p=>{

    const ori=(ORIENTACIONES.find(x=>x[1]===p.orientacion)||['?'])[0];

      '<span class="tiny">'+(d.tramos.length?d.tramos.map(t=>hhmm(t[0])+'–'+hhmm(t[1])).join(', ')
        :'<span style="color:var(--bad)">sol todo el día</span>')+'</span></div>';
  });
  h+='<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="meteo-traer">Actualizar previsión</button>'+
     '<button class="btn ghost" data-act="cerrar">Cerrar</button></div>';
  if(meteoDesfasada())h+='<p class="tiny muted" style="margin-top:8px">Previsión de hace más de 3 horas.</p>';
  modal(h);

function bloqueMeteo(per,desde,hasta){
  if(!cfgObra().activo)return '';
  const ps=diasPerdidos(desde,hasta);
  const prev=[];
  per.forEach(p=>{
    let rojos=0,verdes=0,total=0;
    for(let f=p.desde;f<=p.hasta;f=addDays(f,1)){
      const d=diaSemana(f);
      if(d<5)continue;
      const e=evaluarDia(f);
      if(!e)continue;
      total++;if(e.estado==='rojo')rojos++;if(e.estado==='verde')verdes++;
    }
    prev.push({etq:p.etq,rojos,verdes,total,perdidos:ps.filter(x=>x.fecha>=p.desde&&x.fecha<=p.hasta).length});
  });
  if(!ps.length&&!prev.some(x=>x.total))return '';
  const perdidasReales=ps.filter(x=>x.decision!=='mantenida').length;
  const totalJor=perdidasReales+Object.values(todasSemanas()).reduce((a,w)=>a+((w.jornadas||[]).filter(j=>j.fecha>=desde&&j.fecha<=hasta).length),0);
  let h='<div class="card" style="margin-top:12px"><b style="font-size:14px">Meteorología y días de obra</b>'+
    '<p class="tiny muted" style="margin:3px 0 10px">Previsión frente a realidad. El Documento 3 suponía perder un 30 % de las jornadas: aquí se ve si acertaba.</p>';
  h+='<div class="row" style="gap:20px;margin-bottom:10px">'+
     '<span class="kpi"><b>'+perdidasReales+'</b><i>jornadas perdidas</i></span>'+
     '<span class="kpi"><b>'+(totalJor?Math.round(100*perdidasReales/totalJor):0)+' %</b><i>del total previsto</i></span>'+
     '<span class="kpi"><b>'+(meteoDisponible()?(meteoDesfasada()?'desfasada':'al día'):'sin datos')+'</b><i>previsión</i></span></div>';
  if(ps.length){
    h+='<table class="cfg"><tr><th>Fecha</th><th>Estado</th><th>Decisión</th><th>Motivo</th></tr>';
    ps.slice().sort((a,b)=>a.fecha<b.fecha?1:-1).slice(0,12).forEach(x=>{
      h+='<tr><td>'+esp(x.fecha)+'</td><td style="color:'+(COLOR_EST[x.estado]||'var(--muted)')+'">'+x.estado+'</td>'+
        '<td>'+esc(x.decision)+'</td><td class="tiny muted">'+esc((x.motivos||[])[0]||'')+'</td></tr>';
    });
    h+='</table>';
  }
  h+='</div>';
  return h;
}

  margen:{min:0,max:50,nombre:'el margen'},
  cuota:{min:0,max:8,nombre:'la cuota de fin de semana'},
  costeKm:{min:0,max:5,nombre:'el coste por kilómetro'},

  avisoDias:{min:1,max:120,nombre:'los días de aviso'},

  eur:{min:0,max:1e7,nombre:'el importe'},
  periodos:{min:1,max:24,nombre:'los periodos'}
};
const FECHA_MIN='2000-01-01', FECHA_MAX='2100-12-31';

/* Devuelve un número válido dentro del rango, o el de reserva.
   Si hubo que corregir, avisa una sola vez y sin dramatismo. */
function num(valor,clave,reserva){
  const L=LIMITES[clave]||{min:-1e12,max:1e12,nombre:'ese valor'};
  const base=(reserva===undefined?L.min:reserva);
  if(valor===''||valor===null||valor===undefined)return base;
  const n=Number(valor);
  if(!isFinite(n)){avisoDato(L.nombre+' tiene que ser un número');return base;}
  if(n<L.min){avisoDato(L.nombre+' no puede bajar de '+L.min);return L.min;}
  if(n>L.max){avisoDato(L.nombre+' no puede pasar de '+L.max);return L.max;}
  return Math.round(n*1000)/1000;
}
function fecha(valor,reserva){
  if(!valor)return reserva===undefined?null:reserva;
  const s=String(valor).slice(0,10);
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s)){avisoDato('la fecha no tiene un formato válido');return reserva===undefined?null:reserva;}
  const d=parse(s);
  if(isNaN(d.getTime())||iso(d)!==s){avisoDato('esa fecha no existe en el calendario');return reserva===undefined?null:reserva;}
  if(s<FECHA_MIN||s>FECHA_MAX){avisoDato('la fecha queda fuera de lo razonable');return reserva===undefined?null:reserva;}
  return s;
}
function texto(valor,max){
  return String(valor===undefined||valor===null?'':valor).replace(/\s+/g,' ').trim().slice(0,max||200);
}
var ultimoAviso=0;
function avisoDato(m){
  const ahora=Date.now();
  if(ahora-ultimoAviso<2500)return;      // no encadenar avisos al teclear
  ultimoAviso=ahora;
  registrarOperacion('validación','corregido: '+m,0,true);
  if(typeof toast==='function')toast('He ajustado '+m);
}

    disp:(D.config.sync&&D.config.sync.dispositivo)||'—',
    v:typeof VERSION_APP!=='undefined'?VERSION_APP:''});

function replanificar(lun,cap,off,jor){
  const prev0=SEM[semanaId(lun)];
  // lo que no debe perderse al regenerar: lo ya hecho y lo que creaste a mano.
  // Se calcula antes, para que el planificador no coloque nada encima.
  const conservados=prev0?(prev0.bloques||[]).filter(b=>
    b.estado==='hecho'||(b.origen==='manual'&&b.estado!=='anulado')):[];
  const cubierto={};
  conservados.forEach(b=>{if(b.tipo==='trabajo'&&b.tareaId&&b.estado!=='hecho')
    cubierto[b.tareaId]=(cubierto[b.tareaId]||0)+(b.fin-b.ini)/60;});
  const plan=generarPlan(lun,cap,off,{jornadas:jor,cubierto,
    ocupados:conservados.map(b=>({fecha:b.fecha,ini:b.ini,fin:b.fin}))});
  const prev=prev0;
  if(prev){
    conservados.forEach(b=>{
      if(!plan.bloques.some(x=>x.id===b.id))plan.bloques.push(b);
    });
    // y los que de verdad desaparecen se marcan como borrados, para que
    // el otro dispositivo los quite en vez de acumularlos
    (prev.bloques||[]).forEach(b=>{
      if(!plan.bloques.some(x=>x.id===b.id))anotarBorrado(b.id);
    });
  }
  SEM[plan.id]=plan;
  registrarDeuda(plan);
  recalcularSemana(plan);
  return plan;
}
function registrarSesion(b){
  const horas=(b.fin-b.ini)/60;
  if(b.tipo==='trabajo')SES.push({id:uid('s'),tareaId:b.tareaId||null,nombre:b.nombre,proyecto:b.proyecto,fecha:b.fecha,horas,bloqueId:b.id,autor:autorNombre()});
  else if(b.ejercicio)SES.push({id:uid('s'),tipo:'ejercicio',proyecto:'SALUD',fecha:b.fecha,horas,bloqueId:b.id,detalle:[],autor:autorNombre()});
  if(b.deudaId)saldarDeuda(b.deudaId,horas);
}

function anularDias(fechas,modo){
  const plan=planActual();if(!plan)return;
  fechas.forEach(f=>{
    plan.bloques.forEach(b=>{
      if(b.fecha!==f||b.estado==='hecho')return;
      if(modo==='obra'&&!(b.proyecto==='CASA'&&(b.tipo==='coche'||b.tareaId)))return;
      b.estado='anulado';
      if(b.tipo==='trabajo'&&b.tareaId){
        D.deuda=D.deuda||[];
        const ya=D.deuda.find(d=>d.tareaId===b.tareaId);
        const hs=(b.fin-b.ini)/60;
        if(ya)ya.horas+=hs;else D.deuda.push({id:uid('deu'),tareaId:b.tareaId,proyecto:b.proyecto,nombre:b.nombre,horas:hs,semanaOrigen:plan.id});
      }
    });
    if(modo!=='obra'&&!plan.diasOff.includes(f))plan.diasOff.push(f);
    if(modo==='obra')plan.jornadas=(plan.jornadas||[]).filter(j=>j.fecha!==f);
    INC.push({id:uid('inc'),fecha:f,tipo:modo==='obra'?'meteorología':'imprevisto',alcance:modo,motivo:''});
  });
  if(modo==='replan'){
    const restante=Math.max(0,plan.capacidad-plan.usadas*0.5);
    replanificar(plan.lunes,restante,plan.diasOff,plan.jornadas);
  }
  guardarPronto();
}

function importarLibro(wb){
  const hoja=n=>wb.Sheets[Object.keys(wb.Sheets).find(k=>k.toLowerCase().startsWith(n))];
  const rows=s=>s?XLSX.utils.sheet_to_json(s,{defval:''}):[];
  const pr=rows(hoja('proyecto')),hi=rows(hoja('hito')),ta=rows(hoja('tarea'));
  if(!pr.length)return toast('No encuentro la hoja Proyecto');
  const errores=[];const creados=[];
  const idValido=v=>{const x=String(v||'').trim();return x&&!/\s/.test(x)&&x.length<=24;};
  pr.forEach((r,i)=>{
    const id=String(r.id_proyecto||'').trim();
    if(!idValido(id)){                       // notas al pie y filas sueltas: se ignoran
      if(id&&String(r.nombre||'').trim())errores.push('Fila '+(i+2)+': «'+id.slice(0,30)+'» no vale como id_proyecto (sin espacios, hasta 24 caracteres)');
      return;
    }
    const hs=hi.filter(x=>String(x.id_proyecto).trim()===id);
    const suma=hs.reduce((a,x)=>a+Number(x.peso_1_a_100||0),0);
    if(hs.length&&Math.round(suma)!==100)errores.push('Proyecto '+id+': los pesos de los hitos suman '+suma+', no 100');
    creados.push({id,nombre:r.nombre||id,hitos:hs.length,tareas:ta.filter(x=>String(x.id_proyecto).trim()===id).length,raw:r,hs});
  });
  let h='<h3>Vista previa de la importación</h3><div class="mst">Nada se aplica hasta que confirmes.</div>';
  creados.forEach(c=>{const ex=P(c.id);
    h+='<div class="mopt" style="cursor:default"><b>'+esc(c.nombre)+'</b> — '+(ex?'actualizar el proyecto existente':'crear proyecto nuevo')+
       '<small>'+c.hitos+' hitos · '+c.tareas+' tareas</small></div>';});
  if(errores.length)h+='<div class="badbox" style="margin:10px 0">'+errores.map(esc).join('<br>')+'</div>';
  h+='<div class="row" style="margin-top:12px">'+(errores.length?'':'<button class="btn primary" data-act="import-ok">Aplicar</button>')+
     '<button class="btn ghost" data-act="cerrar">Cancelar</button></div>';
  window.__imp={pr,hi,ta};
  modal(h);
}
function aplicarImport(){
  const {pr,hi,ta}=window.__imp;
  const idValido=v=>{const x=String(v||'').trim();return x&&!/\s/.test(x)&&x.length<=24;};
  pr.forEach(r=>{
    const id=String(r.id_proyecto).trim();
    if(!idValido(id))return;
    let p=P(id);
    const base={id,nombre:r.nombre||id,color:'#'+String(r.color_hex||'7FB7E8').replace('#',''),
      tipo:(r.tipo||'finito').trim(),fechaInicio:fechaDe(r.fecha_inicio)||hoyISO(),
      fechaFin:fechaDe(r.fecha_fin),fechaLimite:fechaDe(r.fecha_limite_deseada),
      prioridad:Number(r.prioridad_1_a_5||3),pct:Number(r.porcentaje_reparto||10),
      minimo:Number(r.minimo_semanal_horas||0),activo:String(r.activo||'SI').toUpperCase()!=='NO'};
    if(!p){p=Object.assign(base,{hitos:[]});D.proyectos.push(p);}
    else Object.assign(p,base);
    hi.filter(x=>String(x.id_proyecto).trim()===id&&idValido(x.id_hito)).forEach(x=>{
      const hid=String(x.id_hito).trim();
      let hh=p.hitos.find(y=>y.id===hid);
      const b={id:hid,nombre:x.nombre_hito,peso:Number(x.peso_1_a_100||0),horas:Number(x.horas_estimadas||0),
        fecha:fechaDe(x.fecha_objetivo),estado:(x.estado||'pendiente').trim(),dependeDe:x.depende_de_id_hito||null};
      if(!hh){hh=Object.assign(b,{tareas:[]});p.hitos.push(hh);}else Object.assign(hh,b);
      ta.filter(y=>String(y.id_hito).trim()===hid&&idValido(y.id_tarea)).forEach(y=>{
        const tid=String(y.id_tarea).trim();
        const dz=String(y.requiere_desplazamiento||'NO').toUpperCase()==='SI';
        const tb={id:tid,nombre:y.nombre_tarea,horas:Number(y.horas_estimadas||0),contexto:y.contexto||'escritorio',
          critica:String(y.critica||'NO').toUpperCase()==='SI',bloqueante:String(y.bloqueante||'NO').toUpperCase()==='SI',
          desplaza:dz,estado:'pendiente',etiquetas:dz?['luz','jornadaContinua','fisica']:['escritorio']};
        const ex=hh.tareas.find(z=>z.id===tid);
        if(ex)Object.assign(ex,tb);else hh.tareas.push(tb);
      });
    });
  });
  guardarPronto();cerrar();vista='proyectos';render();toast('Importado');
}
function fechaDe(v){
  if(!v)return null;
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30+v));return iso(d);}
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}

/* nombre de una copia, evitando repetir «(copia)» una y otra vez */
function copiaNombre(n,existentes){
  const base=String(n||'').replace(/\s*\(copia( \d+)?\)$/,'');
  if(!existentes.includes(base+' (copia)'))return base+' (copia)';
  for(let i=2;i<50;i++)if(!existentes.includes(base+' (copia '+i+')'))return base+' (copia '+i+')';
  return base+' (copia)';
}

/* ---------- render ---------- */
function render(){
  const nav=$('#tabs');
  nav.innerHTML=VISTAS.map(([k,n])=>'<button data-act="tab" data-v="'+k+'" aria-current="'+(vista===k)+'">'+n+'</button>').join('');
  ajustarTabs(nav);
  $('#wkid').textContent=semanaId(lunesDe(hoyISO())).replace('-',' · ');
  const m={panorama:vPanorama,hoy:vHoy,semana:vSemana,analisis:vAnalisis,proyectos:vProyectos,config:vConfig};
  $('#app').innerHTML=(m[vista]||vPanorama)();
  pintarAviso();
  if(vista==='config')tamanoDatos().then(r=>{
    const e=document.getElementById('tam');if(!e)return;
    const arch=Object.keys(ARCH).length;
    e.textContent='Se sincronizan '+r.kb(r.sync)+' ('+Object.keys(SEM).length+' semanas vivas, '+SES.length+' sesiones)'+
      (arch?' · archivo aparte: '+r.kb(r.t.archivo)+' en '+arch+' semanas':'')+
      (r.cuota&&r.cuota.total?' · el navegador te deja '+r.kb(r.cuota.total):'');
  });
}

/* la pestaña activa se trae a la vista, y el difuminado desaparece al llegar al final */
function ajustarTabs(nav){
  if(!nav||!nav.querySelector)return;
  try{
    const act=nav.querySelector('[aria-current="true"]');
    if(act&&act.scrollIntoView)act.scrollIntoView({block:'nearest',inline:'center'});
    const fin=()=>{
      if(!nav.classList)return;
      const hay=nav.scrollWidth>nav.clientWidth+4;
      const alFinal=nav.scrollLeft+nav.clientWidth>=nav.scrollWidth-4;
      nav.classList.toggle('finTabs',!hay||alFinal);
    };
    fin();
    if(!nav.dataset.lst){nav.dataset.lst='1';nav.addEventListener('scroll',fin,{passive:true});}
  }catch(e){}
}

/* ---------- inicio ---------- */
(async function init(){
  semanaVista=lunesDe(hoyISO());
  const cfg=await store.get('config-y-proyectos');
  D=cfg||nuevaBase();
  D.deuda=D.deuda||[];D.borrados=D.borrados||[];
  D.config=Object.assign({},CONFIG_DEF,D.config||{});
  migrarReglas();migrarRecurrentes();migrarReparto();migrarV2();migrarV3();migrarV4();
  cargarExternos();
  SEM=(await store.get('semanas-plan'))||{};
  ARCH=(await store.get('archivo-semanas'))||{};
  SES=(await store.get('registro-sesiones'))||[];
  INC=(await store.get('incidencias'))||[];
  syncCfg();
  if(!cfg)await guardar(false);
  syncEstado=syncCfg().activo?'pend':'off';
  const arch=archivarViejas();
  if(arch){await guardarArchivo();await guardar(false);}
  render();pintarEstado();
  prepararApp();
  comprobarVersion();
  programarAvisoCierre();
  if(tocaCerrar()&&vista==='hoy')mCierre();
  sincronizar(false).then(()=>{escribirCalendario(false);leerCalendario(false);});
  if(cfgObra().activo)traerMeteo(false).then(()=>{
    render();
    const r=jornadasEnRiesgo();
    if(r.length&&!(D.meteo&&(D.meteo.perdidos||[]).some(x=>x.fecha===r[0].fecha)))mMalTiempo(r[0]);
  });
  bajarArchivo();
  arrancarLatido();
  document.addEventListener('visibilitychange',()=>{
    if(!document.hidden){pulso();comprobarVersion();}
    else despedida();                       // al irse a otra app, lo pendiente sale ya
  });
  window.addEventListener('pagehide',despedida);
  window.addEventListener('beforeunload',despedida);
  window.addEventListener('online',()=>sincronizar(false));
})();
