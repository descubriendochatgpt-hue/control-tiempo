function guardarEvento(){
  const e=leerEv();
  const plan=SEM[semanaId(lunesDe(e.fecha))];
  if(!plan){toast('Esa semana no está planificada todavía');return;}
  const [INI,FIN]=limitesDia();
  if(e.ini<INI||e.ini+e.dur>FIN){toast('Se sale del horario visible de la cuadrícula');return;}

  let tareaId=e.tareaId,nombre=e.nombre.trim(),hitoNombre=null;
  const p=P(e.proyecto),hi=p?p.hitos.find(x=>x.id===e.hitoId):null;
  if(hi)hitoNombre=hi.nombre;

  if(tareaId==='__nueva'){
    if(!nombre){toast('Ponle nombre a la subtarea');return;}
    if(!hi){toast('Elige antes la actividad principal');return;}
    tareaId=uid('T');
    hi.tareas.push({id:tareaId,nombre,horas:Number(e.horasNueva)||e.dur/60,contexto:'escritorio',
      estado:'pendiente',critica:false,bloqueante:false,desplaza:false,etiquetas:['escritorio']});
  }else if(tareaId){
    const t=hi?hi.tareas.find(x=>x.id===tareaId):null;
    nombre=t?t.nombre:nombre;
  }else if(!nombre){toast('Ponle nombre al bloque');return;}

  const viejo=e.id?plan.bloques.find(b=>b.id===e.id):null;
  const b=viejo||{id:uid('b'),tipo:'trabajo',estado:'planificado'};
  const antes=viejo?{fecha:viejo.fecha,ini:viejo.ini}:null;
  b.fecha=e.fecha;b.ini=e.ini;b.fin=e.ini+e.dur;
  b.proyecto=e.proyecto;b.tareaId=tareaId||null;b.hito=hitoNombre;
  b.nombre=nombre;b.nota=e.nota.trim()||null;
  b.motivo=(viejo?'Editado':'Creado')+' a mano el '+esp(hoyISO())+'.';
  if(!viejo){b.origen='manual';plan.bloques.push(b);}
  if(viejo&&viejo.estado==='hecho'&&antes&&(antes.fecha!==b.fecha)){
    SES.filter(s=>s.bloqueId===b.id).forEach(s=>{s.fecha=b.fecha;s.tareaId=b.tareaId;s.proyecto=b.proyecto;});
  }
  plan.porProyecto=plan.porProyecto||{};
  recalcularSemana(plan);
  cerrar();guardarPronto();render();
  toast(viejo?'Bloque actualizado':'Bloque creado');
}
function recalcularSemana(plan){
  const pp={};let u=0;
  plan.bloques.forEach(b=>{
    if(b.estado==='anulado')return;
    const hs=(b.fin-b.ini)/60;
    if(b.tipo==='trabajo'){pp[b.proyecto]=(pp[b.proyecto]||0)+hs;u+=hs;}
    else if(b.tipo==='reservado'&&P(b.proyecto))pp[b.proyecto]=(pp[b.proyecto]||0)+hs;
  });
  plan.porProyecto=pp;plan.usadas=u;
}
function borrarEvento(){
  const e=window.__ev,plan=SEM[semanaId(lunesDe(e.fecha))];
  const b=plan.bloques.find(x=>x.id===e.id);
  if(!b)return;
  if(b.estado==='hecho'){toast('Está marcado como hecho: deshazlo antes de borrarlo');return;}
  plan.bloques=plan.bloques.filter(x=>x.id!==e.id);
  recalcularSemana(plan);
  cerrar();guardarPronto();render();toast('Bloque eliminado');
}
/* notas de la semana, para la vista general */
function notasSemana(lunes){
  const plan=SEM[semanaId(lunes)];if(!plan)return [];
  return plan.bloques.filter(b=>b.nota&&b.estado!=='anulado')
    .sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.ini-b.ini);
}

/* ============================================================
   ORDEN DE PRIORIDADES ANTES DE PLANIFICAR
   El motor propone; tú reordenas, quitas y decides dónde cae el corte.
   ============================================================ */
function abrirCola(lunes,cap,off){
  const {cola,notas}=construirCola(lunes,cap);
  const semId=semanaId(lunes);
  const prev=SEM[semId];
  let jor=prev?(prev.jornadas||[]).slice():[];
  if(!prev){const j=proponerJornada(lunes,semId);
    const mins=activos().reduce((a,p)=>a+(p.minimo||0),0);
    if(j&&!off.includes(j.fecha)&&cap>=D.config.jornadaObra.horasTrabajo+mins*0.5)jor=[j];}
  window.__prio={lunes,cap,off,cola,notas,jor,jorOff:false};
  mCola();
}
function etiquetaRazon(it){
  if(it.prio===1)return 'Mínimo innegociable';
  if(it.prio===2)return it.bloqueante?'Bloquea otras tareas':'Crítica';
  if(it.prio===3)return it.razon;
  if(it.prio===4)return it.razon;
  return 'Reparto ordinario';
}
function mCola(){
  const S=window.__prio;
  const util=S.cap*(1-D.config.margenPct/100);
  const jorH=(S.jor.length&&!S.jorOff)?D.config.jornadaObra.horasTrabajo:0;
  let h='<h3>Orden de prioridades</h3>'+
    '<div class="mst">'+espCorto(S.lunes)+' – '+espCorto(addDays(S.lunes,6))+' · '+fmtH(S.cap)+
    ' declaradas, '+fmtH(util)+' repartibles tras el margen. Cambia el orden si esta semana tus prioridades son otras.</div>';

  if(S.jor.length){
    h+='<div class="colarow'+(S.jorOff?' off':'')+'" style="--pc:'+colorDe('CASA')+'">'+
       '<span class="n">•</span><span><b>Jornada completa de obra</b>'+
       '<span class="q">'+DIAS[diaSemana(S.jor[0].fecha)]+' '+esp(S.jor[0].fecha)+' · cuota del mes · se coloca antes que nada</span></span>'+
       '<span class="colabtns"><span class="h">'+fmtH(D.config.jornadaObra.horasTrabajo)+'</span>'+
       '<button data-act="jor-off" title="Quitar">'+(S.jorOff?'+':'×')+'</button></span></div>';
  }

  let acum=jorH,cortado=false,dentro=jorH,fuera=0;
  S.cola.forEach((it,i)=>{
    const p=P(it.proyecto);
    let parcial=null;
    if(!it.__off&&!it.desplaza){
      const hueco=Math.max(0,util-acum);
      if(!cortado&&hueco<it.pend-0.01)parcial=Math.round(hueco*10)/10;
      dentro+=Math.min(it.pend,hueco);
      fuera+=Math.max(0,it.pend-hueco);
      acum+=it.pend;
    }
    h+='<div class="colarow'+(it.__off?' off':'')+(cortado?' fuera':'')+'" style="--pc:'+colorDe(it.proyecto)+'">'+
      '<span class="n">'+(i+1)+'</span>'+
      '<span><b>'+esc(it.nombre)+'</b>'+
      '<span class="q">'+esc((p?p.nombre:it.proyecto)+(it.hitoNombre?' › '+it.hitoNombre:''))+' · '+esc(etiquetaRazon(it))+
      (it.desplaza?' · <b style="color:var(--warn)">solo en jornada de obra</b>':'')+'</span></span>'+
      '<span class="colabtns"><span class="h">'+fmtH(it.pend)+'</span>'+
      '<button data-act="cola-up" data-i="'+i+'" title="Subir">↑</button>'+
      '<button data-act="cola-down" data-i="'+i+'" title="Bajar">↓</button>'+
      '<button data-act="cola-off" data-i="'+i+'" title="Quitar de esta semana">'+(it.__off?'+':'×')+'</button></span></div>';
    if(parcial!==null&&!cortado){
      h+='<div class="corte">'+(parcial>=0.5
        ? 'de esta entran '+fmtH(parcial)+', el resto queda fuera'
        : 'hasta aquí llega la capacidad')+'</div>';
      cortado=true;
    }
  });
  if(!cortado&&S.cola.length)h+='<div class="corte">entra todo, sobran '+fmtH(Math.max(0,util-acum))+'</div>';
  if(!S.cola.length)h+='<p class="tiny muted" style="padding:12px 0">No hay nada pendiente que repartir.</p>';

  h+='<div class="row" style="margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-top:10px">'+
     '<button class="btn primary" data-act="cola-ok">Generar el plan</button>'+
     '<button class="btn ghost" data-act="cola-back">Volver</button>'+
     '<span class="spacer"></span><span class="tiny muted">Entran '+fmtH(dentro)+
     (fuera>0.05?' · fuera '+fmtH(fuera):'')+'</span></div>';
  modal(h);
}
/* ============================================================
   LISTAS ORDENABLES ARRASTRANDO (proyectos, hitos y subtareas)
   Mismo gesto que en la cuadrícula: ratón directo, táctil manteniendo pulsado.
   ============================================================ */
var arr=null;

function hermanos(el){
  return Array.from(el.parentElement.children).filter(x=>x.dataset&&x.dataset.sort===el.dataset.sort);
}
function aplicarOrden(el){
  const tipo=el.dataset.sort;
  const ids=hermanos(el).map(x=>x.dataset.id);
  if(tipo==='proyecto'){
    const m={};D.proyectos.forEach(p=>m[p.id]=p);
    const orden=ids.map(i=>m[i]).filter(Boolean);
    D.proyectos.forEach(p=>{if(!ids.includes(p.id))orden.push(p);});
    D.proyectos=orden;
  }else if(tipo==='hito'){
    const p=P(el.dataset.p);if(!p)return;
    const m={};p.hitos.forEach(x=>m[x.id]=x);
    p.hitos=ids.map(i=>m[i]).filter(Boolean).concat(p.hitos.filter(x=>!ids.includes(x.id)));
    p.hitos.forEach((x,i)=>{if(x.orden!==i){x.orden=i;tocar(x);}});
  }else if(tipo==='tarea'){
    const p=P(el.dataset.p);if(!p)return;
    const hi=p.hitos.find(x=>x.id===el.dataset.h);if(!hi)return;
    const m={};hi.tareas.forEach(x=>m[x.id]=x);
    hi.tareas=ids.map(i=>m[i]).filter(Boolean).concat(hi.tareas.filter(x=>!ids.includes(x.id)));
    hi.tareas.forEach((x,i)=>{if(x.orden!==i){x.orden=i;tocar(x);}});
  }
}
function iniciarArr(){
  if(!arr||arr.activo)return;
  arr.activo=true;
  arr.el.classList.add('movida');
  arr.el.style.pointerEvents='none';
  document.body.classList.add('ordenando');
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}
function finArr(commit){
  if(!arr)return;
  clearTimeout(arr.t);
  if(arr.activo){
    arr.el.classList.remove('movida');
    arr.el.style.pointerEvents='';
    document.body.classList.remove('ordenando');
    ultimoDrag=Date.now();
    if(commit&&arr.movido){
      aplicarOrden(arr.el);
      guardarPronto();render();
      toast({proyecto:'Orden de proyectos guardado',hito:'Orden de hitos guardado',tarea:'Orden de subtareas guardado'}[arr.el.dataset.sort]);
    }
  }
  arr=null;
}

document.addEventListener('pointerdown',e=>{
  if(vista!=='proyectos')return;
  if(e.target.closest('button')||e.target.closest('input'))return;
  const asa=e.target.closest('.asa');
  const el=e.target.closest('[data-sort]');
  if(!el)return;
  const tactil=e.pointerType!=='mouse';
  if(!asa&&!tactil)return;               // con ratón, solo desde el asa
  arr={el,x0:e.clientX,y0:e.clientY,activo:false,tactil,movido:false,t:null};
  if(tactil)arr.t=setTimeout(iniciarArr,260);
},{passive:true});

document.addEventListener('pointermove',e=>{
  if(!arr)return;
  if(!arr.activo){
    const d=Math.abs(e.clientX-arr.x0)+Math.abs(e.clientY-arr.y0);
    if(arr.tactil){if(d>12){clearTimeout(arr.t);arr=null;}return;}
    if(d>4)iniciarArr();else return;
  }
  const bajo=document.elementFromPoint(e.clientX,e.clientY);
  if(!bajo||!bajo.closest)return;
  const t=bajo.closest('[data-sort="'+arr.el.dataset.sort+'"]');
  if(!t||t===arr.el||t.parentElement!==arr.el.parentElement)return;
  const r=t.getBoundingClientRect();
  const antes=e.clientY<r.top+r.height/2;
  t.parentElement.insertBefore(arr.el,antes?t:t.nextSibling);
  arr.movido=true;
},{passive:true});

document.addEventListener('pointerup',()=>finArr(true));
document.addEventListener('pointercancel',()=>finArr(false));
/* ============================================================
   ANÁLISIS — objetivo contra realidad, semana a semana y mes a mes
   ============================================================ */
var anaModo='semana', anaN=12;

function primerDiaMes(s){return s.slice(0,7)+'-01';}
function ultimoDiaMes(s){const d=parse(primerDiaMes(s));d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d);}
function periodos(){
  const out=[];
  if(anaModo==='semana'){
    let l=lunesDe(hoyISO());
    for(let i=0;i<anaN;i++){out.unshift({id:semanaId(l),etq:espCorto(l),desde:l,hasta:addDays(l,6)});l=addDays(l,-7);}
  }else{
    const d=parse(hoyISO());
    for(let i=0;i<anaN;i++){
      const m=new Date(d.getFullYear(),d.getMonth()-i,1);
      const s=iso(m);
      out.unshift({id:s.slice(0,7),etq:MESES[m.getMonth()].slice(0,3)+' '+String(m.getFullYear()).slice(2),
        desde:primerDiaMes(s),hasta:ultimoDiaMes(s)});
    }
  }
  return out;
}
function realEn(desde,hasta){
  const r={};
  SES.forEach(s=>{if(s.fecha>=desde&&s.fecha<=hasta)r[s.proyecto]=(r[s.proyecto]||0)+s.horas;});
  return r;
}
function previstoEn(desde,hasta){
  const r={};
  Object.values(SEM).forEach(w=>{
    if(w.lunes<desde||w.lunes>hasta)return;
    Object.keys(w.porProyecto||{}).forEach(k=>r[k]=(r[k]||0)+w.porProyecto[k]);
  });
  return r;
}
function conReparto(){return D.proyectos.filter(p=>(p.pct||0)>0);}
function objetivoPct(pid){
  const act=conReparto().filter(p=>p.activo);
  const tot=act.reduce((a,p)=>a+(p.pct||0),0)||1;
  const p=P(pid);
  return p&&p.activo?100*(p.pct||0)/tot:null;
}
function sumaObj(o){return Object.values(o).reduce((a,b)=>a+b,0);}

/* ---------- gráfico de barras apiladas ---------- */
function barras(per,datos,previstos){
  const W=720,H=210,L=34,B=26,T=8;
  const max=Math.max(1,...per.map(p=>sumaObj(datos[p.id]||{})),...per.map(p=>sumaObj(previstos[p.id]||{})));
  const paso=(W-L)/per.length, ancho=Math.min(38,paso*0.56);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img">';
  for(let i=0;i<=4;i++){
    const v=max*i/4;
    g+='<line x1="'+L+'" y1="'+y(v)+'" x2="'+W+'" y2="'+y(v)+'" stroke="#2B333C" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" fill="#5C6874" font-size="9" text-anchor="end">'+Math.round(v)+'</text>';
  }
  const saltoEtq=Math.ceil(per.length/12);
  per.forEach((p,i)=>{
    const x=L+paso*i+(paso-ancho)/2;
    let acc=0;
    D.proyectos.forEach(pr=>{
      const v=(datos[p.id]||{})[pr.id]||0;if(v<=0)return;
      const h1=(H-T-B)*v/max;
      g+='<rect x="'+x+'" y="'+(y(acc)-h1)+'" width="'+ancho+'" height="'+h1+'" fill="'+pr.color+'" rx="2">'+
         '<title>'+esc(p.etq+' · '+pr.nombre+' · '+fmtH(v))+'</title></rect>';
      acc+=v;
    });
    const prev=sumaObj(previstos[p.id]||{});
    if(prev>0)g+='<line x1="'+(x-3)+'" y1="'+y(prev)+'" x2="'+(x+ancho+3)+'" y2="'+y(prev)+'" stroke="#8B98A5" stroke-width="1.5" stroke-dasharray="3 2"><title>'+esc('Previsto '+fmtH(prev))+'</title></line>';
    if((per.length-1-i)%saltoEtq===0)
      g+='<text x="'+(x+ancho/2)+'" y="'+(H-9)+'" fill="#8B98A5" font-size="9" text-anchor="middle">'+esc(p.etq)+'</text>';
  });
  g+='</svg>';
  return g;
}

function vAnalisis(){
  const per=periodos();
  const datos={},previstos={};
  per.forEach(p=>{datos[p.id]=realEn(p.desde,p.hasta);previstos[p.id]=previstoEn(p.desde,p.hasta);});
  const desde=per[0].desde,hasta=per[per.length-1].hasta;
  const real=realEn(desde,hasta),prev=previstoEn(desde,hasta);
  const totalReal=sumaObj(real),totalPrev=sumaObj(prev);
  const repRealTot=conReparto().reduce((a,p)=>a+(real[p.id]||0),0);

  let h='<div class="row" style="margin-bottom:4px"><h2 class="vh">Análisis</h2><span class="spacer"></span>'+
    '<button class="btn sm '+(anaModo==='semana'?'':'ghost')+'" data-act="ana-modo" data-v="semana">Semanas</button>'+
    '<button class="btn sm '+(anaModo==='mes'?'':'ghost')+'" data-act="ana-modo" data-v="mes">Meses</button></div>'+
    '<p class="sub">'+espCorto(desde)+' – '+espCorto(hasta)+' · lo que dijiste que ibas a dedicar frente a lo que dedicaste.</p>';

  h+='<div class="card" style="margin-bottom:12px"><div class="row" style="gap:20px">'+
     '<span class="kpi"><b>'+fmtH(totalReal)+'</b><i>registradas</i></span>'+
     '<span class="kpi"><b>'+fmtH(totalPrev)+'</b><i>planificadas</i></span>'+
     '<span class="kpi"><b style="color:'+(totalPrev&&totalReal/totalPrev>=0.8?'var(--ok)':'var(--warn)')+'">'+
       (totalPrev?Math.round(100*totalReal/totalPrev):0)+' %</b><i>cumplimiento</i></span>'+
     '<span class="spacer"></span>'+
     '</div>'+
     '<div class="rango"><span class="tiny muted">1</span>'+
     '<input type="range" min="1" max="24" step="1" value="'+anaN+'" data-act="ana-n" aria-label="Periodos a analizar">'+
     '<span class="tiny muted">24</span>'+
     '<span class="rlbl" id="anaLbl">'+anaN+' '+(anaModo==='semana'?(anaN===1?'semana':'semanas'):(anaN===1?'mes':'meses'))+'</span></div>'+
     '</div>';

  h+='<div class="card" style="margin-bottom:12px"><b style="font-size:14px">Horas por '+(anaModo==='semana'?'semana':'mes')+'</b>'+
     '<p class="tiny muted" style="margin:3px 0 8px">La raya discontinua es lo que el plan había reservado.</p>'+
     barras(per,datos,previstos)+
     '<div class="legend" style="margin-top:4px">'+D.proyectos.map(p=>'<span><i style="background:'+p.color+'"></i>'+esc(p.nombre)+'</span>').join('')+'</div></div>';

  // objetivo contra realidad
  h+='<div class="card" style="margin-bottom:12px"><b style="font-size:14px">Objetivo contra realidad</b>'+
     '<p class="tiny muted" style="margin:3px 0 10px">Sobre todas las horas registradas en proyectos. Los bloques personales quedan fuera.</p>';
  conReparto().forEach(p=>{
    const obj=objetivoPct(p.id)||0;
    const rl=repRealTot?100*(real[p.id]||0)/repRealTot:0;
    const dif=rl-obj;
    const col=Math.abs(dif)<=7?'var(--ok)':Math.abs(dif)<=15?'var(--warn)':'var(--bad)';
    const veredicto=Math.abs(dif)<=7?'en línea':dif<0?'por debajo':'por encima';
    h+='<div class="objrow"><span class="on"><span class="dot" style="background:'+p.color+'"></span>'+esc(p.nombre)+'</span>'+
      '<span class="ob"><span class="track"><i style="width:'+Math.min(100,obj)+'%;background:var(--line2)"></i></span>'+
      '<span class="track" style="margin-top:3px"><i style="width:'+Math.min(100,rl)+'%;background:'+p.color+'"></i></span></span>'+
      '<span class="oc"><b>'+Math.round(rl)+' %</b><i>de '+Math.round(obj)+' % previsto</i></span>'+
      '<span class="od" style="color:'+col+'">'+(dif>=0?'+':'')+Math.round(dif)+' pts<br><span class="tiny">'+veredicto+'</span></span></div>';
  });
  const sinObj=D.proyectos.filter(p=>!(p.pct>0)&&(real[p.id]||0)>0);
  if(sinObj.length)h+='<p class="tiny muted" style="margin-top:10px">Sin porcentaje asignado: '+
    sinObj.map(p=>esc(p.nombre)+' '+fmtH(real[p.id])).join(' · ')+'. Ponles uno en Proyectos para poder compararlos.</p>';
  h+='</div>';

  // desglose por hito y subtarea
  const porTarea={};
  SES.forEach(s=>{if(s.fecha<desde||s.fecha>hasta)return;
    const k=s.tareaId||(s.tipo==='ejercicio'?'ejercicio:'+s.proyecto:'libre:'+s.proyecto+':'+(s.nombre||'bloque suelto'));
    porTarea[k]=(porTarea[k]||0)+s.horas;});
  const filas=[];
  Object.keys(porTarea).forEach(k=>{
    let pid=null,hn='—',tn=k,est=null,rec=false;
    if(k.startsWith('ejercicio:')){pid=k.split(':')[1];hn='Hábito diario';tn='Sesiones de ejercicio';rec=true;}
    else if(k.startsWith('libre:')){const q=k.split(':');pid=q[1];tn=q.slice(2).join(':');hn='Bloque suelto';}
    else D.proyectos.forEach(p=>p.hitos.forEach(hh=>hh.tareas.forEach(t=>{
      if(t.id===k){pid=p.id;hn=hh.nombre;tn=t.nombre;rec=!!t.rec;est=t.rec?null:t.horas;}})));
    if(!pid)return;
    filas.push({pid,hn,tn,h:porTarea[k],est,rec});
  });
  filas.sort((a,b)=>b.h-a.h);
  h+='<div class="card"><b style="font-size:14px">En qué se fueron las horas</b>'+
     '<div style="overflow-x:auto;margin-top:8px"><table class="cfg"><tr><th>Proyecto</th><th>Hito</th><th>Subtarea</th><th>Horas</th><th>Sobre estimado</th></tr>';
  if(!filas.length)h+='<tr><td colspan="5" class="tiny muted" style="padding:12px 0">Todavía no hay horas registradas en este periodo.</td></tr>';
  filas.forEach(f=>{
    const pc=f.est?Math.round(100*f.h/f.est):null;
    const col=pc==null?'var(--muted)':pc>110?'var(--bad)':pc>=90?'var(--warn)':'var(--ok)';
    h+='<tr><td><span class="dot" style="background:'+colorDe(f.pid)+'"></span>'+esc(nombreDe(f.pid))+'</td>'+
      '<td class="tiny muted">'+esc(f.hn)+'</td><td>'+esc(f.tn)+'</td><td>'+fmtH(f.h)+'</td>'+
      '<td style="color:'+col+'">'+(pc==null?(f.rec?'recurrente':'sin estimación'):pc+' % de '+fmtH(f.est))+'</td></tr>';
  });
  h+='</table></div></div>';
  return h;
}
/* ============================================================
   PROYECTOS COMPARTIDOS
   Se comparte el proyecto (hitos, subtareas, estimaciones, orden y horas
   registradas). No se comparte el calendario, ni la capacidad, ni el
   porcentaje de tiempo: eso es de cada uno.
   ============================================================ */
const AHORA=()=>new Date().toISOString();
const VIEJO='2000-01-01T00:00:00.000Z';

function compartidos(){D.config.compartidos=D.config.compartidos||[];return D.config.compartidos;}
function canalDe(pid){return compartidos().find(c=>c.proyectoId===pid&&c.activo);}
function autorNombre(){return (D.config.autor||'').trim()||(D.config.sync&&D.config.sync.dispositivo)||'Yo';}
function tocar(o){o.actualizado=AHORA();return o;}
function borrados(){D.borrados=D.borrados||[];return D.borrados;}
function anotarBorrado(id){borrados().push({id,ts:AHORA()});if(borrados().length>800)D.borrados=borrados().slice(-500);}

/* ---------- empaquetar ---------- */
function proyectoPaquete(pid){
  const p=P(pid);if(!p)return null;
  const hitos=p.hitos.map((h,i)=>({id:h.id,nombre:h.nombre,peso:h.peso,horas:h.horas,fecha:h.fecha,
    estado:h.estado,orden:i,actualizado:h.actualizado||VIEJO}));
  const tareas=[];
  p.hitos.forEach(h=>h.tareas.forEach((t,i)=>tareas.push(Object.assign({},t,{hito:h.id,orden:i,
    actualizado:t.actualizado||VIEJO}))));
  const ses=SES.filter(s=>s.proyecto===pid).map(s=>Object.assign({},s,{autor:s.autor||autorNombre()}));
  return {proyecto:{id:p.id,nombre:p.nombre,color:p.color,tipo:p.tipo,fechaLimite:p.fechaLimite,
            actualizado:p.actualizado||VIEJO},
          hitos,tareas,sesiones:ses,borrados:borrados(),actualizado:AHORA(),autor:autorNombre()};
}

/* ---------- fusionar: gana la edición más reciente de cada pieza ---------- */
function fusionarProyecto(pid,rem){
  const p=P(pid);
  if(!p||!rem)return null;
  const r={nuevosHitos:0,nuevasTareas:0,cambios:0,horas:0};

  if(rem.proyecto&&(rem.proyecto.actualizado||VIEJO)>(p.actualizado||VIEJO)){
    p.nombre=rem.proyecto.nombre;p.color=rem.proyecto.color;
    p.fechaLimite=rem.proyecto.fechaLimite;p.actualizado=rem.proyecto.actualizado;r.cambios++;
  }
  // borrados: unión de las dos listas
  const bmap={};[...borrados(),...(rem.borrados||[])].forEach(b=>{if(!bmap[b.id]||bmap[b.id]<b.ts)bmap[b.id]=b.ts;});
  D.borrados=Object.keys(bmap).map(id=>({id,ts:bmap[id]}));

  // hitos
  const mh={};p.hitos.forEach(h=>mh[h.id]=h);
  (rem.hitos||[]).forEach(rh=>{
    const lh=mh[rh.id];
    if(!lh){
      if(bmap[rh.id]&&bmap[rh.id]>(rh.actualizado||VIEJO))return;
      p.hitos.push({id:rh.id,nombre:rh.nombre,peso:rh.peso,horas:rh.horas,fecha:rh.fecha,
        estado:rh.estado,orden:rh.orden,actualizado:rh.actualizado,tareas:[]});
      r.nuevosHitos++;
    }else if((rh.actualizado||VIEJO)>(lh.actualizado||VIEJO)){
      Object.assign(lh,{nombre:rh.nombre,peso:rh.peso,horas:rh.horas,fecha:rh.fecha,
        estado:rh.estado,orden:rh.orden,actualizado:rh.actualizado});r.cambios++;
    }else if(lh.orden===undefined)lh.orden=rh.orden;
  });
  // tareas
  const mt={};p.hitos.forEach(h=>h.tareas.forEach(t=>mt[t.id]={t,h}));
  (rem.tareas||[]).forEach(rt=>{
    const dest=p.hitos.find(h=>h.id===rt.hito);
    const cur=mt[rt.id];
    if(!cur){
      if(!dest)return;
      if(bmap[rt.id]&&bmap[rt.id]>(rt.actualizado||VIEJO))return;
      const copia=Object.assign({},rt);delete copia.hito;
      dest.tareas.push(copia);r.nuevasTareas++;
    }else if((rt.actualizado||VIEJO)>(cur.t.actualizado||VIEJO)){
      const copia=Object.assign({},rt);delete copia.hito;
      if(dest&&dest.id!==cur.h.id){                       // ha cambiado de hito
        cur.h.tareas=cur.h.tareas.filter(x=>x.id!==rt.id);
        dest.tareas.push(copia);
      }else Object.assign(cur.t,copia);
      r.cambios++;
    }
  });
  // aplicar borrados y reordenar
  p.hitos=p.hitos.filter(h=>!(bmap[h.id]&&bmap[h.id]>(h.actualizado||VIEJO)));
  p.hitos.forEach(h=>{h.tareas=h.tareas.filter(t=>!(bmap[t.id]&&bmap[t.id]>(t.actualizado||VIEJO)));});
  p.hitos.sort((a,b)=>(a.orden==null?99:a.orden)-(b.orden==null?99:b.orden));
  p.hitos.forEach((h,i)=>{h.orden=i;h.tareas.sort((a,b)=>(a.orden==null?99:a.orden)-(b.orden==null?99:b.orden));
    h.tareas.forEach((t,j)=>t.orden=j);});

  // horas: unión por identificador, cada una con su autor
  const vistas={};SES.forEach(s=>vistas[s.id]=true);
  (rem.sesiones||[]).forEach(s=>{
    if(vistas[s.id])return;
    if(bmap[s.id])return;
    SES.push(Object.assign({},s,{proyecto:pid}));r.horas+=s.horas;
  });
  return r;
}

/* ---------- unirse: el proyecto del canal sustituye al local ---------- */
function adoptarProyecto(pid,rem){
  const p=P(pid);
  if(!p||!rem)return null;
  // al unirse se descarta lo local en silencio: nunca estuvo en el canal,
  // así que no se anota como borrado (haría desaparecer lo del otro lado)
  p.nombre=rem.proyecto.nombre;p.color=rem.proyecto.color;
  p.fechaLimite=rem.proyecto.fechaLimite;p.actualizado=rem.proyecto.actualizado;
  p.hitos=(rem.hitos||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0)).map(h=>({
    id:h.id,nombre:h.nombre,peso:h.peso,horas:h.horas,fecha:h.fecha,estado:h.estado,
    orden:h.orden,actualizado:h.actualizado,
    tareas:(rem.tareas||[]).filter(t=>t.hito===h.id).sort((a,b)=>(a.orden||0)-(b.orden||0))
      .map(t=>{const c=Object.assign({},t);delete c.hito;return c;})}));
  SES=SES.filter(s=>s.proyecto!==pid);
  (rem.sesiones||[]).forEach(s=>SES.push(Object.assign({},s,{proyecto:pid})));
  D.borrados=(rem.borrados||[]).slice();
  return {hitos:p.hitos.length,tareas:(rem.tareas||[]).length};
}

/* ---------- sincronizar un canal ---------- */
async function llamarCanal(c,accion,payload){
  const r=await fetch(c.url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({clave:c.clave,accion,proyecto:c.canal||'canal',payload})});
  const txt=await r.text();
  let j;try{j=JSON.parse(txt);}catch(e){throw new Error('respuesta inesperada: revisa que el acceso sea «cualquier persona»');}
  if(j.error)throw new Error(j.error);
  return j;
}
async function sincronizarCanal(c,manual,unirse){
  if(!c.activo||!c.url||!P(c.proyectoId))return null;
  const j=await llamarCanal(c,'leerProyecto');
  const rem=j.payload;
  let res=null;
  if(unirse){
    if(!rem||!rem.proyecto){if(manual)toast('El canal está vacío: que la otra persona pulse antes «Compartir el mío»');return null;}
    const a=adoptarProyecto(c.proyectoId,rem);
    c.base=rem.actualizado;c.ultima=AHORA();
    if(manual)toast('Te has unido: '+a.hitos+' hitos y '+a.tareas+' subtareas');
    return a;
  }
  if(rem&&rem.actualizado!==c.base)res=fusionarProyecto(c.proyectoId,rem);
  const p=proyectoPaquete(c.proyectoId);
  await llamarCanal(c,'guardarProyecto',p);
  c.base=p.actualizado;c.ultima=AHORA();
  if(manual){
    const n=res?(res.nuevosHitos+res.nuevasTareas+res.cambios):0;
    toast(n?('Actualizado: '+n+' cambio(s) de '+(rem.autor||'tu socio')):'Compartido al día');
  }
  return res;
}
async function sincronizarCompartidos(manual,unirsePid){
  const cs=compartidos().filter(c=>c.activo);
  if(!cs.length)return;
  for(const c of cs){
    try{await sincronizarCanal(c,manual,unirsePid===c.proyectoId);}
    catch(e){console.warn('canal',c.proyectoId,e);if(manual)toast('Canal de '+nombreDe(c.proyectoId)+': '+e.message);}
  }
  await guardar(false);render();
}

/* ---------- horas por persona ---------- */
function horasPorAutor(pid,desde,hasta){
  const r={};
  SES.forEach(s=>{
    if(s.proyecto!==pid)return;
    if(desde&&(s.fecha<desde||s.fecha>hasta))return;
    const a=s.autor||autorNombre();
    r[a]=(r[a]||0)+s.horas;
  });
  return r;
}

function replanificar(lun,cap,off,jor){
  const plan=generarPlan(lun,cap,off,{jornadas:jor});
  const prev=SEM[plan.id];
  if(prev){ // conservar lo ya hecho
    prev.bloques.filter(b=>b.estado==='hecho').forEach(b=>{
      const eq=plan.bloques.find(x=>x.fecha===b.fecha&&x.ini===b.ini&&x.nombre===b.nombre);
      if(eq)eq.estado='hecho';else plan.bloques.push(b);
    });
  }
  SEM[plan.id]=plan;
  registrarDeuda(plan);
  return plan;
}

function registrarSesion(b){
  const horas=(b.fin-b.ini)/60;
  if(b.tipo==='trabajo')SES.push({id:uid('s'),tareaId:b.tareaId||null,nombre:b.nombre,proyecto:b.proyecto,fecha:b.fecha,horas,bloqueId:b.id,autor:autorNombre()});
  else if(b.ejercicio)SES.push({id:uid('s'),tipo:'ejercicio',proyecto:'SALUD',fecha:b.fecha,horas,bloqueId:b.id,detalle:[],autor:autorNombre()});
  if(b.deudaId)saldarDeuda(b.deudaId,horas);
}

function anularDias(fechas,modo){
  const plan=planActual();if(!plan)return;
  fechas.forEach(f=>{
    plan.bloques.forEach(b=>{
      if(b.fecha!==f||b.estado==='hecho')return;
      if(modo==='obra'&&!(b.proyecto==='CASA'&&(b.tipo==='coche'||b.tareaId)))return;
      b.estado='anulado';
      if(b.tipo==='trabajo'&&b.tareaId){
        D.deuda=D.deuda||[];
        const ya=D.deuda.find(d=>d.tareaId===b.tareaId);
        const hs=(b.fin-b.ini)/60;
        if(ya)ya.horas+=hs;else D.deuda.push({id:uid('deu'),tareaId:b.tareaId,proyecto:b.proyecto,nombre:b.nombre,horas:hs,semanaOrigen:plan.id});
      }
    });
    if(modo!=='obra'&&!plan.diasOff.includes(f))plan.diasOff.push(f);
    if(modo==='obra')plan.jornadas=(plan.jornadas||[]).filter(j=>j.fecha!==f);
    INC.push({id:uid('inc'),fecha:f,tipo:modo==='obra'?'meteorología':'imprevisto',alcance:modo,motivo:''});
  });
  if(modo==='replan'){
    const restante=Math.max(0,plan.capacidad-plan.usadas*0.5);
    replanificar(plan.lunes,restante,plan.diasOff,plan.jornadas);
  }
  guardarPronto();
}

/* ---------- importación ---------- */
function importarLibro(wb){
  const hoja=n=>wb.Sheets[Object.keys(wb.Sheets).find(k=>k.toLowerCase().startsWith(n))];
  const rows=s=>s?XLSX.utils.sheet_to_json(s,{defval:''}):[];
  const pr=rows(hoja('proyecto')),hi=rows(hoja('hito')),ta=rows(hoja('tarea'));
  if(!pr.length)return toast('No encuentro la hoja Proyecto');
  const errores=[];const creados=[];
  pr.forEach((r,i)=>{
    const id=String(r.id_proyecto||'').trim();
    if(!id)return errores.push('Proyecto fila '+(i+2)+': falta id_proyecto');
    const hs=hi.filter(x=>String(x.id_proyecto).trim()===id);
    const suma=hs.reduce((a,x)=>a+Number(x.peso_1_a_100||0),0);
    if(hs.length&&Math.round(suma)!==100)errores.push('Proyecto '+id+': los pesos de los hitos suman '+suma+', no 100');
    creados.push({id,nombre:r.nombre||id,hitos:hs.length,tareas:ta.filter(x=>String(x.id_proyecto).trim()===id).length,raw:r,hs});
  });
  let h='<h3>Vista previa de la importación</h3><div class="mst">Nada se aplica hasta que confirmes.</div>';
  creados.forEach(c=>{const ex=P(c.id);
    h+='<div class="mopt" style="cursor:default"><b>'+esc(c.nombre)+'</b> — '+(ex?'actualizar el proyecto existente':'crear proyecto nuevo')+
       '<small>'+c.hitos+' hitos · '+c.tareas+' tareas</small></div>';});
  if(errores.length)h+='<div class="badbox" style="margin:10px 0">'+errores.map(esc).join('<br>')+'</div>';
  h+='<div class="row" style="margin-top:12px">'+(errores.length?'':'<button class="btn primary" data-act="import-ok">Aplicar</button>')+
     '<button class="btn ghost" data-act="cerrar">Cancelar</button></div>';
  window.__imp={pr,hi,ta};
  modal(h);
}
function aplicarImport(){
  const {pr,hi,ta}=window.__imp;
  pr.forEach(r=>{
    const id=String(r.id_proyecto).trim();
    let p=P(id);
    const base={id,nombre:r.nombre||id,color:'#'+String(r.color_hex||'7FB7E8').replace('#',''),
      tipo:(r.tipo||'finito').trim(),fechaInicio:fechaDe(r.fecha_inicio)||hoyISO(),
      fechaFin:fechaDe(r.fecha_fin),fechaLimite:fechaDe(r.fecha_limite_deseada),
      prioridad:Number(r.prioridad_1_a_5||3),pct:Number(r.porcentaje_reparto||10),
      minimo:Number(r.minimo_semanal_horas||0),activo:String(r.activo||'SI').toUpperCase()!=='NO'};
    if(!p){p=Object.assign(base,{hitos:[]});D.proyectos.push(p);}
    else Object.assign(p,base);
    hi.filter(x=>String(x.id_proyecto).trim()===id).forEach(x=>{
      const hid=String(x.id_hito).trim();
      let hh=p.hitos.find(y=>y.id===hid);
      const b={id:hid,nombre:x.nombre_hito,peso:Number(x.peso_1_a_100||0),horas:Number(x.horas_estimadas||0),
        fecha:fechaDe(x.fecha_objetivo),estado:(x.estado||'pendiente').trim(),dependeDe:x.depende_de_id_hito||null};
      if(!hh){hh=Object.assign(b,{tareas:[]});p.hitos.push(hh);}else Object.assign(hh,b);
      ta.filter(y=>String(y.id_hito).trim()===hid).forEach(y=>{
        const tid=String(y.id_tarea).trim();
        const dz=String(y.requiere_desplazamiento||'NO').toUpperCase()==='SI';
        const tb={id:tid,nombre:y.nombre_tarea,horas:Number(y.horas_estimadas||0),contexto:y.contexto||'escritorio',
          critica:String(y.critica||'NO').toUpperCase()==='SI',bloqueante:String(y.bloqueante||'NO').toUpperCase()==='SI',
          desplaza:dz,estado:'pendiente',etiquetas:dz?['luz','jornadaContinua','fisica']:['escritorio']};
        const ex=hh.tareas.find(z=>z.id===tid);
        if(ex)Object.assign(ex,tb);else hh.tareas.push(tb);
      });
    });
  });
  guardarPronto();cerrar();render();toast('Importado');
}
function fechaDe(v){
  if(!v)return null;
  if(typeof v==='number'){const d=new Date(Date.UTC(1899,11,30+v));return iso(d);}
  const s=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m)return m[3]+'-'+pad(+m[2])+'-'+pad(+m[1]);
  return null;
}

  if(a==='cerrar-ov'&&e.target.closest('[data-stop]'))return;
  switch(a){
   case 'tab': vista=el.dataset.v;sel.clear();render();break;
   case 'cerrar': case 'cerrar-ov': cerrar();break;
   case 'ir-semana': vista='semana';semanaVista=lunesDe(hoyISO());render();break;
   case 'ver-proyecto': vista='proyectos';render();break;
   case 'sem': semanaVista=addDays(semanaVista,7*Number(el.dataset.d));sel.clear();render();break;
   case 'sem-hoy': semanaVista=lunesDe(hoyISO());render();break;
   case 'declarar': offTmp=(planActual()?planActual().diasOff.slice():[]);mDeclarar();break;
   case 'cap-quick': $('#capin').value=el.dataset.v;break;
   case 'off-toggle':{const f=el.dataset.f;
     if(offTmp.includes(f)){offTmp=offTmp.filter(x=>x!==f);el.classList.add('ghost');}
     else{offTmp.push(f);el.classList.remove('ghost');}break;}
   case 'cap-ok':{const c=Number($('#capin').value||0);replanificar(semanaVista,c,offTmp||[],null);
     cerrar();guardarPronto();render();toast('Plan generado');break;}
   case 'cap-next':{const c=Number($('#capin').value||0);
     if(c<=0){toast('Declara cuántas horas tienes');break;}
     abrirCola(semanaVista,c,offTmp||[]);break;}
   case 'cola-up': case 'cola-down':{
     const S=window.__prio,i=Number(el.dataset.i),j=a==='cola-up'?i-1:i+1;
     if(j<0||j>=S.cola.length)break;
     const t=S.cola[i];S.cola[i]=S.cola[j];S.cola[j]=t;mCola();break;}
   case 'cola-off':{const S=window.__prio,i=Number(el.dataset.i);
     S.cola[i].__off=!S.cola[i].__off;mCola();break;}
   case 'jor-off': window.__prio.jorOff=!window.__prio.jorOff;mCola();break;
   case 'cola-back': mDeclarar();break;
   case 'cola-ok':{const S=window.__prio;
     const cola=S.cola.filter(x=>!x.__off);
     const plan=generarPlan(S.lunes,S.cap,S.off,{cola,notas:S.notas,jornadas:S.jorOff?[]:S.jor});
     const prevP=SEM[plan.id];
     if(prevP)prevP.bloques.filter(b=>b.estado==='hecho').forEach(b=>{
       const eq=plan.bloques.find(x=>x.fecha===b.fecha&&x.ini===b.ini&&x.nombre===b.nombre);
       if(eq)eq.estado='hecho';else plan.bloques.push(b);});
     if(prevP)prevP.bloques.filter(b=>b.origen==='manual'&&b.estado!=='hecho').forEach(b=>plan.bloques.push(b));
     SEM[plan.id]=plan;registrarDeuda(plan);recalcularSemana(plan);
     cerrar();guardarPronto();render();toast('Plan generado con tu orden');break;}
   case 'blk': if(Date.now()-ultimoDrag<350)break; mBloque(id);break;
   case 'celda':{
     const f=el.dataset.f,m=Number(el.dataset.m||600);
     const plan=SEM[semanaId(lunesDe(f))];
     if(!plan){toast('Declara antes la capacidad de esa semana');break;}
     window.__ev=evNuevo(f,m);mEvento();break;}
   case 'ev-edit':{
     const plan=planActual()||SEM[semanaId(lunesDe(hoyISO()))];
     const b=plan.bloques.find(x=>x.id===id);if(!b)break;
     window.__ev=evDe(b);mEvento();break;}
   case 'ev-save': guardarEvento();break;
   case 'ev-del': borrarEvento();break;
   case 'nota-ir':{
     const plan=SEM[semanaId(lunesDe(hoyISO()))];
     const b=plan.bloques.find(x=>x.id===id);if(!b)break;
     window.__ev=evDe(b);mEvento();break;}
   case 'ficha': mFicha(id);break;
   case 'b-hecho':{const b=todosBloques().find(x=>x.id===id);b.estado='hecho';registrarSesion(b);
     cerrar();guardarPronto();render();toast('Registrado');break;}
   case 'b-deshacer':{const b=todosBloques().find(x=>x.id===id);b.estado='planificado';
     SES=SES.filter(s=>s.bloqueId!==id);cerrar();guardarPronto();render();break;}
   case 'b-mover': mMover(id);break;
   case 'b-mover-ok':{const plan=planActual();const b=plan.bloques.find(x=>x.id===id);
     b.fecha=el.dataset.f;b.motivo='Movido a mano.';cerrar();guardarPronto();render();break;}
   case 'b-anular':{const plan=planActual();const b=plan.bloques.find(x=>x.id===id);
     b.estado='anulado';
     if(b.tareaId){D.deuda=D.deuda||[];D.deuda.push({id:uid('deu'),tareaId:b.tareaId,proyecto:b.proyecto,nombre:b.nombre,horas:(b.fin-b.ini)/60,semanaOrigen:plan.id});}
     cerrar();guardarPronto();render();toast('Anulado. Pasa a deuda.');break;}
   case 'anular-dia': mAnularDia([el.dataset.f]);break;
   case 'anular-sel': mAnularDia([...sel]);break;
   case 'limpiar-sel': sel.clear();render();break;
   case 'anular-ok': anularDias(el.dataset.f.split(','),el.dataset.modo);sel.clear();cerrar();render();break;
   case 'recuperar-dia':{const plan=planActual()||SEM[semanaId(lunesDe(hoyISO()))];
     plan.diasOff=plan.diasOff.filter(x=>x!==el.dataset.f);
     plan.bloques.forEach(b=>{if(b.fecha===el.dataset.f&&b.estado==='anulado')b.estado='planificado';});
     guardarPronto();render();break;}
   case 'deuda-del': D.deuda=D.deuda.filter(d=>d.id!==id);guardarPronto();render();break;
   case 'proj-toggle':{const p=P(id);p.activo=!p.activo;guardarPronto();render();
     toast(p.activo?p.nombre+' activado':p.nombre+' desactivado. Sus bloques futuros desaparecen.');break;}
   case 'proj-up': case 'proj-down':{
     const i=D.proyectos.findIndex(p=>p.id===id),j=a==='proj-up'?i-1:i+1;
     if(i<0||j<0||j>=D.proyectos.length)break;
     const t=D.proyectos[i];D.proyectos[i]=D.proyectos[j];D.proyectos[j]=t;
     guardarPronto();render();
     const el2=document.querySelector('.pcard[data-id="'+id+'"]');
     if(el2){el2.scrollIntoView({block:'nearest'});el2.classList.add('resalta');setTimeout(()=>el2.classList.remove('resalta'),700);}
     toast(D.proyectos.map(p=>p.nombre).join(' › '));break;}
   case 'ana-modo': anaModo=el.dataset.v;render();break;
   case 'comp-abrir': mCompartir(id);break;
   case 'comp-save':{
     const url=$('#cu').value.trim(),clave=$('#ck').value.trim(),autor=$('#ca').value.trim();
     if(!url)return toast('Pega la dirección de la hoja compartida');
     D.config.autor=autor||autorNombre();
     let c=compartidos().find(x=>x.proyectoId===id);
     if(!c){c={proyectoId:id,base:null,ultima:null};compartidos().push(c);}
     c.url=url;c.clave=clave;c.activo=true;
     cerrar();guardar(false);render();
     sincronizarCompartidos(true,el.dataset.modo==='join'?id:null);break;}
   case 'comp-probar':{
     const url=$('#cu').value.trim(),clave=$('#ck').value.trim();
     (async()=>{try{
       const r=await fetch(url,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},
         body:JSON.stringify({clave,accion:'ping'})});
       const j=JSON.parse(await r.text());
       toast(j.error?('No conecta: '+j.error):('Conectado con «'+(j.hoja||'la hoja')+'»'));
     }catch(e){toast('No conecta: revisa la dirección');}})();break;}
   case 'comp-off':{
     D.config.compartidos=compartidos().filter(x=>x.proyectoId!==id);
     cerrar();guardarPronto();render();toast('Ya no se comparte. Tus datos siguen aquí.');break;}
   case 'comp-ahora': sincronizarCompartidos(true);break;
   case 'proj-new': mProyecto(null);break;
   case 'proj-edit': mProyecto(id);break;
   case 'proj-save':{
     const n=$('#pn').value.trim();if(!n)return toast('Ponle nombre');
     const o={nombre:n,tipo:$('#pt').value,color:$('#pc').value,fechaInicio:$('#pi').value,
       fechaFin:$('#pf').value||null,fechaLimite:$('#pl').value||null,pct:Number($('#pp').value||0)};
     if(id)Object.assign(P(id),o);
     else D.proyectos.push(Object.assign({id:n.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,10)||uid('P'),
       activo:true,prioridad:3,minimo:0,hitos:[]},o));
     cerrar();guardarPronto();render();break;}
   case 'proj-del':{
     if(!el.dataset.conf){el.dataset.conf='1';el.textContent='Es irreversible. Pulsa otra vez';return;}
     D.proyectos=D.proyectos.filter(p=>p.id!==id);cerrar();guardarPronto();render();toast('Proyecto eliminado');break;}
   case 'hito-new': mHito(el.dataset.p,null);break;
   case 'hito-edit': mHito(el.dataset.p,el.dataset.h);break;
   case 'hito-save':{const p=P(el.dataset.p);const hid=el.dataset.h;
     const o={nombre:$('#hn').value.trim(),peso:Number($('#hp').value||0),fecha:$('#hf').value||null,estado:$('#he').value};
     if(hid)tocar(Object.assign(p.hitos.find(x=>x.id===hid),o));
     else p.hitos.push(tocar(Object.assign({id:uid('H'),horas:0,tareas:[]},o)));
     const s=p.hitos.reduce((a,x)=>a+x.peso,0);
     cerrar();guardarPronto();render();
     if(s!==100)toast('Los pesos suman '+s+', no 100');
     break;}
   case 'hito-del':{const p=P(el.dataset.p);const hh=p.hitos.find(x=>x.id===el.dataset.h);
     if(hh){anotarBorrado(hh.id);hh.tareas.forEach(t=>anotarBorrado(t.id));}
     p.hitos=p.hitos.filter(x=>x.id!==el.dataset.h);
     cerrar();guardarPronto();render();break;}
   case 'tarea-new': mTarea(el.dataset.p,el.dataset.h,null);break;
   case 'tarea-edit': mTarea(el.dataset.p,el.dataset.h,el.dataset.t);break;
   case 'tf': el.classList.toggle('ghost');break;
   case 'rec-tog':{el.classList.toggle('ghost');
     const on2=!el.classList.contains('ghost');
     el.textContent=on2?'Sí, es recurrente':'No, es tarea única';
     const box=document.getElementById('recbox');if(box)box.classList.toggle('oculto',!on2);break;}
   case 'pct-norm':{
     const act=D.proyectos.filter(p=>p.activo);
     const suma=act.reduce((a,p)=>a+(p.pct||0),0);
     if(!suma){const q=Math.round(100/act.length);act.forEach(p=>p.pct=q);}
     else act.forEach(p=>p.pct=Math.round(100*(p.pct||0)/suma));
     const dif=100-act.reduce((a,p)=>a+p.pct,0);
     if(act.length)act[0].pct+=dif;
     guardarPronto();render();toast('Reparto ajustado a 100 %');break;}
   case 'tarea-save':{
     const p=P(el.dataset.p),hi=p.hitos.find(x=>x.id===el.dataset.h),tid=el.dataset.t;
     const on=k=>{const b=document.querySelector('[data-act="tf"][data-k="'+k+'"]');return b&&!b.classList.contains('ghost');};
     const dz=on('desplaza');
     const btnr=document.querySelector('[data-act="rec-tog"]');
     const recOn=btnr&&!btnr.classList.contains('ghost');
     const gv=id=>{const e=document.getElementById(id);return e?e.value:'';};
     const rec=recOn?{activo:true,cada:Math.max(1,Number(gv('rc')||1)),
       horas:Math.max(0.25,Number(gv('rho')||1)),
       dia:gv('rd')===''?null:Number(gv('rd')),
       hora:gv('rh')||null,
       desde:gv('rdesde')||lunesDe(hoyISO()),
       hasta:gv('rhasta')||null}:null;
     const o={nombre:$('#tn').value.trim(),horas:Number($('#th').value||0),contexto:$('#tc').value,
       desplaza:dz,critica:on('critica'),bloqueante:on('bloqueante'),rec,
       etiquetas:dz?['luz','jornadaContinua','fisica']:[$('#tc').value==='llamadas'?'comercial':$('#tc').value==='cita'?'cita':'escritorio']};
     if(tid)tocar(Object.assign(hi.tareas.find(x=>x.id===tid),o));
     else hi.tareas.push(tocar(Object.assign({id:uid('T'),estado:'pendiente'},o)));
     cerrar();guardarPronto();render();break;}
   case 'tarea-del':{const p=P(el.dataset.p),hi=p.hitos.find(x=>x.id===el.dataset.h);
     anotarBorrado(el.dataset.t);
     hi.tareas=hi.tareas.filter(x=>x.id!==el.dataset.t);cerrar();guardarPronto();render();break;}
   case 'ej-ok':{const b=todosBloques().find(x=>x.id===id);
     let s=SES.find(x=>x.tipo==='ejercicio'&&x.bloqueId===b.id);
     if(!s){s={id:uid('s'),tipo:'ejercicio',proyecto:'SALUD',fecha:b.fecha,horas:0,bloqueId:b.id,detalle:[]};SES.push(s);}
     const i=el.dataset.i;s.detalle[i]=Object.assign(s.detalle[i]||{},{hecho:!(s.detalle[i]&&s.detalle[i].hecho)});
     guardarPronto();mFicha(id);break;}
   case 'sync-ahora': sincronizar(true);break;
   case 'sync-toggle':{const sy=syncCfg();
     if(!sy.url)return toast('Pega antes la dirección de la aplicación web');
     sy.activo=!sy.activo;syncEstado=sy.activo?'pend':'off';
     guardar(false);render();if(sy.activo)sincronizar(true);break;}
   case 'sync-probar':{
     (async()=>{try{const j=await syncLlamar('ping');toast('Conectado con «'+(j.hoja||'la hoja')+'»');}
      catch(err){toast('No conecta: '+err.message);}})();break;}
   case 'conf-local': cerrar();(async()=>{try{await syncSubir();render();toast('Subido lo de este dispositivo');}catch(e){toast('No se pudo subir');}})();break;
   case 'conf-remoto':{const rem=window.__rem;cerrar();adoptar(rem);guardar(false);render();toast('Traído lo de la hoja');break;}
   case 'regla-new': mRegla(null);break;
   case 'regla-edit': mRegla(el.dataset.g);break;
   case 'regla-dia': case 'regla-tag': el.classList.toggle('ghost');break;
   case 'regla-on':{const g=el.dataset.g;const r=reglaVigente(g,hoyISO());r.activa=r.activa===false;
     el.textContent=r.activa===false?'Desactivada':'Activa';el.classList.toggle('ghost',r.activa===false);
     guardarPronto();break;}
   case 'regla-save':{
     const g=el.dataset.g;
     const nombre=$('#rn').value.trim();if(!nombre)return toast('Ponle nombre a la franja');
     const ini=$('#ri').value,fin=$('#rf').value;
     if(!ini||!fin||toMin(fin)<=toMin(ini))return toast('La hora de fin debe ser posterior a la de inicio');
     const dias=[];document.querySelectorAll('[data-act="regla-dia"]').forEach(b=>{if(!b.classList.contains('ghost'))dias.push(Number(b.dataset.d));});
     if(!dias.length)return toast('Elige al menos un día');
     const etiquetas=[];document.querySelectorAll('[data-act="regla-tag"]').forEach(b=>{if(!b.classList.contains('ghost'))etiquetas.push(b.dataset.k);});
     const desde=$('#rv').value||hoyISO();
     const mh=Number($('#rm').value||0);
     const ant=g?reglaVigente(g,hoyISO()):null;
     const nueva={id:uid('r'),grupo:g||uid('g'),nombre,tipo:$('#rt').value,dias,ini,fin,
       etiquetas,vigenteDesde:desde,vigenteHasta:null,activa:ant?ant.activa!==false:true,
       maxHoras:mh>0?mh:null,proy:$('#rp').value||null};
     if(g){
       D.config.reglas.forEach(r=>{if(r.grupo===g&&r.vigenteDesde<desde)r.vigenteHasta=addDays(desde,-1);});
       D.config.reglas=D.config.reglas.filter(r=>!(r.grupo===g&&r.vigenteDesde>=desde));
     }
     D.config.reglas.push(nueva);
     cerrar();guardarPronto();render();
     toast(desde<=hoyISO()?'Franja actualizada':'En vigor desde el '+esp(desde));
     break;}
   case 'regla-del':{
     if(!el.dataset.conf){el.dataset.conf='1';el.textContent='Confirmar';return;}
     const g=el.dataset.g,desde=$('#rv').value||hoyISO();
     D.config.reglas.forEach(r=>{if(r.grupo===g&&r.vigenteDesde<desde)r.vigenteHasta=addDays(desde,-1);});
     D.config.reglas=D.config.reglas.filter(r=>!(r.grupo===g&&r.vigenteDesde>=desde));
     cerrar();guardarPronto();render();toast('Franja retirada desde el '+esp(desde));break;}
   case 'equip': D.config.equipamiento[el.dataset.k]=!D.config.equipamiento[el.dataset.k];guardarPronto();render();break;
   case 'export':{
     const blob=new Blob([JSON.stringify({datos:D,semanas:SEM,sesiones:SES,incidencias:INC,exportado:new Date().toISOString()},null,1)],{type:'application/json'});
     const u=URL.createObjectURL(blob),a2=document.createElement('a');
     a2.href=u;a2.download='centro-de-mando-'+hoyISO()+'.json';a2.click();URL.revokeObjectURL(u);break;}
   case 'import-ok': aplicarImport();break;
   case 'reset':{
     if(!el.dataset.conf){el.dataset.conf='1';el.textContent='Borra todo. Pulsa otra vez';return;}
     KEYS.forEach(k=>store.del(k));D=nuevaBase();SEM={};SES=[];INC=[];guardar();render();toast('Todo reiniciado');break;}
  }
});

/* ---------- render ---------- */
function render(){
  $('#tabs').innerHTML=VISTAS.map(([k,n])=>'<button data-act="tab" data-v="'+k+'" aria-current="'+(vista===k)+'">'+n+'</button>').join('');
  $('#wkid').textContent=semanaId(lunesDe(hoyISO())).replace('-',' · ');
  const m={panorama:vPanorama,hoy:vHoy,semana:vSemana,analisis:vAnalisis,proyectos:vProyectos,config:vConfig};
  $('#app').innerHTML=(m[vista]||vPanorama)();
}

/* ---------- inicio ---------- */
(async function init(){
  semanaVista=lunesDe(hoyISO());
  const cfg=await store.get('config-y-proyectos');
  D=cfg||nuevaBase();
  D.deuda=D.deuda||[];D.borrados=D.borrados||[];
  D.config=Object.assign({},CONFIG_DEF,D.config||{});
  migrarReglas();migrarRecurrentes();migrarReparto();
  SEM=(await store.get('semanas-plan'))||{};
  SES=(await store.get('registro-sesiones'))||[];
  INC=(await store.get('incidencias'))||[];
  syncCfg();
  if(!cfg)await guardar(false);
  syncEstado=syncCfg().activo?'pend':'off';
  render();pintarEstado();
  sincronizar(false);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sincronizar(false);});
  window.addEventListener('online',()=>sincronizar(false));
})();

</script>
</body>
</html>
