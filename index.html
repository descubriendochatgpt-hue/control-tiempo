<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1317">
<title>Centro de mando</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1317; --surface:#171C22; --surface2:#1E252C; --line:#2B333C; --line2:#39434E;
  --text:#E8ECEF; --muted:#8B98A5; --faint:#5C6874;
  --coche:#8B7BC0; --prot:#1B2026; --bloq:#141A20;
  --ok:#4EA98C; --warn:#D9A441; --bad:#C25B4E;
  --r:6px;
  --cab:52px;          /* alto de la cabecera, para lo que queda pegajoso debajo */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{height:8px;width:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}

/* ---------- chrome ---------- */
header.top{position:sticky;top:0;z-index:40;background:rgba(15,19,23,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{max-width:1180px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--muted);font-weight:400}
nav.tabs{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
nav.tabs button{padding:7px 12px;border-radius:var(--r);color:var(--muted);font-size:14px;font-weight:500;white-space:nowrap}
nav.tabs button[aria-current="true"]{background:var(--surface2);color:var(--text)}
nav.tabs button:hover{color:var(--text)}
.savechip{font-size:12px;color:var(--faint);white-space:nowrap}
main{max-width:1180px;margin:0 auto;padding:18px 14px 60px}
h2.vh{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
p.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{background:var(--surface2);border:1px solid var(--line2);border-radius:var(--r);padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text);font-weight:600}
.btn.ghost{background:none;border-color:var(--line)}
.btn.danger{border-color:#5a2f2a;color:#e8938a}
.btn.sm{padding:4px 8px;font-size:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r);padding:7px 9px;font-size:14px;width:100%}
input:focus,select,textarea:focus{outline:2px solid var(--muted);outline-offset:-1px}
:focus-visible{outline:2px solid #7fb7e8;outline-offset:2px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.warnbox{border-left:3px solid var(--warn);background:#221d12;padding:10px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13px}
.badbox{border-left:3px solid var(--bad);background:#231715;padding:10px 12px;border-radius:0 var(--r) var(--r) 0;font-size:13px}

/* ---------- panorama ---------- */
.rings{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.ringcard{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--pc);border-radius:10px;padding:14px 12px;text-align:center;cursor:pointer}
.ringcard:hover{border-color:var(--line2)}
.ringwrap{position:relative;width:112px;height:112px;margin:0 auto 10px}
.ringwrap svg{transform:rotate(-90deg)}
.ringnum{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringnum b{font-size:26px;font-weight:600;letter-spacing:-.03em}
.ringnum i{font-style:normal;font-size:11px;color:var(--muted)}
.pname{font-weight:600;font-size:14px}
.pnext{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;vertical-align:middle;margin-right:5px}
.hbars{display:flex;flex-direction:column;gap:8px}
.hbar{display:grid;grid-template-columns:96px 1fr 74px;gap:10px;align-items:center;font-size:13px}
.track{height:9px;background:var(--surface2);border-radius:5px;overflow:hidden;position:relative}
.track i{display:block;height:100%;border-radius:5px}
.track u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--muted)}

/* ---------- semana ---------- */
.wkhead{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;position:sticky;top:var(--cab);z-index:30}
.counters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ctr{border:1px solid var(--line2);border-left:3px solid var(--pc);border-radius:var(--r);padding:5px 9px;font-size:13px}
.ctr b{font-weight:600}
.ctr span{color:var(--muted);font-size:12px}
.meters{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.meters b{color:var(--text);font-weight:600}
.gridscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.grid{display:grid;grid-template-columns:46px repeat(7,minmax(96px,1fr));grid-auto-rows:32px;min-width:740px;position:relative}
.gh{grid-row:1;position:sticky;top:0;z-index:12;background:var(--surface);border-bottom:1px solid var(--line2);padding:5px 4px 6px;text-align:center;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;overflow:hidden}
.gh small{display:block;color:var(--muted);font-weight:400;font-size:11px;line-height:1.1}
.gh.today{color:#8fd0ff}
.gh input{width:14px;height:14px;margin:1px 0 0}
.hlab{grid-column:1;font-size:11px;color:var(--faint);padding-right:5px;text-align:right;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.hlab.media{font-size:9.5px;opacity:.5;border-top:1px solid rgba(255,255,255,.04)}
.cell{border-top:1px solid rgba(255,255,255,.035);border-right:1px solid rgba(255,255,255,.035)}
.cell.hh{border-top:1px solid var(--line)}
.cell.prot{background:var(--prot);background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(255,255,255,.02) 5px 10px)}
.cell.bloq{background:var(--bloq)}
.cell.exc{background:#12171d}
.cell.cuota{background:#171d24}
.blk{border-radius:5px;margin:1px;padding:3px 5px;font-size:11px;line-height:1.25;overflow:hidden;z-index:5;cursor:pointer;border-left:3px solid var(--bc);background:var(--bb);color:var(--text)}
.blk:hover{filter:brightness(1.25)}
.blk b{display:block;font-weight:600;font-size:11px}
.blk small{color:rgba(232,236,239,.66);font-size:10px}
.blk.hecho{opacity:.45;text-decoration:line-through}
.blk.anulado{opacity:.3}
.blk.fijo{cursor:pointer}
.blk.coche{background:#231f33;border-left-color:var(--coche)}
.blk.margen{background:transparent;border:1px dashed var(--line2);border-left:1px dashed var(--line2);color:var(--faint)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ---------- hoy ---------- */
.tblk{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:8px;background:var(--surface);margin-bottom:7px}
.tblk .hr{font-size:13px;color:var(--muted)}
.tblk .nm{font-size:14px;font-weight:500}
.tblk .nm small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.tblk.done .nm{opacity:.5;text-decoration:line-through}

/* ---------- proyectos ---------- */
.pcard{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pc);border-radius:10px;padding:14px;margin-bottom:12px}
.hitorow{display:grid;grid-template-columns:1fr 58px 74px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.hitorow:first-of-type{border-top:none}
.mini{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%}
.taskrow{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:3px 0 3px 12px}
.tag{font-size:10px;border:1px solid var(--line2);border-radius:3px;padding:1px 5px;color:var(--muted)}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(6,9,12,.72);z-index:80;display:flex;align-items:flex-end;justify-content:center;padding:0}
@media(min-width:640px){.ov{align-items:center;padding:20px}}
.modal{background:var(--surface);border:1px solid var(--line2);border-radius:12px 12px 0 0;padding:16px;width:100%;max-width:480px;max-height:86vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:12px}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:3px}
.modal .mst{font-size:13px;color:var(--muted);margin-bottom:14px}
.mopt{display:block;width:100%;text-align:left;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:7px;font-size:14px}
.mopt:hover{border-color:var(--muted);background:var(--surface2)}
.mopt small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.exrow{display:grid;grid-template-columns:1fr 62px 60px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.chk{width:20px;height:20px;border:1px solid var(--line2);border-radius:4px;display:grid;place-items:center;font-size:12px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#08110d}
table.cfg{width:100%;border-collapse:collapse;font-size:13px}
table.cfg th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;padding:6px 6px 6px 0;border-bottom:1px solid var(--line)}
table.cfg td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line)}
table.cfg input,table.cfg select{padding:4px 6px;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;font-weight:600;z-index:90}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}

.blk{cursor:grab;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.blk small.hito{display:block;font-size:10px;font-weight:600;color:var(--bc);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:1px}
.blk.arrastrando{cursor:grabbing;z-index:25;filter:brightness(1.3);box-shadow:0 10px 26px rgba(0,0,0,.6);transform:scale(1.02)}
.blk.nodrop{outline:2px solid var(--bad);outline-offset:-2px}
.cell.destino{background:rgba(143,208,255,.10);box-shadow:inset 0 0 0 1px rgba(143,208,255,.35)}

.blk{position:relative}
.blk.connota::after{content:'';position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--warn)}
.cell[data-act="celda"]{cursor:cell}
.cell[data-act="celda"]:hover{background-color:rgba(143,208,255,.07)}
.tblk .nm small.nota{color:var(--warn);margin-top:3px}
.notarow{display:grid;grid-template-columns:74px 1fr;gap:10px;align-items:start;padding:8px 0 8px 10px;border-top:1px solid var(--line);border-left:3px solid var(--pc);font-size:13px;cursor:pointer;line-height:1.4}
.notarow:hover{background:var(--surface2)}
.notarow b{font-weight:600}

.blk small.nb{display:block;color:var(--warn);font-size:10px;line-height:1.25;margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.colarow{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:8px 0 8px 9px;
  border-top:1px solid var(--line);border-left:3px solid var(--pc);font-size:13px;line-height:1.35}
.colarow.off{opacity:.35}
.colarow .n{color:var(--faint);font-size:11px;text-align:right}
.colarow .q{display:block;color:var(--muted);font-size:11px}
.colarow .h{font-size:12px;color:var(--muted);white-space:nowrap}
.colabtns{display:flex;gap:3px}
.colabtns button{border:1px solid var(--line2);border-radius:5px;width:26px;height:26px;font-size:13px;color:var(--muted)}
.colabtns button:hover{color:var(--text);border-color:var(--muted)}
.corte{display:flex;align-items:center;gap:9px;padding:9px 0;font-size:11px;color:var(--warn);font-weight:600}
.corte::before,.corte::after{content:'';flex:1;height:1px;background:var(--warn);opacity:.45}

.blk b{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;-webkit-line-clamp:3}
.blk small.nb{display:-webkit-box;-webkit-box-orient:vertical;color:var(--warn);font-size:10px;line-height:1.2;margin-top:2px;overflow:hidden}
.colarow.fuera{opacity:.5}
.colarow.fuera b{font-weight:500}

.blk{padding:2px 5px}
.blk small.hito{font-size:10.5px;line-height:1.2;margin-bottom:0}
.blk b{font-size:11.5px;line-height:1.25}
.blk small.nb{font-size:10.5px;line-height:1.2;margin-top:1px}
.blk small{font-size:10.5px}

.blk.mini{padding:1px 4px}
.blk b.uni{display:block;font-size:11px;line-height:1.15;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.mini small.nb{line-height:1.05;margin-top:0}

.asa{display:inline-block;color:var(--faint);font-size:13px;letter-spacing:-1px;margin-right:7px;cursor:grab;user-select:none;touch-action:manipulation}
.asa:hover{color:var(--text)}
[data-sort]{touch-action:manipulation;-webkit-touch-callout:none}
body.ordenando [data-sort]{user-select:none;-webkit-user-select:none}
.movida{opacity:.55;outline:2px dashed var(--line2);outline-offset:2px;border-radius:8px}
body.ordenando{cursor:grabbing;user-select:none;-webkit-user-select:none}
.hitobox{border-top:1px solid var(--line)}
.hitobox:first-child{border-top:none}
.hitorow{border-top:none}
.taskrow{padding:3px 0 3px 4px;border-radius:5px}
.taskrow:hover{background:var(--surface2)}
.tareas{padding-left:14px}

.flechas{display:inline-flex;gap:2px;margin-right:8px}
.flechas button{border:1px solid var(--line2);border-radius:5px;width:28px;height:28px;font-size:13px;color:var(--muted);line-height:1}
.flechas button:hover:not(:disabled){color:var(--text);border-color:var(--muted);background:var(--surface2)}
.flechas button:disabled{opacity:.28;cursor:default}
.pcard.resalta{outline:2px solid var(--pc);outline-offset:2px}

.oculto{display:none}
.tag.rec{border-color:#3E86B8;color:#8fc4e8}
.pctrow{display:grid;grid-template-columns:auto 68px 14px 1fr auto;gap:8px;align-items:center;margin-top:10px;font-size:12px;color:var(--muted)}
.pctrow input{padding:4px 6px;font-size:13px;text-align:right}
.pctrow .pc{color:var(--faint)}
.repcard{padding:10px 12px;margin-bottom:12px}
.repcard .dot{margin-right:5px}

.kpi{display:flex;flex-direction:column;line-height:1.2}
.kpi b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.kpi i{font-style:normal;font-size:11px;color:var(--muted)}
.objrow{display:grid;grid-template-columns:120px 1fr 96px 72px;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.objrow:first-of-type{border-top:none}
.objrow .on{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.objrow .oc b{font-size:15px;font-weight:600}
.objrow .oc i{display:block;font-style:normal;font-size:11px;color:var(--muted)}
.objrow .od{text-align:right;font-size:13px;font-weight:600;line-height:1.25}
@media(max-width:620px){.objrow{grid-template-columns:1fr 84px 66px}.objrow .ob{grid-column:1/-1;order:3}}

.rango{display:flex;align-items:center;gap:10px;margin-top:12px}
.rango input[type=range]{flex:1;-webkit-appearance:none;appearance:none;background:transparent;padding:0;border:none;height:22px}
.rango input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--surface2);border-radius:2px}
.rango input[type=range]::-moz-range-track{height:4px;background:var(--surface2);border-radius:2px}
.rango input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--text);margin-top:-7px;cursor:grab}
.rango input[type=range]::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:var(--text);cursor:grab}
.rango input[type=range]:active::-webkit-slider-thumb{cursor:grabbing}
.rlbl{font-size:13px;font-weight:600;min-width:88px;text-align:right;white-space:nowrap}

.quien{color:#8fc4e8;font-weight:500}
.tag.quien{border-color:#8fc4e8;color:#8fc4e8}
.blk .quien{font-size:10.5px}

.gh.pasado{opacity:.45}
.cell.pasado{opacity:.4}

.avisoNuevo{max-width:1180px;margin:10px auto 0;padding:9px 14px;background:#1d2a20;border:1px solid #2f5a3c;
  border-radius:8px;font-size:13px;display:flex;align-items:center;gap:12px}
.avisoNuevo button{margin-left:auto;background:var(--text);color:var(--bg);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:600}
.toast button{margin-left:12px;background:none;color:var(--bg);font-weight:700;text-decoration:underline}
.confrow{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.confrow .opt{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;margin-top:8px;font-size:12px}
.copiarow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:13px}
.copiarow .q{display:block;color:var(--muted);font-size:11px}
.copiarow button{margin-left:auto}

.tira{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);
  border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.tira b{margin-left:auto}
.cierrefila{display:grid;grid-template-columns:28px 1fr 78px;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.cierrefila .q{display:block;color:var(--muted);font-size:11px}
.cierrefila input{padding:4px 6px;font-size:12px;text-align:right}
.familia{text-align:center;padding:56px 20px}
.familia .fh{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:20px}
.familia .fp{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;
  margin:0 auto 20px;max-width:380px;line-height:1.5}
.familia .fp b{display:block;margin-top:4px;font-size:15px}
.familia p{margin-bottom:22px}
.energia .ebtn{width:44px;height:44px;border:1px solid var(--line2);border-radius:10px;font-size:16px;font-weight:600;color:var(--muted)}
.energia .ebtn.on{background:var(--ok);border-color:var(--ok);color:#08110d}
.energia .ebtn:hover{color:var(--text)}

.coment{border-left:3px solid var(--line2);padding:8px 10px;margin-bottom:8px;font-size:13px;line-height:1.5}
.coment.mio{border-left-color:#3E86B8}
.coment .ca{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.actrow{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.cell.externo{background:#241f1c;background-image:repeating-linear-gradient(135deg,transparent 0 4px,rgba(255,255,255,.04) 4px 8px)}

.semaf{display:block;width:70%;height:3px;border-radius:2px;margin:1px 0;border:none;cursor:pointer}
.pt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}

const store = {
  async get(k){
    try{
      if(window.storage&&window.storage.get){const r=await window.storage.get(k);return r?JSON.parse(r.value):null;}
      const v=localStorage.getItem('cdm:'+k);return v?JSON.parse(v):null;
    }catch(e){return null;}
  },
  async set(k,v){
    try{
      if(window.storage&&window.storage.set){await window.storage.set(k,JSON.stringify(v));return true;}
      localStorage.setItem('cdm:'+k,JSON.stringify(v));return true;
    }catch(e){console.warn('guardado',e);return false;}
  },
  async del(k){
    try{
      if(window.storage&&window.storage.delete){await window.storage.delete(k);return;}
      localStorage.removeItem('cdm:'+k);
    }catch(e){}
  }
};

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const pad=n=>String(n).padStart(2,'0');
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parse(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c);}
function esp(s){if(!s)return'—';const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();}
function espCorto(s){const d=parse(s);return pad(d.getDate())+' '+MESES[d.getMonth()].slice(0,3);}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d);}
function lunesDe(s){const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d);}
function diaSemana(s){return(parse(s).getDay()+6)%7;} // 0=lunes
function hoyISO(){return iso(new Date());}
function semanaId(lunes){
  const d=parse(lunes);const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()+3);
  const y=t.getFullYear();const e=new Date(y,0,4);
  const n=1+Math.round(((t-e)/86400000-3+((e.getDay()+6)%7))/7);
  return y+'-S'+pad(n);
}
function mesDe(s){return s.slice(0,7);}
function diffDias(a,b){return Math.round((parse(b)-parse(a))/86400000);}
const m2h=m=>m/60;
function hhmm(m){return pad(Math.floor(m/60))+':'+pad(m%60);}

function fmtH(h){const r=Math.round(h*10)/10;return(Number.isInteger(r)?r:r.toFixed(1))+' h';}

  autoJornadaObra:EDICION==='personal',

  cuotaDefecto:2,
  recurrentes:EDICION!=='personal'?[]:[
    {id:'rc_video', proyecto:'VERTIAN',nombre:'Vídeo YouTube', horas:5,cadencia:1,diaPub:4,etiquetas:['escritorio'],fases:['Guion','Grabación','Edición','Publicación']},
    {id:'rc_art', proyecto:'VERTIAN',nombre:'Artículo Substack (mi turno)',horas:5,cadencia:3,diaPub:3,etiquetas:['escritorio'],fases:['Documentación','Redacción','Maquetación','Publicación']},

 if(EDICION!=='personal')return [];   // la edición compartida arranca vacía
 const T=(n,h,ctx,ext={})=>Object.assign({id:uid('t'),nombre:n,horas:h,contexto:ctx,estado:'pendiente',critica:false,bloqueante:false,desplaza:ctx==='obra',etiquetas:ctx==='obra'?['luz','jornadaContinua','fisica']:['escritorio']},ext);
 return [

 {id:'VERTIAN',nombre:'Vertian',color:'#3E86B8',tipo:'continuo',prioridad:1,pct:45,minimo:6,activo:true,

/* ============================================================
   MOTOR DE PLANIFICACIÓN
   Fase A: construir el tablero (huecos + bloques fijos)
   Fase B: ordenar la cola (mínimos > bloqueantes > publicación > deuda > reparto)
   Fase C: colocar cada tarea en un hueco compatible
   Fase D: lo que no cupo -> deuda (los artículos se pierden y avisan)
   ============================================================ */

const P=id=>D.proyectos.find(p=>p.id===id);
const activos=()=>D.proyectos.filter(p=>p.activo&&p.tipo!=='candidato');
function colorDe(id){const p=P(id);return p?p.color:'#8B98A5';}
function nombreDe(id){const p=P(id);return p?p.nombre:(id==='PERSONAL'?'Personal':id);}

/* ---------- horas ya registradas ---------- */
function horasTarea(tid){return SES.filter(s=>s.tareaId===tid).reduce((a,s)=>a+s.horas,0);}
function horasHito(h){return h.tareas.reduce((a,t)=>a+horasTarea(t.id),0);}
function horasProyecto(pid){const p=P(pid);if(!p)return 0;return p.hitos.reduce((a,h)=>a+horasHito(h),0);}

/* ---------- Fase A.1 — huecos de la semana ---------- */
function reglasDe(dia,fecha){
  const f=fecha||hoyISO();
  return D.config.reglas.filter(r=>r.dias.includes(dia)&&r.activa!==false
    &&(!r.vigenteDesde||r.vigenteDesde<=f)&&(!r.vigenteHasta||r.vigenteHasta>=f));
}
function migrarReglas(){
  D.config.reglas.forEach(r=>{
    if(!r.grupo)r.grupo=r.id;
    if(!r.vigenteDesde)r.vigenteDesde='2000-01-01';
    if(r.vigenteHasta===undefined)r.vigenteHasta=null;
  });
}
function versiones(grupo){
  return D.config.reglas.filter(r=>r.grupo===grupo).sort((a,b)=>a.vigenteDesde<b.vigenteDesde?-1:1);
}
function reglaVigente(grupo,fecha){
  const f=fecha||hoyISO();
  const v=versiones(grupo);
  return v.find(r=>r.vigenteDesde<=f&&(!r.vigenteHasta||r.vigenteHasta>=f))||v[v.length-1];
}
function esPasado(f){return f<hoyISO();}
function huecosSemana(lunes,diasOff){
  const out=[];
  for(let i=0;i<7;i++){
    const f=addDays(lunes,i);
    if(diasOff.includes(f)||esPasado(f))continue;      // el pasado no se planifica
    reglasDe(i,f).forEach(r=>{
      if(r.tipo!=='disponible'&&r.tipo!=='excepcional')return;
      const min=toMin(r.ini),max=toMin(r.fin);
      const dur=m2h(max-min);
      out.push({fecha:f,dia:i,min,max,libreMin:min,horas:Math.min(dur,r.maxHoras||dur),
                etiquetas:r.etiquetas||[],regla:r.id,nombre:r.nombre,tipoRegla:r.tipo,usadas:0});
    });
  }
  return out.sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.min-b.min);
}
/* Horas que de verdad da un día concreto según tus franjas, descontando
   lo que ya esté ocupado. Es lo que vale una jornada de obra ese día:
   no hay ninguna cifra fija. */
function horasUtilesDia(fecha,ocupados){
  const d=diaSemana(fecha);
  let h=0;
  reglasDe(d,fecha).forEach(r=>{
    if(r.tipo!=='disponible'&&r.tipo!=='cuota'&&r.tipo!=='excepcional')return;
    if(r.tipo==='excepcional'&&r.activa===false)return;
    const ini=toMin(r.ini),fin=toMin(r.fin);
    let dur=(fin-ini)/60;
    if(r.tipo==='disponible'&&r.maxHoras)dur=Math.min(dur,r.maxHoras);
    // los tramos reservados o bloqueados dentro de la franja no cuentan
    if(r.tipo==='cuota'||r.tipo==='excepcional'){
      reglasDe(d,fecha).forEach(x=>{
        if(x.tipo!=='reservado'&&x.tipo!=='bloqueado')return;
        const a=Math.max(ini,toMin(x.ini)), b=Math.min(fin,toMin(x.fin));
        if(b>a)dur-=(b-a)/60;
      });
    }
    h+=Math.max(0,dur);
  });
  (ocupados||[]).forEach(o=>{if(o.fecha===fecha)h-=(o.fin-o.ini)/60;});
  return Math.max(0,Math.round(h*100)/100);
}
/* Lo que queda para trabajar una vez descontado el coche de ida y vuelta */
function horasObraDia(fecha,ocupados){
  const coche=2*D.config.minCoche/60;
  return Math.max(0,Math.round((horasUtilesDia(fecha,ocupados)-coche)*100)/100);
}
function capacidadTeorica(lunes){
  return huecosSemana(lunes,[]).reduce((a,h)=>a+h.horas,0);
}

/* ---------- Fase A.2 — bloques fijos ---------- */
function bloquesFijos(lunes,diasOff,jornadas){
  const out=[];
  for(let i=0;i<7;i++){
    const f=addDays(lunes,i);
    if(diasOff.includes(f)||esPasado(f))continue;
    const hayObra=jornadas.some(j=>j.fecha===f);
    reglasDe(i,f).forEach(r=>{
      if(r.tipo!=='reservado')return;
      if(r.id==='r_ejercicio'&&hayObra){
        out.push({id:uid('b'),fecha:f,ini:toMin(D.config.jornadaObra.salida),fin:toMin(D.config.jornadaObra.salida)+20,tipo:'reservado',
          proyecto:'SALUD',nombre:'Movilidad antes de salir',estado:'planificado',fijo:true,ejercicio:true,
          motivo:'Jornada de obra: la sesión baja a movilidad de 20 min (Doc 4 §8).'});
        return;
      }
      out.push({id:uid('b'),fecha:f,ini:toMin(r.ini),fin:toMin(r.fin),tipo:'reservado',
        proyecto:r.proy||'PERSONAL',nombre:r.nombre,estado:'planificado',fijo:true,
        ejercicio:r.proy==='SALUD',motivo:'Bloque fijo. Se reserva antes de repartir capacidad.'});
    });
  }
  return out;
}

/* ---------- Fase A.3 — jornadas de obra con cargo a cuota ---------- */
function cuotaMes(m){
  const c=D.config.cuotas[m];
  return c?c.jornadas:D.config.cuotaDefecto;
}
/* Solo las jornadas de fin de semana gastan cuota: las de entre semana
   salen de tu capacidad ordinaria, no del tiempo con la familia. */
function jornadasUsadas(mes,excluirSemana){
  let n=0;
  Object.values(todasSemanas()).forEach(s=>{
    if(s.id===excluirSemana)return;
    (s.jornadas||[]).forEach(j=>{if(mesDe(j.fecha)===mes&&diaSemana(j.fecha)>=5)n++;});
  });
  return n;
}
const esFinde=f=>diaSemana(f)>=5;
function tareasObraPendientes(){
  const c=P('CASA');if(!c||!c.activo)return[];
  const out=[];
  c.hitos.forEach(h=>h.tareas.forEach(t=>{
    const pend=t.horas-horasTarea(t.id);
    if(t.asignado&&t.asignado!==autorNombre())return;
    if(t.desplaza&&t.estado!=='completada'&&pend>0.25)out.push({t,h,pend,proyecto:'CASA'});
  }));
  return out;
}
function proponerJornada(lunes,semId){
  if(!D.config.autoJornadaObra)return null;
  const obras=tareasObraPendientes();
  if(!obras.length)return null;
  const sab=addDays(lunes,5),dom=addDays(lunes,6);
  for(const f of [sab,dom]){
    const mes=mesDe(f);
    if(jornadasUsadas(mes,semId)>=cuotaMes(mes))continue;
    if(f<hoyISO())continue;
    return {fecha:f,mes};
  }
  return null;
}
function bloquesJornada(j,ocupados){
  const cfg=D.config, vc=cfg.minCoche;
  const d=diaSemana(j.fecha);
  // primera franja aprovechable del día: de ahí sale la hora de salida
  const aprov=reglasDe(d,j.fecha).filter(r=>r.tipo==='disponible'||r.tipo==='cuota'||
    (r.tipo==='excepcional'&&r.activa!==false)).map(r=>toMin(r.ini));
  const INI=toMin(cfg.diaInicio||'08:00');
  const primera=aprov.length?Math.min.apply(null,aprov):toMin('09:00');
  const movilidad=20;                                  // antes de salir
  let sal=Math.max(INI+movilidad,primera-vc);
  const horas=(j.horas!==undefined&&j.horas!==null)?j.horas:horasObraDia(j.fecha,ocupados);
  const trab=Math.max(0,Math.round(horas*60));
  const iniObra=sal+vc;
  const cIni=toMin('15:00'), cFin=toMin('15:30');
  const v=[];let queda=trab,cur=iniObra;
  if(cur<cIni){const t=Math.min(queda,cIni-cur);if(t>0){v.push([cur,cur+t]);queda-=t;}cur=cFin;}
  if(queda>0)v.push([Math.max(cur,cFin),Math.max(cur,cFin)+queda]);
  const fin=v.length?v[v.length-1][1]:iniObra;
  const b=[
   {id:uid('b'),fecha:j.fecha,ini:sal,fin:sal+vc,tipo:'coche',proyecto:'CASA',nombre:'Coche a la obra',
    estado:'planificado',motivo:D.config.kmPorViaje+' km. Se contabiliza aparte de las horas de trabajo.'},
   {id:uid('b'),fecha:j.fecha,ini:fin,fin:fin+vc,tipo:'coche',proyecto:'CASA',nombre:'Coche de vuelta',
    estado:'planificado',motivo:'Vuelta de la obra.'}
  ];
  return {bloques:b,ventanas:v,horas:trab/60};
}

/* ---------- Fase B — la cola ---------- */
function recurrentesDeSemana(lunes){
  const out=[];const n=Math.floor(diffDias('2026-09-28',lunes)/7);
  D.config.recurrentes.forEach(r=>{
    const p=P(r.proyecto);if(!p||!p.activo)return;
    if(r.cadencia>1&&(n%r.cadencia)!==0)return;
    out.push({id:r.id+'@'+lunes,rid:r.id,proyecto:r.proyecto,nombre:r.nombre,
      horas:r.horas,pend:r.horas,etiquetas:r.etiquetas,desplaza:false,hitoNombre:'Producción recurrente',
      publica:addDays(lunes,r.diaPub),sinDeuda:!r.minimo,minimo:!!r.minimo,recurrente:true});
  });
  return out;
}
function tocaEstaSemana(r,lunes){
  if(!r)return false;
  const l0=lunesDe(r.desde||'2000-01-03');
  if(lunes<l0)return false;
  if(r.hasta&&lunes>lunesDe(r.hasta))return false;
  const n=Math.round(diffDias(l0,lunes)/7);
  return n%(Math.max(1,r.cada||1))===0;
}
function tareasRecurrentes(lunes){
  const out=[];
  activos().forEach(p=>p.hitos.forEach(h=>h.tareas.forEach(t=>{
    if(!t.rec||t.rec.activo===false)return;
    if(t.asignado&&t.asignado!==autorNombre())return;
    if(!tocaEstaSemana(t.rec,lunes))return;
    const r=t.rec;
    out.push({id:t.id,proyecto:p.id,hito:h.id,hitoNombre:h.nombre,nombre:t.nombre,
      horas:r.horas||t.horas,pend:r.horas||t.horas,etiquetas:t.etiquetas||['escritorio'],asignado:t.asignado||null,
      desplaza:!!t.desplaza,dia:(r.dia===undefined?null:r.dia),hora:r.hora||null,
      cada:Math.max(1,r.cada||1),recurrente:true,sinDeuda:true,
      publica:r.dia!=null?addDays(lunes,r.dia):addDays(lunes,6)});
  })));
  return out;
}
function tareasDisponibles(){
  const out=[];
  activos().forEach(p=>{
    if(p.tipo==='habito')return;
    p.hitos.forEach(h=>{
      if(h.estado==='completado')return;
      h.tareas.forEach(t=>{
        if(t.rec)return;                                   // las recurrentes van por su cuenta
        if(t.asignado&&t.asignado!==autorNombre())return;  // asignada a otra persona
        const pend=Math.round((t.horas-horasTarea(t.id))*100)/100;
        if(t.estado==='completada'||pend<=0.25)return;
        out.push({id:t.id,proyecto:p.id,hito:h.id,hitoNombre:h.nombre,nombre:t.nombre,horas:t.horas,pend,asignado:t.asignado||null,
          etiquetas:t.etiquetas||[],desplaza:!!t.desplaza,critica:!!t.critica,
          bloqueante:!!t.bloqueante,fecha:h.fecha});
      });
    });
  });
  return out;
}
/* Posición exacta de una tarea en la vista Proyectos: proyecto, hito y subtarea.
   Es lo que decide el orden dentro de cada nivel de urgencia. */
function ordenManual(t){
  const ip=D.proyectos.findIndex(x=>x.id===t.proyecto);
  if(ip<0)return 9e9;
  const p=D.proyectos[ip];
  const ih=p.hitos.findIndex(h=>h.id===t.hito);
  if(ih<0)return ip*1e6+9e5;
  const it=p.hitos[ih].tareas.findIndex(x=>x.id===t.id);
  return ip*1e6+ih*1000+(it<0?999:it);
}
const porOrden=(a,b)=>ordenManual(a)-ordenManual(b);
function construirCola(lunes,capacidad,cubierto){
  const cola=[],notas=[];
  /* Tope por tarea: da igual por cuántos caminos entre en la cola
     (mínimo, bloqueante, deuda o reparto), nunca se planifican más
     horas de las que de verdad le quedan. */
  const puesto={};
  const empujar=(item,deseadas,total)=>{
    const id=item.id;
    const usado=puesto[id]||0;
    const libre=Math.max(0,(total===undefined?item.pend:total)-usado);
    const h=Math.min(deseadas===undefined?item.pend:deseadas,libre);
    if(h<=0.25)return null;
    puesto[id]=usado+h;
    const c=Object.assign({},item,{pend:Math.round(h*100)/100});
    cola.push(c);
    return c;
  };
  const rec=recurrentesDeSemana(lunes);
  const cub=cubierto||{};
  const tar=tareasDisponibles().map(t=>{
    const c=cub[t.id]||0;
    return c?Object.assign({},t,{pend:Math.round((t.pend-c)*100)/100}):t;
  }).filter(t=>t.pend>0.25);
  const deuda=(D.deuda||[]).slice().sort((a,b)=>{
    if(a.semanaOrigen!==b.semanaOrigen)return a.semanaOrigen<b.semanaOrigen?-1:1;
    const ta=tar.find(x=>x.id===a.tareaId), tb=tar.find(x=>x.id===b.tareaId);
    return (ta?ordenManual(ta):9e9)-(tb?ordenManual(tb):9e9);
  });
  const bajo=capacidad<D.config.umbrales.bajo;

  // 1. mínimos innegociables
  rec.filter(r=>r.minimo).forEach(r=>empujar(Object.assign({},r,{prio:1,razon:'Mínimo innegociable'})));
  activos().forEach(p=>{
    if(!p.minimo||p.tipo==='habito')return;
    const cand=tar.filter(t=>t.proyecto===p.id).sort(porOrden);
    let queda=p.minimo;
    cand.forEach(t=>{
      if(queda<=0.25)return;
      const c=empujar(Object.assign({},t,{prio:1,razon:'Mínimo semanal de '+p.nombre}),Math.min(queda,t.pend),t.pend);
      if(c)queda-=c.pend;
    });
  });
  // 2. bloqueantes y críticas con fecha cercana
  tar.filter(t=>t.bloqueante||t.critica).sort(porOrden).forEach(t=>{
    empujar(Object.assign({},t,{prio:2,razon:t.bloqueante?'Bloquea otras tareas':'Tarea crítica'}),t.pend,t.pend);
  });
  if(bajo){notas.push({t:'aviso',m:'Capacidad por debajo de '+D.config.umbrales.bajo+' h: esta semana solo da para los mínimos y lo que bloquea a otros. No se planifica nada más.'});
    return {cola,notas};}
  // 3. recurrentes con fecha de publicación
  rec.filter(r=>!r.minimo).forEach(r=>empujar(Object.assign({},r,{prio:3,razon:'Publica el '+DIAS[diaSemana(r.publica)].toLowerCase()})));
  tareasRecurrentes(lunes).filter(r=>!r.hora).sort(porOrden).forEach(r=>empujar(Object.assign({},r,{prio:3,
    razon:'Recurrente'+(r.cada>1?' cada '+r.cada+' semanas':' cada semana')+(r.dia!=null?', para el '+DIAS[r.dia].toLowerCase():'')})));
  // 4. deuda, la más antigua primero
  deuda.forEach(d=>{
    const t=tar.find(x=>x.id===d.tareaId);
    // la deuda adelanta la tarea, no duplica sus horas: el tope es lo que le queda
    const total=t?t.pend:d.horas;
    empujar({id:d.tareaId||uid('d'),proyecto:d.proyecto,nombre:d.nombre,pend:d.horas,hitoNombre:t?t.hitoNombre:null,
      hito:t?t.hito:null,etiquetas:t?t.etiquetas:['escritorio'],desplaza:t?t.desplaza:false,prio:4,esDeuda:true,
      deudaId:d.id,razon:'Deuda de '+d.semanaOrigen},Math.min(d.horas,total),total);
  });
  // 5. reparto porcentual ordinario
  const libres=D.proyectos.filter(p=>p.activo&&p.tipo!=='habito');
  const totalPct=libres.reduce((a,p)=>a+(p.pct||0),0)||100;
  libres.forEach(p=>{
    const cuota=capacidad*(p.pct||0)/totalPct;
    let queda=cuota;
    tar.filter(t=>t.proyecto===p.id).sort(porOrden).forEach(t=>{
      if(queda<=0.25)return;
      const c=empujar(Object.assign({},t,{prio:5,razon:'Reparto ordinario ('+p.pct+' % a '+p.nombre+')'}),
        Math.min(queda,t.pend),t.pend);
      if(c)queda-=c.pend;
    });
  });
  return {cola,notas};
}

/* ---------- Fase C — colocar ---------- */
function compatible(item,hueco){
  const e=item.etiquetas||[];
  if(item.desplaza)return false;                       // solo jornada completa
  if(e.includes('jornadaContinua'))return false;
  if(e.includes('comercial')&&!hueco.etiquetas.includes('comercial'))return false;
  if(e.includes('cita')&&!hueco.etiquetas.includes('cita'))return false;
  if(e.includes('luz')&&!hueco.etiquetas.includes('luz'))return false;
  if(e.includes('fisica')&&hueco.regla==='r_noche')return false;
  return true;
}
const MAXBLK=1.5, MINBLK=0.5;

function generarPlan(lunes,capacidad,diasOff,opts={}){
  const semId=semanaId(lunes);
  const cfg=D.config;
  const margen=capacidad*cfg.margenPct/100;
  const util=Math.max(0,capacidad-margen);
  const notas=[];
  const jornadas=[];

  // jornada de obra (consume cuota y capacidad)
  const prev=SEM[semId];
  const jorForzadas=(opts.jornadas!==undefined&&opts.jornadas!==null)?opts.jornadas:(prev?prev.jornadas:null);
  if(jorForzadas)jorForzadas.forEach(j=>{if(!diasOff.includes(j.fecha))jornadas.push(j);});
  else{
    const j=proponerJornada(lunes,semId);
    if(j&&!diasOff.includes(j.fecha)&&horasObraDia(j.fecha,opts.ocupados)>=2)jornadas.push(j);
  }
  let bloques=bloquesFijos(lunes,diasOff,jornadas);
  let usadas=0;      // capacidad ordinaria consumida
  let extra=0;       // horas fuera de ella: jornadas de obra y franjas excepcionales
  const porProyecto={};
  tareasRecurrentes(lunes).filter(r=>r.hora).forEach(r=>{
    const f=addDays(lunes,r.dia==null?0:r.dia);
    if(diasOff.includes(f)||esPasado(f))return;
    const ini=toMin(r.hora),dur=Math.round((r.pend||0.25)*60);
    bloques.push({id:uid('b'),fecha:f,ini,fin:ini+dur,tipo:'trabajo',proyecto:r.proyecto,
      tareaId:r.id,hito:r.hitoNombre,nombre:r.nombre,estado:'planificado',recFijo:true,
      motivo:'Cita fija recurrente'+(r.cada>1?' cada '+r.cada+' semanas':' cada semana')+' a las '+r.hora+'.'});
    const fueraDe=['cuota','excepcional'].indexOf(clasificaProtegido({fecha:f,ini,fin:ini+dur,tipo:'trabajo'}))>=0;
    if(fueraDe)extra+=dur/60;else usadas+=dur/60;
    porProyecto[r.proyecto]=(porProyecto[r.proyecto]||0)+dur/60;
    const est=estadoCelda(r.dia==null?0:r.dia,ini,f);
    if(est==='prot')notas.push({t:'aviso',m:'La cita fija «'+r.nombre+'» está puesta a las '+r.hora+' del '+DIAS[r.dia==null?0:r.dia].toLowerCase()+', dentro del tiempo de familia. Se respeta porque la has fijado tú, pero conviene revisarla.'});
    else if(est==='bloq')notas.push({t:'aviso',m:'La cita fija «'+r.nombre+'» cae en una franja no declarada como tiempo útil ('+r.hora+').'});
  });

  jornadas.forEach(j=>{
    const jb=bloquesJornada(j,opts.ocupados);
    bloques=bloques.concat(jb.bloques);
    const obras=tareasObraPendientes();
    const ocup=(opts.ocupados||[]).filter(o=>o.fecha===j.fecha).sort((p,q)=>p.ini-q.ini);
    let vi=0,cur=jb.ventanas[0][0],idx=0,vueltas=0;
    while(idx<obras.length&&vi<jb.ventanas.length&&vueltas++<200){
      const o=obras[idx];
      let pend=o.pend;
      while(pend>0.25&&vi<jb.ventanas.length&&vueltas++<400){
        const [a,z]=jb.ventanas[vi];
        if(cur<a)cur=a;
        if(cur>=z){vi++;if(vi<jb.ventanas.length)cur=jb.ventanas[vi][0];continue;}
        const dentro=ocup.find(x=>x.ini<=cur&&x.fin>cur);      // ya ocupado: se salta
        if(dentro){cur=dentro.fin;continue;}
        const sig=ocup.find(x=>x.ini>cur);                     // hasta dónde se puede llegar
        const tope=Math.min(z,sig?sig.ini:z);
        const libre=(tope-cur)/60;
        if(libre<0.5){cur=tope;continue;}
        const h=Math.min(pend,libre);
        const fin=cur+Math.round(h*60);
        bloques.push({id:uid('b'),fecha:j.fecha,ini:cur,fin,tipo:'trabajo',proyecto:'CASA',tareaId:o.t.id,
          nombre:o.t.nombre,hito:o.h.nombre,estado:'planificado',
          motivo:'Obra el '+DIAS[diaSemana(j.fecha)].toLowerCase()+': el día da '+fmtH(horasUtilesDia(j.fecha,opts.ocupados))+
            ' útiles, '+fmtH(2*D.config.minCoche/60)+' se van en coche y quedan '+fmtH(jb.horas)+' de trabajo.'+
            (esFinde(j.fecha)?' Con cargo a la cuota de '+mesDe(j.fecha)+'.':' Entre semana: ocupa el día.')});
        extra+=h;                          // la obra es siempre esfuerzo aparte
        porProyecto.CASA=(porProyecto.CASA||0)+h;pend-=h;cur=fin;
      }
      idx++;
    }
    const mes=mesDe(j.fecha),m=parse(j.fecha).getMonth();
    if(m<3||m>9)notas.push({t:'aviso',m:'La jornada de obra del '+esp(j.fecha)+' cae fuera de la ventana meteorológica de abril a octubre. Comprueba la previsión antes de confirmarla.'});
    notas.push({t:'info',m:'Obra el '+DIAS[diaSemana(j.fecha)].toLowerCase()+' '+esp(j.fecha)+': '+fmtH(jb.horas)+
      ' de trabajo, las que da ese día, por '+fmtH(2*D.config.minCoche/60)+' de coche.'+
      (esFinde(j.fecha)?' Cuota de '+mes+': '+(jornadasUsadas(mes,semId)+1)+' de '+cuotaMes(mes)+'.':' Entre semana, sale de tu capacidad.')});
    if(jb.horas<=0)notas.push({t:'aviso',m:'El '+DIAS[diaSemana(j.fecha)].toLowerCase()+' '+esp(j.fecha)+
      ' no queda tiempo útil para la obra una vez descontado el coche. Revisa tus franjas de ese día o elige otro.'});
  });

  // cola y huecos
  const {cola,notas:n2}=opts.cola?{cola:opts.cola,notas:opts.notas||[]}:construirCola(lunes,capacidad,opts.cubierto);
  n2.forEach(n=>notas.push(n));
  const diasObra=jornadas.map(j=>j.fecha);
  const huecos=huecosSemana(lunes,diasOff).filter(h=>!diasObra.includes(h.fecha));
  const cargaDia={};
  bloques.filter(b=>b.tipo==='trabajo').forEach(b=>{cargaDia[b.fecha]=(cargaDia[b.fecha]||0)+(b.fin-b.ini)/60;});
  const sinSitio=[];
  const proyDia={};

  for(const item of cola){
    if(usadas>=util-0.25){sinSitio.push(item);continue;}
    let pend=item.pend;
    if(item.desplaza){sinSitio.push(item);continue;}
    const orden=item.publica?huecos.slice().sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.min-b.min)
      :huecos.slice().sort((a,b)=>((cargaDia[a.fecha]||0)-(cargaDia[b.fecha]||0))||(a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0)||a.min-b.min);
    for(const hu of orden){
      if(pend<=0.25)break;
      if(usadas>=util-0.25)break;
      const libre=hu.horas-hu.usadas;
      if(libre<MINBLK)continue;
      if(!compatible(item,hu))continue;
      if(item.publica&&hu.fecha>item.publica)continue;
      const dset=proyDia[hu.fecha]=proyDia[hu.fecha]||new Set();
      if(dset.size>=2&&!dset.has(item.proyecto)&&capacidad<=D.config.umbrales.alto)continue;
      const h=Math.min(pend,libre,MAXBLK,util-usadas);
      if(h<MINBLK)continue;
      const ini=hu.libreMin, fin=ini+Math.round(h*60);
      if(fin>hu.max)continue;
      if(typeof chocaExterno==='function'&&chocaExterno(hu.fecha,ini,fin))continue;
      if((opts.ocupados||[]).some(o=>o.fecha===hu.fecha&&o.ini<fin&&o.fin>ini))continue;
      bloques.push({id:uid('b'),fecha:hu.fecha,ini,fin,tipo:'trabajo',proyecto:item.proyecto,
        tareaId:item.recurrente?null:item.id,recurrenteId:item.rid||null,nombre:item.nombre,
        hito:item.hitoNombre||null,quien:item.asignado||null,
        estado:'planificado',deudaId:item.deudaId||null,
        motivo:item.razon+'. Colocada en «'+hu.nombre+'» porque admite '+(item.etiquetas.join(', ')||'cualquier contexto')+'.'});
      hu.usadas+=h;hu.libreMin=fin;pend-=h;dset.add(item.proyecto);
      if(hu.tipoRegla==='excepcional')extra+=h;else usadas+=h;
      cargaDia[hu.fecha]=(cargaDia[hu.fecha]||0)+h;
      porProyecto[item.proyecto]=(porProyecto[item.proyecto]||0)+h;
    }
    if(pend>0.25)sinSitio.push(Object.assign({},item,{pend}));
  }

  // Red de seguridad: si por cualquier camino una tarea acabara con más
  // horas de las que le quedan, se recorta y se deja anotado.
  (function(){
    const porT={};
    bloques.forEach(b=>{if(b.tipo==='trabajo'&&b.tareaId)porT[b.tareaId]=(porT[b.tareaId]||0)+(b.fin-b.ini)/60;});
    Object.keys(porT).forEach(id=>{
      const t=tareaPorId2(id);
      if(!t||t.rec)return;
      const limite=Math.max(0,t.horas-horasTarea(id)-((opts.cubierto||{})[id]||0));
      let sobra=Math.round((porT[id]-limite)*100)/100;
      if(sobra<=0.25)return;
      const suyos=bloques.filter(b=>b.tipo==='trabajo'&&b.tareaId===id).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.ini-a.ini);
      suyos.forEach(b=>{
        if(sobra<=0.25)return;
        const h=(b.fin-b.ini)/60;
        if(h<=sobra+0.01){b.__quitar=true;sobra-=h;usadas=Math.max(0,usadas-h);
          porProyecto[b.proyecto]=Math.max(0,(porProyecto[b.proyecto]||0)-h);}
        else{b.fin=b.fin-Math.round(sobra*60);usadas=Math.max(0,usadas-sobra);
          porProyecto[b.proyecto]=Math.max(0,(porProyecto[b.proyecto]||0)-sobra);sobra=0;}
      });
      notas.push({t:'info',m:'«'+t.nombre+'» ya tenía cubiertas sus horas esta semana: se ha quitado lo que sobraba.'});
    });
    bloques=bloques.filter(b=>!b.__quitar);
  })();

  // Fase D
  sinSitio.forEach(it=>{
    if(it.sinDeuda){
      notas.push({t:'alerta',m:'«'+it.nombre+'» toca el '+esp(it.publica)+' y faltan '+fmtH(it.pend)+' sin sitio. Al ser recurrente no genera deuda: esta repetición se pierde. Decide ya entre recortarla, aplazarla o delegarla.'});
    }else if(it.desplaza){
      notas.push({t:'info',m:'«'+it.nombre+'» exige desplazamiento: solo cabe en jornada completa de fin de semana o en vacaciones. No se ha programado entre semana.'});
    }else{
      notas.push({t:'info',m:'«'+it.nombre+'» no cupo esta semana ('+fmtH(it.pend)+'). Pasa a deuda.'});
    }
  });

  bloques.forEach(b=>{
    if(b.tipo!=='reservado'||b.estado==='anulado')return;
    if(!P(b.proyecto))return;                       // Personal no es proyecto
    porProyecto[b.proyecto]=(porProyecto[b.proyecto]||0)+(b.fin-b.ini)/60;
  });
  const ahora=AHORA();
  bloques.forEach(b=>{if(!b.actualizado)b.actualizado=ahora;});
  const plan={id:semId,lunes,actualizado:ahora,capacidad,diasOff,margen,util,extra,bloques,jornadas,notas,
    porProyecto,usadas,generado:new Date().toISOString(),sinSitio:sinSitio.filter(s=>!s.sinDeuda&&!s.desplaza).map(s=>({tareaId:s.id,proyecto:s.proyecto,nombre:s.nombre,horas:s.pend}))};
  return plan;
}

/* ---------- deuda ---------- */
function registrarDeuda(plan){
  D.deuda=D.deuda||[];
  plan.sinSitio.forEach(s=>{
    const ya=D.deuda.find(d=>d.tareaId===s.tareaId);
    if(ya){ya.horas=Math.max(ya.horas,s.horas);return;}
    D.deuda.push({id:uid('deu'),tareaId:s.tareaId,proyecto:s.proyecto,nombre:s.nombre,
      horas:s.horas,semanaOrigen:plan.id});
  });
}
function saldarDeuda(deudaId,horas){
  const d=(D.deuda||[]).find(x=>x.id===deudaId);if(!d)return;
  d.horas-=horas;
  if(d.horas<=0.25)D.deuda=D.deuda.filter(x=>x.id!==deudaId);
}
function edadDeuda(d){
  const s=Object.values(todasSemanas()).find(s=>s.id===d.semanaOrigen);
  if(!s)return 0;
  return Math.max(0,Math.floor(diffDias(s.lunes,hoyISO())/7));
}

/* ---------- avance ---------- */
function avanceHito(h){
  if(h.avanceManual!=null)return h.avanceManual;
  if(h.estado==='completado')return 100;
  const est=h.tareas.reduce((a,t)=>a+t.horas,0)||h.horas||1;
  return Math.min(95,100*horasHito(h)/est);
}
function avanceProyecto(p){
  if(p.tipo==='habito')return adherencia(p,7).pct;
  if(!p.hitos.length)return 0;
  const tot=p.hitos.reduce((a,h)=>a+h.peso,0)||100;
  return p.hitos.reduce((a,h)=>a+h.peso*avanceHito(h),0)/tot;
}
function esfuerzoProyecto(p){
  const est=p.hitos.reduce((a,h)=>a+(h.tareas.reduce((x,t)=>x+t.horas,0)||h.horas),0);
  return est?100*horasProyecto(p.id)/est:0;
}
function adherencia(p,dias){
  const desde=addDays(hoyISO(),-dias+1);
  let hechas=0;
  Object.values(todasSemanas()).forEach(s=>s.bloques.forEach(b=>{
    if(b.proyecto!=='SALUD'||b.fecha<desde||b.fecha>hoyISO())return;
    if(b.estado==='hecho')hechas++;
  }));
  const obj=Math.round((p.objetivoSesiones||8)*dias/7);
  return {hechas,obj,pct:obj?Math.min(100,100*hechas/obj):0};
}
function estadoProyecto(p){
  if(p.tipo==='habito'){const a=adherencia(p,7);return a.pct>=80?'ok':a.pct>=60?'deuda':'riesgo';}
  const deu=(D.deuda||[]).filter(d=>d.proyecto===p.id);
  const av=avanceProyecto(p),es=esfuerzoProyecto(p);
  if(es-av>15)return 'riesgo';
  if(deu.length)return 'deuda';
  return 'ok';
}
function viabilidad(p){
  if(!p.fechaLimite)return null;
  const est=p.hitos.reduce((a,h)=>a+(h.tareas.reduce((x,t)=>x+t.horas,0)||h.horas),0);
  const pend=Math.max(0,est-horasProyecto(p.id));
  const semanas=Math.max(1,Math.round(diffDias(hoyISO(),p.fechaLimite)/7));
  const hist=Object.values(todasSemanas()).filter(s=>s.porProyecto&&s.porProyecto[p.id]).map(s=>s.porProyecto[p.id]);
  const media=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:(p.pct/100)*12;
  const necesarias=pend/semanas;
  return {pend,semanas,media,necesarias,cabe:media>=necesarias};
}

function faseSalud(fecha){
  const w=Math.floor(diffDias(D.config.inicioPlanSalud,fecha)/7);
  return Math.max(0,Math.min(3,Math.floor(w/6)));
}
function tipoSesion(fecha,esObra,previoObra){
  if(esObra)return 'R';
  const d=diaSemana(fecha);
  if(previoObra)return 'L';
  return ['A','M','B','M','C','L','M'][d];
}
function molestiasDe(fecha){
  const d=(D.diario||{})[fecha];
  const ayer=(D.diario||{})[addDays(fecha,-1)];
  const m=new Set();
  ((d&&d.molestias)||[]).forEach(x=>m.add(x));
  ((ayer&&ayer.molestias)||[]).forEach(x=>m.add(x));   // también el día siguiente
  return [...m];
}
function energiaDe(fecha){const d=(D.diario||{})[fecha];return d?d.energia:null;}

function fichaEjercicio(fecha,bloque,forzarCorta){
  const esObra=bloque&&bloque.nombre&&bloque.nombre.indexOf('Movilidad antes')===0;
  const ayer=addDays(fecha,-1);
  const previoObra=Object.values(todasSemanas()).some(s=>(s.jornadas||[]).some(j=>j.fecha===ayer));
  const esNat=bloque&&bloque.nombre==='Natación';
  const k=esNat?'N':tipoSesion(fecha,esObra,previoObra);
  const f=FASES[faseSalud(fecha)];
  const reg=SES.find(s=>s.tipo==='ejercicio'&&s.fecha===fecha&&s.bloqueId===(bloque&&bloque.id));
  const mol=molestiasDe(fecha);
  const en=energiaDe(fecha);
  const hayObra=Object.values(todasSemanas()).some(s=>(s.jornadas||[]).some(j=>j.fecha===fecha));
  // la natación no se toca
  const corta=esNat?false:(forzarCorta!==undefined?forzarCorta
    :(hayObra||k==='R'||(en&&en<=2)||capacidadApretada()));
  let lista=EJ[k].l.map(x=>Object.assign({},x));
  const cambios=[];
  if(!esNat)mol.forEach(m=>{
    const tabla=SUSTITUTOS[m];if(!tabla)return;
    lista=lista.map(e=>{
      const sus=tabla[e.g];
      if(!sus)return e;
      cambios.push(e.n+' → '+sus.n);
      return Object.assign({},sus);
    });
    if(m==='lumbar')lista=lista.filter(e=>!e.ax);
  });
  // quitar duplicados que puedan salir de la sustitución
  const vistos={};lista=lista.filter(e=>vistos[e.n]?false:(vistos[e.n]=true));
  const suave=(k==='L'||k==='R'||esNat);
  const tope=suave?lista.length:(corta?3:5);
  lista=lista.slice(0,tope);
  return {clave:k,titulo:EJ[k].t,fase:f,corta,minutos:esNat?45:(corta?30:45),
    molestias:mol,cambios,energia:en,
    ejercicios:lista.map((e,i)=>({nombre:e.n,grupo:e.g,
      series:suave?'—':(corta?Math.max(2,f.s-1):f.s),reps:suave?'—':f.r,
      peso:(reg&&reg.detalle&&reg.detalle[i]&&reg.detalle[i].peso)||'',
      hecho:!!(reg&&reg.detalle&&reg.detalle[i]&&reg.detalle[i].hecho)}))};
}
function capacidadApretada(){
  const plan=SEM[semanaId(lunesDe(hoyISO()))];
  return !!(plan&&plan.capacidad<D.config.umbrales.bajo);
}

/* ---------- actividad principal de un bloque ---------- */
function hitoDe(b){
  if(b.hito)return b.hito;
  if(!b.tareaId)return null;
  for(const p of D.proyectos)for(const h of p.hitos)
    if(h.tareas.some(t=>t.id===b.tareaId))return h.nombre;
  return null;
}

/* ---------- las recurrentes de configuración pasan a ser subtareas ---------- */
function migrarRecurrentes(){
  if(D.config.recMigrados){D.config.recurrentes=D.config.recurrentes||[];return;}
  const rs=D.config.recurrentes||[];
  rs.forEach(r=>{
    const p=P(r.proyecto);if(!p)return;
    let h=p.hitos.find(x=>x.id==='REC_'+p.id);
    if(!h){h={id:'REC_'+p.id,nombre:'Producción recurrente',peso:0,horas:0,fecha:null,
      estado:'en_curso',tareas:[]};p.hitos.push(h);}
    if(h.tareas.some(t=>t.id==='REC_'+r.id))return;
    h.tareas.push({id:'REC_'+r.id,nombre:r.nombre,horas:r.horas,contexto:'escritorio',
      estado:'pendiente',critica:false,bloqueante:false,desplaza:false,
      etiquetas:r.etiquetas||['escritorio'],
      rec:{activo:true,cada:Math.max(1,r.cadencia||1),horas:r.horas,
        dia:(r.diaPub===undefined?null:r.diaPub),hora:null,
        desde:lunesDe(hoyISO()),hasta:null}});
  });
  D.config.recurrentes=[];D.config.recMigrados=true;
}

/* ---------- todo proyecto tiene su porcentaje, también los de hábito ---------- */
function migrarReparto(){
  if(D.config.repartoMigrado){return;}
  const act=D.proyectos.filter(p=>p.activo);
  const hab=act.filter(p=>p.tipo==='habito'&&!(p.pct>0));
  if(hab.length){
    const otros=act.filter(p=>p.tipo!=='habito');
    const suma=otros.reduce((a,p)=>a+(p.pct||0),0);
    const cuota=15*hab.length;
    if(suma>0)otros.forEach(p=>p.pct=Math.round((p.pct||0)*(100-cuota)/suma));
    hab.forEach(p=>p.pct=15);
    const t=act.reduce((a,p)=>a+(p.pct||0),0);
    if(t!==100&&otros.length)otros[0].pct+=100-t;
  }
  D.config.repartoMigrado=true;
}

/* ---------- persona asignada a un bloque ---------- */
function quienDe(b){
  if(b.quien)return b.quien;
  if(!b.tareaId)return null;
  for(const p of D.proyectos)for(const h of p.hitos)
    for(const t of h.tareas)if(t.id===b.tareaId)return t.asignado||null;
  return null;
}

      '<span class="tiny muted">'+fmtH(c)+' · '+(viajes(plan)*D.config.kmPorViaje*D.config.costeKm).toFixed(2)+' €</span></div>';
    h+='</div>';
  }else{
    h+='<p class="tiny muted">Declara la capacidad de la semana para ver el reparto.</p>'+
       '<div style="margin-top:10px"><button class="btn primary" data-act="ir-semana">Planificar la semana</button></div>';
  }
  h+='</div>';

  const mesAct=hoyISO().slice(0,7);
  const restan=cuotaMes(mesAct)-jornadasUsadas(mesAct,null);
  h+='<div class="tira"><span>Cuota de fin de semana de '+MESES[Number(mesAct.slice(5))-1]+'</span>'+
     '<b style="color:'+(restan>0?'var(--ok)':'var(--warn)')+'">'+(restan>0?restan+' jornada'+(restan===1?'':'s')+' libre'+(restan===1?'':'s'):'agotada')+'</b>'+
     '<span class="tiny muted">de '+cuotaMes(mesAct)+'</span></div>';
  const fis=fiscalesProximas(30);
  if(fis.length){
    h+='<div class="card" style="margin-bottom:12px"><b style="font-size:14px">Vencimientos cercanos</b><div style="margin-top:8px">';
    fis.slice(0,5).forEach(f=>{
      const urg=f.dias<=f.aviso;
      h+='<div class="row tiny" style="padding:5px 0;border-top:1px solid var(--line)">'+
        '<span class="dot" style="background:'+f.color+'"></span>'+esc(f.nombre)+
        '<span class="spacer"></span><span style="color:'+(urg?'var(--bad)':'var(--muted)')+'">'+
        espCorto(f.vence)+' · '+(f.dias===0?'hoy':'en '+f.dias+' días')+'</span></div>';
    });
    h+='</div></div>';
  }

  const nts=notasSemana(lunesDe(hoyISO()));
  if(nts.length){
    h+='<div class="card" style="margin-bottom:12px"><b style="font-size:14px">Notas de la semana</b><div style="margin-top:8px">';
    nts.forEach(b=>h+='<div class="notarow" data-act="nota-ir" data-id="'+b.id+'" style="--pc:'+colorDe(b.proyecto)+'">'+
      '<span class="tiny muted">'+DIAS3[diaSemana(b.fecha)]+' '+hhmm(b.ini)+'</span>'+
      '<span><b>'+esc(b.nombre)+'</b><br>'+esc(b.nota)+'</span></div>');
    h+='</div></div>';
  }

  // avisos
  const avisos=[];
  (D.deuda||[]).forEach(d=>{const e=edadDeuda(d);if(e>=3)avisos.push({t:'alerta',m:'«'+d.nombre+'» acumula '+e+' semanas de deuda ('+fmtH(d.horas)+'). Replantéala o elimínala.'});});
  activos().forEach(p=>{const v=viabilidad(p);
    if(v&&!v.cabe)avisos.push({t:'alerta',m:p.nombre+': para llegar al '+esp(p.fechaLimite)+' harían falta '+fmtH(v.necesarias)+' a la semana y el ritmo real es de '+fmtH(v.media)+'. Faltan '+fmtH(v.necesarias-v.media)+' semanales.'});
    else if(v)avisos.push({t:'info',m:p.nombre+': '+esp(p.fechaLimite)+' es alcanzable con '+fmtH(v.necesarias)+' semanales durante '+v.semanas+' semanas.'});});
  if(plan)plan.notas.filter(n=>n.t!=='info').forEach(n=>avisos.push(n));
  h+='<p class="tiny muted" style="margin-top:14px;text-align:center">Centro de mando '+esc(VERSION_APP)+'</p>';
  if(avisos.length){
    h+='<div class="card"><b style="font-size:14px">Avisos</b><div style="display:flex;flex-direction:column;gap:8px;margin-top:10px">';
    avisos.forEach(a=>h+='<div class="'+(a.t==='alerta'?'badbox':'warnbox')+'">'+esc(a.m)+'</div>');
    h+='</div></div>';
  }
  return h;
}

/* ---------- SEMANA ---------- */
function estadoCelda(dia,min,fecha){
  const rs=reglasDe(dia,fecha).filter(r=>toMin(r.ini)<=min&&toMin(r.fin)>min);
  if(!rs.length)return 'bloq';
  const ord=['reservado','bloqueado','protegido','cuota','disponible','excepcional'];
  rs.sort((a,b)=>ord.indexOf(a.tipo)-ord.indexOf(b.tipo));
  const t=rs[0].tipo;
  return t==='protegido'?'prot':t==='cuota'?'cuota':t==='excepcional'?'exc':t==='disponible'?'':'bloq';
}

  const ex=plan.extra||0;

    '<span>Margen <b>'+fmtH(plan.margen)+'</b></span>'+
    (ex>0.05?'<span style="color:var(--coche)">Fuera de tu capacidad <b style="color:var(--coche)">+'+fmtH(ex)+'</b></span>':'')+
    (jor.length?'<span>Obra <b>'+jor.map(j=>DIAS3[diaSemana(j.fecha)]).join(', ')+'</b></span>':'')+

  // cuadrícula

    for(let i=0;i<7;i++){
      const f=addDays(lun,i);
      let cls=(plan.diasOff.includes(f)?'bloq':estadoCelda(i,m,f))+(esPasado(f)?' pasado':'');
      const ex=(typeof chocaExterno==='function')&&chocaExterno(f,m,m+30);
      if(ex)cls+=' externo';
      const exT=ex?(externosDe(f).find(x=>x.ini<m+30&&x.fin>m)||{}).titulo:'';
      h+='<div class="cell '+cls+(m%60===0?' hh':'')+'"'+(exT?' title="'+esc(exT)+'"':'')+' data-act="celda" data-f="'+f+'" data-d="'+i+'" data-m="'+m+'" style="grid-column:'+(i+2)+';grid-row:'+row+'"></div>';

  plan.bloques.slice().sort((a,b)=>a.ini-b.ini).forEach(b=>{
    const i=diffDias(lun,b.fecha);if(i<0||i>6)return;
    if(b.fin<=INI||b.ini>=FIN)return;
    const ini=Math.max(b.ini,INI), fin=Math.min(b.fin,FIN);
    const r1=2+Math.round((ini-INI)/30), span=Math.max(1,Math.round((fin-ini)/30));
    const col=b.tipo==='coche'?'var(--coche)':colorDe(b.proyecto);

    const bb=b.tipo==='coche'?'#231f33':'color-mix(in srgb,'+col+' 22%, var(--surface2))';
    const cab='<div class="blk'+(b.tipo==='coche'?' coche':'')+(b.nota?' connota':'')+(alto<30?' mini':'')+

      'data-act="blk" data-id="'+b.id+'" title="'+esc((qn?qn+' · ':'')+(hi?hi+' › ':'')+b.nombre+(b.nota?'\n\n'+b.nota:''))+'">';
    if(alto<30){
      // media hora: hito y tarea comprimidos en un renglón, la nota en el siguiente
      // muy corto: primero el nombre, que es lo que de verdad necesitas leer
      h+=cab+'<b class="uni">'+(qn?'<span class="quien">'+esc(qn)+'</span> ':'')+esc(b.nombre)+
         (hi?'<span class="muted"> · '+esc(hi)+'</span>':'')+'</b>'+
         (b.nota?'<small class="nb" style="-webkit-line-clamp:1">'+esc(b.nota)+'</small>':'')+
         (b.estado==='anulado'?'':'<i class="rz aba" data-rz="fin" data-id="'+b.id+'"></i>')+'</div>';
      return;
    }
    const cn=b.nota?(span>=4?2:1):(span>=3?3:2);   // líneas para el nombre
    h+=cab+
       (hi||qn?'<small class="hito">'+(qn?'<span class="quien">'+esc(qn)+'</span> ':'')+esc(hi||'')+'</small>':'')+
       '<b style="-webkit-line-clamp:'+cn+'">'+esc(b.nombre)+'</b>'+

       '</div>';
  });
  h+='</div></div>';
  h+='<div class="legend">'+activos().map(p=>'<span><i style="background:'+p.color+'"></i>'+esc(p.nombre)+'</span>').join('')+
     '<span><i style="background:var(--coche)"></i>Coche</span>'+
     '<span><i style="background:var(--prot);outline:1px solid var(--line2)"></i>Familia y bloques protegidos</span>'+

      esc(d.nombre)+'<span class="spacer"></span><span class="muted">'+fmtH(d.horas)+' · '+edadDeuda(d)+' sem</span>'+
      '<button class="btn sm ghost" data-act="deuda-del" data-id="'+d.id+'">Descartar</button></div>');
    h+='</div></div>';
  }
  return h;
}

        '<span>Llegar al '+esp(p.fechaLimite)+' <b style="color:'+col+'">'+(sim.prob===null?'—':sim.prob+' %')+'</b></span>'+
        (sim.pocas?'<span class="tiny">con capacidad teórica, aún sin histórico</span>':'')+
        '<button class="btn sm ghost" data-act="viab" data-id="'+p.id+'">Ver detalle</button></div>';
    }
    const nc=canalDe(p.id)?comentNuevosProyecto(p):0;
    const ha=canalDe(p.id)?horasPorAutor(p.id):null;
    if(ha&&Object.keys(ha).length)h+='<div class="row tiny muted" style="margin-top:6px;gap:14px">'+
      '<span>Compartido:</span>'+Object.keys(ha).map(k=>'<span><b style="color:var(--text)">'+esc(k)+'</b> '+fmtH(ha[k])+'</span>').join('')+
      '<button class="btn sm ghost" data-act="comp-ahora">Sincronizar</button>'+
      '<button class="btn sm ghost" data-act="activ" data-id="'+p.id+'">Actividad</button>'+
      '<button class="btn sm ghost" data-act="correos" data-id="'+p.id+'">Correo semanal</button>'+
      (nc?'<span class="tag quien">'+nc+' comentario'+(nc===1?'':'s')+'</span>':'')+'</div>';
    if(p.tipo!=='habito'&&es-av>15)h+='<div class="warnbox" style="margin-top:10px">El esfuerzo va '+Math.round(es-av)+' puntos por delante del avance. O las estimaciones son cortas o el hito está mal definido.</div>';
    if(p.tipo==='habito'){
      [7,30,90].forEach(d=>{const a=adherencia(p,d);
        h+='<div class="hbar" style="margin-top:8px"><span class="tiny muted">'+d+' días</span>'+
           '<span class="track"><i style="width:'+a.pct+'%;background:'+p.color+'"></i></span>'+
           '<span class="tiny muted">'+a.hechas+'/'+a.obj+'</span></div>';});
    }
    h+='<div class="hitos" style="margin-top:6px">';
    p.hitos.forEach(hi=>{
      const a=avanceHito(hi);
      h+='<div class="hitobox" data-sort="hito" data-p="'+p.id+'" data-id="'+hi.id+'">';
      h+='<div class="hitorow"><span><span class="asa">⠿</span>'+esc(hi.nombre)+
         '<span class="mini"><i style="width:'+a+'%;background:'+p.color+'"></i></span></span>'+
         '<span class="tiny muted">'+Math.round(a)+' %</span>'+
         '<span class="row" style="gap:4px;justify-content:flex-end"><span class="tiny muted">peso '+esc(hi.peso)+'</span>'+
         '<button class="btn sm ghost" data-act="hito-edit" data-p="'+p.id+'" data-h="'+hi.id+'">···</button></span></div>';
      h+='<div class="tareas">';
      hi.tareas.forEach(t=>{
        const hr=horasTarea(t.id),pend=t.horas-hr;
        h+='<div class="taskrow" data-sort="tarea" data-p="'+p.id+'" data-h="'+hi.id+'" data-id="'+t.id+'">'+
          '<span class="asa">⠿</span>'+
          '<span class="dot" style="background:'+(pend<=0.25?'var(--ok)':'var(--line2)')+'"></span>'+
          esc(t.nombre)+'<span class="spacer"></span>'+
          (t.desplaza?'<span class="tag">obra</span>':'')+(t.bloqueante?'<span class="tag">bloqueante</span>':'')+
          (t.asignado?'<span class="tag quien">'+esc(t.asignado)+'</span>':'')+
        (t.rec?'<span class="tag rec">'+(t.rec.cada>1?'cada '+t.rec.cada+' sem':'semanal')+
           (t.rec.dia!=null?' · '+DIAS3[t.rec.dia]:'')+(t.rec.hora?' '+t.rec.hora:'')+'</span>':'')+
        '<span>'+(t.rec?fmtH(t.rec.horas)+'/sem':fmtH(hr)+' / '+fmtH(t.horas))+'</span>'+
          (canalDe(p.id)?'<button class="btn sm ghost" data-act="coment" data-p="'+p.id+'" data-h="'+hi.id+'" data-t="'+t.id+'">'+
            (nuevosComent(t)?'💬 '+nuevosComent(t):(comentarios(t).length?'💬':'+ 💬'))+'</button>':'')+
          '<button class="btn sm ghost" data-act="tarea-edit" data-p="'+p.id+'" data-h="'+hi.id+'" data-t="'+t.id+'">···</button></div>';
      });
      h+='</div>';
      h+='<div class="row" style="padding:2px 0 6px 22px"><button class="btn sm ghost" data-act="tarea-new" data-p="'+p.id+'" data-h="'+hi.id+'">+ subtarea</button></div>';
      h+='</div>';
    });
    h+='</div>';
    if(p.tipo!=='habito')h+='<div class="row" style="margin-top:6px"><button class="btn sm ghost" data-act="hito-new" data-p="'+p.id+'">Añadir hito</button>'+
      '<button class="btn sm ghost" data-act="fiscal" data-id="'+p.id+'">'+
      (p.hitos.some(x=>x.id==='fisc_'+p.id)?'Ampliar obligaciones de la SL':'Añadir obligaciones de una SL')+'</button></div>';
    if(deu.length)h+='<div class="warnbox" style="margin-top:10px">Deuda: '+deu.map(d=>esc(d.nombre)+' ('+fmtH(d.horas)+')').join(', ')+'</div>';
    h+='</div>';
  });
  h+='</div>';
  return h;
}

      '. No se planifica hacia atrás: lo que quedó sin hacer ya está en la deuda y volverá a proponerse.</div>'+
      '<div class="row"><button class="btn ghost" data-act="cerrar">Cerrar</button>'+
      '<button class="btn primary" data-act="sem-hoy">Ir a la semana actual</button></div>');

  }
  const teor=capacidadTeorica(lun);
