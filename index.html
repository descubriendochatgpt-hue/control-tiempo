/* ============================================================
   SINCRONIZACIÓN CON GOOGLE SHEETS
   El navegador guarda siempre en local. Además, si hay hoja
   configurada, empuja y trae los cambios para que móvil y
   ordenador vean lo mismo.
   ============================================================ */
var sucio=false, syncEstado='off', syncUltima=null, syncT=null, syncOcupado=false;

function syncCfg(){
  D.config.sync=D.config.sync||{url:'',clave:'',activo:false,base:null,dispositivo:''};
  if(!D.config.sync.dispositivo)D.config.sync.dispositivo=/Mobi|Android|iPhone/i.test(navigator.userAgent)?'Móvil':'Ordenador';
  return D.config.sync;
}
function pintarEstado(){
  const e=$('#save');if(!e)return;
  const s=syncCfg();
  const corto=typeof innerWidth!=='undefined'&&innerWidth<760;
  if(!s.url||!s.activo){
    e.textContent=guardando?'Guardando…':(s.url?'Sincronización apagada':'Sin sincronizar');
    return;
  }
  const txt=(corto
    ?{off:guardando?'Guardando…':'Guardado',sync:'Sincronizando…',
       ok:'Al día'+(syncUltima?' '+syncUltima:''),pend:'Sin subir',error:'Sin conexión'}
    :{off:guardando?'Guardando…':'Guardado en este dispositivo',sync:'Sincronizando…',
       ok:'Sincronizado'+(syncUltima?' '+syncUltima:''),pend:'Cambios sin subir',error:'Sin conexión con la hoja'}
  )[syncEstado]||'';
  e.innerHTML=s.activo?'<button data-act="sync-ahora" style="color:'+
    (syncEstado==='error'?'var(--bad)':syncEstado==='pend'?'var(--warn)':'var(--faint)')+'">'+esc(txt)+'</button>':esc(txt);
}
function marcarSucio(){sucio=true;if(syncCfg().activo){syncEstado='pend';pintarEstado();programarSync();}}
function programarSync(){clearTimeout(syncT);syncT=setTimeout(()=>sincronizar(false),2500);}

async function syncLlamar(accion,payload){
  const s=syncCfg();
  if(!s.url)throw new Error('sin dirección');
  const cuerpo=JSON.stringify({clave:s.clave,accion,payload});
  const t0=Date.now();
  const r=await fetch(s.url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:cuerpo})
    .catch(e=>{registrarOperacion(accion,'sin red: '+e.message,cuerpo.length,false);throw e;});
  const txt=await r.text();
  let j;
  try{j=JSON.parse(txt);}
  catch(e){
    registrarOperacion(accion,'respuesta ilegible ('+txt.length+' car.)',0,false);
    throw new Error('respuesta inesperada: revisa que el acceso sea «cualquier persona»');
  }
  if(j.error){registrarOperacion(accion,'error de la hoja: '+j.error,0,false);throw new Error(j.error);}
  registrarOperacion(accion,'correcto',cuerpo.length,true);
  return j;
}
function paquete(){
  const copia=JSON.parse(JSON.stringify(D));
  delete copia.config.sync;                       // la clave no viaja a la hoja
  delete copia.registro;                          // el registro técnico es de este dispositivo
  return {datos:copia,semanas:SEM,sesiones:SES,incidencias:INC,
    actualizado:new Date().toISOString(),dispositivo:syncCfg().dispositivo};
}
function horaCorta(iso){const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());}

async function syncSubir(){
  const p=paquete();
  await syncLlamar('guardar',p);
  const s=syncCfg();s.base=p.actualizado;
  fijarMapa();
  sucio=false;syncEstado='ok';syncUltima=horaCorta(p.actualizado);
  await guardar(false);pintarEstado();
}
function adoptar(rem){
  const s=syncCfg();
  const mio={url:s.url,clave:s.clave,activo:s.activo,dispositivo:s.dispositivo,base:rem.actualizado};
  D=rem.datos;D.deuda=D.deuda||[];
  D.config=Object.assign({},CONFIG_DEF,D.config||{});
  D.config.sync=mio;
  migrarReglas();
  SEM=rem.semanas||{};SES=rem.sesiones||[];INC=rem.incidencias||[];
  migrarRecurrentes();migrarReparto();migrarV2();migrarV3();migrarV4();migrarV5();
  fijarMapa();
  sucio=false;syncEstado='ok';syncUltima=horaCorta(rem.actualizado);
}

/* ¿es la primera sincronización de este dispositivo? */
function primeraSincro(){const s=syncCfg();return !s.base&&!s.mapa;}
/* ¿hay trabajo propio aquí, o es una instalación recién abierta? */
function instalacionVirgen(){
  return !SES.length&&!Object.keys(SEM).length&&!Object.keys(ARCH||{}).length;
}
function mPrimeraVez(rem){
  window.__remPrim=rem;
  const dis=rem.dispositivo||'el otro dispositivo';
  modal('<h3>Primera sincronización de este dispositivo</h3>'+
    '<div class="mst">En la hoja hay datos de '+esc(dis)+' ('+esp(rem.actualizado.slice(0,10))+') y aquí también tienes trabajo hecho. Elige qué hacer, porque no es lo mismo.</div>'+
    '<button class="mopt" data-act="prim" data-v="traer">Traer lo de la hoja<small>Se descarta lo que haya en este dispositivo. Es lo normal si acabas de instalar la app aquí.</small></button>'+
    '<button class="mopt" data-act="prim" data-v="subir">Subir lo de este dispositivo<small>Sustituye lo que hay en la hoja. Solo si aquí está lo bueno.</small></button>'+
    '<button class="mopt" data-act="prim" data-v="fusionar">Fusionar las dos<small>Puede duplicar cosas si los dos partieron de la plantilla. Úsalo con cuidado.</small></button>'+
    '<div class="row"><button class="btn ghost" data-act="cerrar">Decidir luego</button></div>');
}
async function resolverPrimera(v){
  const rem=window.__remPrim;
  cerrar();
  if(v==='traer'){
    adoptar(rem);await guardar(false);syncCfg().base=rem.actualizado;
    await guardar(false);render();toast('Traído todo de la hoja');
  }else if(v==='subir'){
    fijarMapa();sucio=true;await syncSubir();render();toast('Subido lo de este dispositivo');
  }else{
    const {conf}=fusionarPersonal(rem);
    if(conf.length){conflictosPend=conf;mConflictos();return;}
    await guardar(false);await syncSubir();render();toast('Fusionado');
  }
}

async function sincronizar(manual){
  const s=syncCfg();
  if(!s.activo||!s.url){syncEstado='off';pintarEstado();return;}
  if(syncOcupado)return;
  syncOcupado=true;syncEstado='sync';pintarEstado();
  try{
    const j=await syncLlamar('leer');
    const rem=j.payload;
    if(!rem||!rem.datos){await syncSubir();if(manual)toast('Hoja inicializada con tus datos');}
    else if(rem.actualizado===s.base){
      if(sucio)await syncSubir();
      else{syncEstado='ok';syncUltima=horaCorta(rem.actualizado);if(!syncCfg().mapa)fijarMapa();}
    }
    else if(primeraSincro()&&instalacionVirgen()){
      // dispositivo recién instalado: se trae todo tal cual, sin mezclar con la plantilla
      adoptar(rem);
      syncCfg().base=rem.actualizado;
      await guardar(false);render();
      registrarOperacion('primera sincronización','adoptado de '+(rem.dispositivo||'la hoja'),0,true);
      if(manual)toast('Traído todo de la hoja');
    }
    else if(primeraSincro()){
      syncOcupado=false;syncEstado='pend';pintarEstado();mPrimeraVez(rem);return;
    }
    else{
      const {conf,res}=fusionarPersonal(rem);
      if(conf.length){
        conflictosPend=conf;syncOcupado=false;syncEstado='pend';pintarEstado();mConflictos();return;
      }
      await guardar(false);
      await syncSubir();
      render();
      if(manual){
        const n=res.cambios+res.nuevos+res.sesiones+res.semanas;
        toast(n?('Fusionado: '+n+' cambio(s) de '+(rem.dispositivo||'la otra copia')):'Todo al día');
      }
    }
  }catch(err){
    syncEstado='error';console.warn('sync',err);
    registrarOperacion('sincronizar','abortada: '+err.message,0,false);
    if(manual)toast('No he podido conectar: '+err.message);
  }
  syncOcupado=false;pintarEstado();
  try{await sincronizarCompartidos(false);}catch(e){}
  try{await subirArchivo();}catch(e){}
}

function mConflicto(rem){
  window.__rem=rem;
  const s=syncCfg();
  let h='<h3>Hay cambios en los dos sitios</h3>'+
    '<div class="mst">Has tocado cosas en este dispositivo y en la hoja hay una versión más nueva de '+
    esc(rem.dispositivo||'otro dispositivo')+' ('+esp(rem.actualizado.slice(0,10))+' a las '+horaCorta(rem.actualizado)+'). Elige con cuál te quedas.</div>';
  h+='<button class="mopt" data-act="conf-local">Quedarme con lo de este '+esc(s.dispositivo.toLowerCase())+
     '<small>Se sube y sustituye lo de la hoja</small></button>';
  h+='<button class="mopt" data-act="conf-remoto">Traer lo de la hoja<small>Se descarta lo que has cambiado aquí sin subir</small></button>';
  h+='<button class="mopt" data-act="export">Descargar antes una copia de lo de aquí<small>Se guarda el JSON y luego decides</small></button>';
  h+='<div class="row"><button class="btn ghost" data-act="cerrar">Ahora no</button></div>';
  modal(h);
}

/* ============================================================
   LATIDO: vigilancia periódica de coste mínimo
   Cada 5 minutos: si hay algo sin subir, lo sube. Si no, pregunta
   solo la fecha del último guardado, que son 64 bytes, y únicamente
   descarga el paquete completo si de verdad ha cambiado algo.
   ============================================================ */
const LATIDO_MIN=5;
var latido=null, latidoUltimo=null;

function arrancarLatido(){
  clearInterval(latido);
  if(!syncCfg().activo)return;
  latido=setInterval(()=>{pulso();},LATIDO_MIN*60000);
}
async function pulso(){
  const s=syncCfg();
  if(!s.activo||!s.url)return;
  if(syncOcupado)return;
  if(typeof document!=='undefined'&&document.hidden)return;   // en segundo plano no molestamos
  try{
    if(sucio){await sincronizar(false);latidoUltimo=AHORA();return;}
    const j=await syncLlamar('sello');
    latidoUltimo=AHORA();
    if(j.actualizado&&j.actualizado!==s.base)await sincronizar(false);
  }catch(e){
    // script antiguo sin la acción «sello», o sin red: se cae al camino largo
    if(/desconocida/.test(e.message||''))await sincronizar(false);
  }
}

/* ---------- al cerrar: lo pendiente se manda aunque se cierre la pestaña ---------- */
function despedida(){
  const s=syncCfg();
  if(!sucio||!s.activo||!s.url)return;
  try{
    const cuerpo=JSON.stringify({clave:s.clave,accion:'guardar',payload:paquete()});
    if(navigator.sendBeacon){
      const b=new Blob([cuerpo],{type:'text/plain;charset=utf-8'});
      const ok=navigator.sendBeacon(s.url,b);
      registrarOperacion('guardar al cerrar',ok?'enviado':'el navegador lo ha rechazado',cuerpo.length,ok);
    }
  }catch(e){}
}
/* ============================================================
   ARRASTRAR BLOQUES POR LA CUADRÍCULA
   Ratón: se arrastra al mover. Táctil: mantener pulsado y arrastrar.
   ============================================================ */
var drag=null, ultimoDrag=0;

function limitesDia(){return [toMin(D.config.diaInicio||'08:00'),toMin(D.config.diaFin||'23:00')];}
function celdaEn(x,y){
  const e=document.elementFromPoint(x,y);
  return (e&&e.classList&&e.classList.contains('cell')&&e.dataset.m!==undefined)?e:null;
}
function pintaDestino(c){
  document.querySelectorAll('.cell.destino').forEach(x=>x.classList.remove('destino'));
  if(c)c.classList.add('destino');
}
/* Reparte la duración a partir de una hora, saltando las pausas (comida,
   arranque, cena) y partiendo el bloque en dos si hace falta. Avisa si algún
   tramo cae en tiempo protegido o encima de un evento de tu calendario. */
function segmentosPara(fecha,ini,dur){
  const d=diaSemana(fecha), [INI,FIN]=limitesDia();
  const segs=[];let restan=dur,cur=Math.max(ini,INI),prot=false,ext=false,guard=0;
  while(restan>0&&cur<FIN&&guard++<80){
    if(estadoCelda(d,cur,fecha)==='bloq'){cur+=30;continue;}    // pausa: se salta
    let t=0;
    while(restan>0&&cur<FIN&&estadoCelda(d,cur,fecha)!=='bloq'){
      if(estadoCelda(d,cur,fecha)==='prot')prot=true;
      if(typeof chocaExterno==='function'&&chocaExterno(fecha,cur,cur+30))ext=true;
      cur+=30;t+=30;restan-=30;
    }
    if(t>0)segs.push({ini:cur-t,fin:cur});
  }
  return {segs,prot,ext,incompleto:restan>0,partido:segs.length>1};
}
function nombreProtegida(fecha,segs){
  const d=diaSemana(fecha);
  for(const s of segs)for(let m=s.ini;m<s.fin;m+=30){
    const r=reglasDe(d,fecha).find(x=>x.tipo==='protegido'&&toMin(x.ini)<=m&&toMin(x.fin)>m);
    if(r)return r.nombre;
  }
  return 'tiempo protegido';
}
function iniciarDrag(){
  if(!drag||drag.activo)return;
  drag.activo=true;
  const r=drag.el.getBoundingClientRect();
  const filas=Math.max(1,Math.round((drag.b.fin-drag.b.ini)/30));
  drag.offset=Math.min(drag.b.fin-drag.b.ini-30,Math.max(0,Math.floor((drag.y0-r.top)/(r.height/filas))*30));
  drag.el.classList.add('arrastrando');
  drag.el.style.pointerEvents='none';
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}
function terminarDrag(commit){
  if(!drag)return;
  clearTimeout(drag.t);
  pintaDestino(null);
  if(drag.activo){
    drag.el.classList.remove('arrastrando');
    drag.el.style.pointerEvents='';
    ultimoDrag=Date.now();
    if(commit&&drag.prev){
      const b=drag.b,plan=drag.plan,dur=b.fin-b.ini;
      const fecha=addDays(plan.lunes,drag.prev.dia);
      const destino=drag.prev.min;
      if(fecha!==b.fecha&&esPasado(fecha)){
        drag=null;toast('No se pueden mover actividades a días pasados');render();return;}
      if(fecha!==b.fecha||destino!==b.ini){
        const r=segmentosPara(fecha,destino,dur);
        drag=null;
        if(r.incompleto||!r.segs.length){
          toast('No cabe entero en lo que queda de ese día');render();return;
        }
        if(r.prot||r.ext){
          window.__mov={b,plan,fecha,r};
          mConfirmarMover();return;
        }
        aplicarMovimiento(b,plan,fecha,r);
        return;
      }
    }
    render();
  }
  drag=null;
}

document.addEventListener('pointerdown',e=>{
  if(vista!=='semana')return;
  const el=e.target.closest('.blk');if(!el)return;
  const plan=planActual();if(!plan)return;
  const b=plan.bloques.find(x=>x.id===el.dataset.id);if(!b||b.estado==='anulado')return;
  drag={el,b,plan,x0:e.clientX,y0:e.clientY,activo:false,tactil:e.pointerType!=='mouse',t:null,prev:null};
  if(drag.tactil)drag.t=setTimeout(iniciarDrag,240);
},{passive:true});

document.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.activo){
    const d=Math.abs(e.clientX-drag.x0)+Math.abs(e.clientY-drag.y0);
    if(drag.tactil){if(d>12){clearTimeout(drag.t);drag=null;}return;}
    if(d>4)iniciarDrag();else return;
  }
  const c=celdaEn(e.clientX,e.clientY);
  if(!c)return;
  const [INI,FIN]=limitesDia(),dur=drag.b.fin-drag.b.ini;
  let m=Number(c.dataset.m)-drag.offset;
  m=Math.max(INI,Math.min(m,FIN-dur));
  const dia=Number(c.dataset.d);
  drag.prev={dia,min:m};
  drag.el.style.gridColumn=(dia+2);
  drag.el.style.gridRow=(2+(m-INI)/30)+' / span '+Math.max(1,Math.round(dur/30));
  const f=addDays(drag.plan.lunes,dia);
  const r=segmentosPara(f,m,dur);
  drag.el.classList.toggle('nodrop',!!(r.incompleto||r.prot||r.ext));
  drag.el.classList.toggle('parte',!!r.partido&&!r.prot&&!r.ext&&!r.incompleto);
  pintaDestino(c);
},{passive:true});

document.addEventListener('pointerup',()=>terminarDrag(true));
document.addEventListener('pointercancel',()=>terminarDrag(false));
document.addEventListener('touchmove',e=>{if((drag&&drag.activo)||(typeof arr!=='undefined'&&arr&&arr.activo))e.preventDefault();},{passive:false});

/* ---------- aplicar el movimiento, partiendo el bloque si toca ---------- */
function aplicarMovimiento(b,plan,fecha,r,tipo){
  const antes=copia(b);
  const sesAntes=SES.filter(s=>s.bloqueId===b.id).map(copia);
  const extras=[];
  b.fecha=fecha;b.ini=r.segs[0].ini;b.fin=r.segs[0].fin;
  b.motivo=(tipo==='ajustar'?'Horas ajustadas a mano el ':'Movido a mano el ')+esp(hoyISO())+'.'+
    (r.partido?' Partido por la pausa del mediodía.':'');
  sello(b);
  r.segs.slice(1).forEach(s=>{
    const c=copia(b);
    c.id=uid('b');c.ini=s.ini;c.fin=s.fin;
    c.motivo='Continuación de «'+b.nombre+'» tras la pausa.';
    c.actualizado=AHORA();
    plan.bloques.push(c);extras.push(c);
  });
  const totalH=r.segs.reduce((a,s)=>a+(s.fin-s.ini),0)/60;
  const dif=ajustarSesiones(b,totalH);
  recalcularSemana(plan);
  guardarPronto();render();
  const cuota=estadoCelda(diaSemana(fecha),b.ini,fecha)==='cuota';
  toast(tipo==='ajustar'
        ? (hhmm(b.ini)+'–'+hhmm(r.segs[r.segs.length-1].fin)+' · '+fmtH(totalH)+
           (dif?' · horas registradas '+(dif>0?'+':'')+fmtH(dif):''))
        : r.partido?'Movido y partido en '+r.segs.length+' tramos por la pausa'
        :(cuota?'Movido al fin de semana: sale del tiempo de familia'
               :'Movido a '+DIAS3[diaSemana(fecha)]+' '+hhmm(b.ini)));
  registrarAccion(tipo==='ajustar'?'Horas ajustadas'
      :(r.partido?'Movido y partido':'Movido a '+DIAS3[diaSemana(fecha)]+' '+hhmm(b.ini)),()=>{
    restaurar(b,antes);
    plan.bloques=plan.bloques.filter(x=>!extras.some(e=>e.id===x.id));
    SES=SES.filter(s=>s.bloqueId!==b.id).concat(sesAntes);
    recalcularSemana(plan);
  });
}
function mConfirmarMover(){
  const {b,fecha,r}=window.__mov;
  const donde=r.prot?nombreProtegida(fecha,r.segs):'un evento de tu calendario';
  let h='<h3>Eso ocupa '+esc(donde.toLowerCase())+'</h3>'+
    '<div class="mst">«'+esc(b.nombre)+'» quedaría el '+DIAS[diaSemana(fecha)].toLowerCase()+' '+esp(fecha)+
    ' en '+r.segs.map(s=>hhmm(s.ini)+'–'+hhmm(s.fin)).join(' y ')+
    (r.partido?', partido por la pausa del mediodía.':'.')+'</div>';
  if(r.prot)h+='<div class="badbox" style="margin-bottom:12px">Es tiempo que tenías reservado para otra cosa. Puedes hacerlo, pero que sea porque lo decides.</div>';
  if(r.ext)h+='<div class="warnbox" style="margin-bottom:12px">Se solapa con un evento de tu calendario de Google.</div>';

     '<button class="btn ghost" data-act="mov-no">Déjalo donde estaba</button></div>';

}

/* ============================================================

   Como en Outlook. Si el bloque estaba marcado como hecho, las
   horas registradas se corrigen solas: es lo que alimenta el análisis.

function bloquePorId(id){

document.addEventListener('pointermove',e=>{

  const c=celdaEn(e.clientX,e.clientY);
  if(!c)return;
  const m=Number(c.dataset.m);
  const [INI,FIN]=limitesDia();
  const b=rz.b;
  if(rz.lado==='ini'){
    const nuevo=Math.max(INI,Math.min(m,b.fin-30));
    if(nuevo!==b.ini){b.ini=nuevo;rz.movido=true;pintaAjuste();}
  }else{
    const nuevo=Math.min(FIN,Math.max(m+30,b.ini+30));
    if(nuevo!==b.fin){b.fin=nuevo;rz.movido=true;pintaAjuste();}
  }
},{passive:true});

function pintaAjuste(){
  if(!rz||!rz.el)return;
  const [INI]=limitesDia(), fila=D.config.zoomSemana||32;
  const b=rz.b;
  rz.el.style.gridRow=(2+Math.round((b.ini-INI)/30))+' / span '+Math.max(1,Math.round((b.fin-b.ini)/30));
  const et=rz.el.querySelector?rz.el.querySelector('b'):null;
  if(et&&!rz.etOrig)rz.etOrig=et.innerHTML;
  if(et)et.innerHTML=hhmm(b.ini)+'–'+hhmm(b.fin)+' · '+fmtH((b.fin-b.ini)/60);

document.addEventListener('pointerup',()=>terminarAjuste(true));
document.addEventListener('pointercancel',()=>terminarAjuste(false));

function terminarAjuste(commit){
  if(!rz)return;
  const {b,plan,ini0,fin0,movido}=rz;
  if(rz.el)rz.el.classList.remove('ajustando');
  rz=null;
  if(!movido){render();return;}
  ultimoDrag=Date.now();
  const ini=b.ini, fin=b.fin;
  b.ini=ini0;b.fin=fin0;                      // se deshace y se aplica por el camino común
  if(!commit){render();return;}
  const r=segmentosPara(b.fecha,ini,fin-ini);
  if(r.incompleto||!r.segs.length){toast('No cabe ahí');render();return;}
  if(r.prot||r.ext){window.__mov={b,plan,fecha:b.fecha,r,tipo:'ajustar'};mConfirmarMover();return;}
  aplicarMovimiento(b,plan,b.fecha,r,'ajustar');
}

/* las horas registradas siguen al bloque */
function ajustarSesiones(b,horas){
  if(b.estado!=='hecho')return 0;
  const ss=SES.filter(s=>s.bloqueId===b.id);
  if(!ss.length)return 0;
  const antes=ss.reduce((a,s)=>a+s.horas,0);
  ss.forEach((s,i)=>{s.horas=i===0?horas:0;});
  SES=SES.filter(s=>s.horas>0||s.tipo==='ejercicio');
  return Math.round((horas-antes)*100)/100;
}

function evDe(b){

function leerEv(){

function guardarEvento(){
  const e=leerEv();
  const plan=SEM[semanaId(lunesDe(e.fecha))];
  if(!plan){toast('Esa semana no está planificada todavía');return;}
  const [INI,FIN]=limitesDia();
  if(e.ini<INI||e.ini+e.dur>FIN){toast('Se sale del horario visible de la cuadrícula');return;}
  const previo=e.id?plan.bloques.find(b=>b.id===e.id):null;
  if(esPasado(e.fecha)&&(!previo||previo.fecha!==e.fecha)){
    toast('No se pueden colocar actividades en días pasados');return;}

  let tareaId=e.tareaId,nombre=e.nombre.trim(),hitoNombre=null;
  const p=P(e.proyecto),hi=p?p.hitos.find(x=>x.id===e.hitoId):null;
  if(hi)hitoNombre=hi.nombre;

  if(tareaId==='__nueva'){
    if(!nombre){toast('Ponle nombre a la subtarea');return;}
    if(!hi){toast('Elige antes la actividad principal');return;}
    tareaId=uid('T');
    hi.tareas.push({id:tareaId,nombre,horas:Number(e.horasNueva)||e.dur/60,contexto:'escritorio',
      estado:'pendiente',critica:false,bloqueante:false,desplaza:false,etiquetas:['escritorio']});
  }else if(tareaId){
    const t=hi?hi.tareas.find(x=>x.id===tareaId):null;
    nombre=t?t.nombre:nombre;
  }else if(!nombre){toast('Ponle nombre al bloque');return;}

  const viejo=previo;
  const b=viejo||{id:uid('b'),tipo:'trabajo',estado:'planificado'};
  const antesTodo=viejo?JSON.parse(JSON.stringify(viejo)):null;
  const antes=viejo?{fecha:viejo.fecha,ini:viejo.ini}:null;
  b.fecha=e.fecha;b.ini=e.ini;b.fin=e.ini+e.dur;
  b.proyecto=e.proyecto;b.tareaId=tareaId||null;b.hito=hitoNombre;
  b.nombre=nombre;b.nota=e.nota.trim()||null;
  b.motivo=(viejo?'Editado':'Creado')+' a mano el '+esp(hoyISO())+'.';
  sello(b);sello(plan);
  if(!viejo){b.origen='manual';plan.bloques.push(b);}
  if(viejo&&viejo.estado==='hecho'&&antes&&(antes.fecha!==b.fecha)){
    SES.filter(s=>s.bloqueId===b.id).forEach(s=>{s.fecha=b.fecha;s.tareaId=b.tareaId;s.proyecto=b.proyecto;});
  }
  plan.porProyecto=plan.porProyecto||{};
  recalcularSemana(plan);
  cerrar();guardarPronto();render();
  if(viejo)registrarAccion('Bloque editado',()=>{restaurar(b,antesTodo);recalcularSemana(plan);});
  else registrarAccion('Bloque creado',()=>{plan.bloques=plan.bloques.filter(x=>x.id!==b.id);recalcularSemana(plan);});
}
function recalcularSemana(plan){
  const pp={};let u=0,ex=0;
  plan.bloques.forEach(b=>{
    if(b.estado==='anulado')return;
    const hs=(b.fin-b.ini)/60;
    if(b.tipo==='trabajo'){
      pp[b.proyecto]=(pp[b.proyecto]||0)+hs;
      const c=clasificaProtegido(b);
      if(c==='cuota'||c==='excepcional')ex+=hs;else u+=hs;
    }
    else if(b.tipo==='reservado'&&P(b.proyecto))pp[b.proyecto]=(pp[b.proyecto]||0)+hs;
  });
  plan.porProyecto=pp;plan.usadas=u;plan.extra=ex;
}
function borrarEvento(){
  const e=window.__ev,plan=SEM[semanaId(lunesDe(e.fecha))];
  const b=plan.bloques.find(x=>x.id===e.id);
  if(!b)return;
  if(b.estado==='hecho'){toast('Está marcado como hecho: deshazlo antes de borrarlo');return;}
  const guardado=JSON.parse(JSON.stringify(b));
  anotarBorrado(b.id);
  plan.bloques=plan.bloques.filter(x=>x.id!==e.id);
  recalcularSemana(plan);
  cerrar();guardarPronto();render();
  registrarAccion('Bloque eliminado',()=>{plan.bloques.push(guardado);recalcularSemana(plan);
    D.borrados=borrados().filter(x=>x.id!==guardado.id);});
}
/* notas de la semana, para la vista general */
function notasSemana(lunes){
  const plan=SEM[semanaId(lunes)];if(!plan)return [];
  return plan.bloques.filter(b=>b.nota&&b.estado!=='anulado')
    .sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.ini-b.ini);
}

/* ============================================================
   ORDEN DE PRIORIDADES ANTES DE PLANIFICAR
   El motor propone; tú reordenas, quitas y decides dónde cae el corte.
   ============================================================ */
var jorTmp=[], jorHoras={};
function abrirCola(lunes,cap,off,jornadas){
  const pv=SEM[semanaId(lunes)];
  const cub={};
  if(pv)(pv.bloques||[]).forEach(b=>{
    if(b.tipo==='trabajo'&&b.tareaId&&b.estado!=='hecho'&&(b.origen==='manual'))
      cub[b.tareaId]=(cub[b.tareaId]||0)+(b.fin-b.ini)/60;
  });
  const {cola,notas}=construirCola(lunes,cap,cub);
  const jor=(jornadas||[]).filter(j=>!off.includes(j.fecha));
  window.__prio={lunes,cap,off,cola,notas,jor,jorOff:false};
  mCola();
}
function etiquetaRazon(it){
  if(it.prio===1)return 'Mínimo innegociable';
  if(it.prio===2)return it.bloqueante?'Bloquea otras tareas':'Crítica';
  if(it.prio===3)return it.razon;
  if(it.prio===4)return it.razon;
  return 'Reparto ordinario';
}
function mCola(){
  const S=window.__prio;
  const util=S.cap*(1-D.config.margenPct/100);
  const jorFinde=S.jorOff?0:S.jor.filter(j=>esFinde(j.fecha)).length;
  const jorSemana=S.jorOff?0:S.jor.filter(j=>!esFinde(j.fecha)).length;
  const hDe=j=>(j.horas!==undefined&&j.horas!==null)?j.horas:horasObraDia(j.fecha);
  const jorH=S.jorOff?0:S.jor.filter(j=>esFinde(j.fecha)).reduce((a,j)=>a+hDe(j),0);        // lo que va aparte
  const jorDentro=S.jorOff?0:S.jor.filter(j=>!esFinde(j.fecha)).reduce((a,j)=>a+hDe(j),0);  // lo que sí resta
  let h='<h3>Orden de prioridades</h3>'+
    '<div class="mst">'+espCorto(S.lunes)+' – '+espCorto(addDays(S.lunes,6))+' · '+fmtH(S.cap)+
    ' declaradas, '+fmtH(util)+' repartibles tras el margen. Cambia el orden si esta semana tus prioridades son otras.</div>';

  if(S.jor.length){
    const findes=S.jor.filter(j=>esFinde(j.fecha)).length;
    h+='<div class="colarow'+(S.jorOff?' off':'')+'" style="--pc:'+colorDe('CASA')+'">'+
       '<span class="n">•</span><span><b>'+S.jor.length+' jornada'+(S.jor.length===1?'':'s')+' de obra</b>'+
       '<span class="q">'+S.jor.map(j=>DIAS3[diaSemana(j.fecha)]+' '+espCorto(j.fecha)).join(', ')+
       ' · '+(findes?findes+' de fin de semana, con cargo a la cuota':'')+
       (findes&&findes<S.jor.length?' y ':'')+
       (findes<S.jor.length?(S.jor.length-findes)+' entre semana':'')+
       ' · <b style="color:var(--ok)">esfuerzo aparte, no gasta tu capacidad</b></span></span>'+
       '<span class="colabtns"><span class="h">'+fmtH(jorH+jorDentro)+'</span>'+
       '<button data-act="jor-off" title="Quitar">'+(S.jorOff?'+':'×')+'</button></span></div>';
  }

  let acum=0,cortado=false,dentro=0,fuera=0;   // la obra va siempre aparte, no gasta capacidad
  S.cola.forEach((it,i)=>{
    const p=P(it.proyecto);
    let parcial=null;
    if(!it.__off&&!it.desplaza){
      const hueco=Math.max(0,util-acum);
      if(!cortado&&hueco<it.pend-0.01)parcial=Math.round(hueco*10)/10;
      dentro+=Math.min(it.pend,hueco);
      fuera+=Math.max(0,it.pend-hueco);
      acum+=it.pend;
    }
    h+='<div class="colarow'+(it.__off?' off':'')+(cortado?' fuera':'')+'" style="--pc:'+colorDe(it.proyecto)+'">'+
      '<span class="n">'+(i+1)+'</span>'+
      '<span><b>'+esc(it.nombre)+'</b>'+
      '<span class="q">'+posEnProyectos(it)+esc((p?p.nombre:it.proyecto)+(it.hitoNombre?' › '+it.hitoNombre:''))+' · '+esc(etiquetaRazon(it))+
      (it.desplaza?' · <b style="color:var(--warn)">solo en jornada de obra</b>':'')+'</span></span>'+
      '<span class="colabtns"><span class="h">'+fmtH(it.pend)+'</span>'+
      '<button data-act="cola-up" data-i="'+i+'" title="Subir">↑</button>'+
      '<button data-act="cola-down" data-i="'+i+'" title="Bajar">↓</button>'+
      '<button data-act="cola-off" data-i="'+i+'" title="Quitar de esta semana">'+(it.__off?'+':'×')+'</button></span></div>';
    if(parcial!==null&&!cortado){
      h+='<div class="corte">'+(parcial>=0.5
        ? 'de esta entran '+fmtH(parcial)+', el resto queda fuera'
        : 'hasta aquí llega la capacidad')+'</div>';
      cortado=true;
    }
  });
  if(!cortado&&S.cola.length)h+='<div class="corte">entra todo, sobran '+fmtH(Math.max(0,util-acum))+'</div>';
  if(!S.cola.length)h+='<p class="tiny muted" style="padding:12px 0">No hay nada pendiente que repartir.</p>';

  h+='<div class="row" style="margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-top:10px">'+
     '<button class="btn primary" data-act="cola-ok">Generar el plan</button>'+
     '<button class="btn ghost" data-act="cola-back">Volver</button>'+
     '<span class="spacer"></span><span class="tiny muted">Entran '+fmtH(dentro)+
     ((jorH+jorDentro)?' + '+fmtH(jorH+jorDentro)+' de obra':'')+(fuera>0.05?' · fuera '+fmtH(fuera):'')+'</span></div>';
  modal(h);
}

/* posición exacta que ocupa en la vista Proyectos, para poder comprobarlo */
function posEnProyectos(it){
  const o=ordenManual(it);
  if(o>=9e8)return '';
  const ip=Math.floor(o/1e6), ih=Math.floor((o%1e6)/1000), itx=o%1000;
  return '<span class="pos">'+(ip+1)+'.'+(ih+1)+'.'+(itx+1)+'</span> ';
}
/* ============================================================
   LISTAS ORDENABLES ARRASTRANDO (proyectos, hitos y subtareas)
   Mismo gesto que en la cuadrícula: ratón directo, táctil manteniendo pulsado.
   ============================================================ */
var arr=null;

function hermanos(el){
  return Array.from(el.parentElement.children).filter(x=>x.dataset&&x.dataset.sort===el.dataset.sort);
}
function aplicarOrden(el){
  const tipo=el.dataset.sort;
  const ids=hermanos(el).map(x=>x.dataset.id);
  if(tipo==='proyecto'){
    const m={};D.proyectos.forEach(p=>m[p.id]=p);
    const orden=ids.map(i=>m[i]).filter(Boolean);
    D.proyectos.forEach(p=>{if(!ids.includes(p.id))orden.push(p);});
    D.proyectos=orden;
  }else if(tipo==='hito'){
    const p=P(el.dataset.p);if(!p)return;
    const m={};p.hitos.forEach(x=>m[x.id]=x);
    p.hitos=ids.map(i=>m[i]).filter(Boolean).concat(p.hitos.filter(x=>!ids.includes(x.id)));
    p.hitos.forEach((x,i)=>{if(x.orden!==i){x.orden=i;tocar(x);}});
  }else if(tipo==='tarea'){
    const p=P(el.dataset.p);if(!p)return;
    const hi=p.hitos.find(x=>x.id===el.dataset.h);if(!hi)return;
    const m={};hi.tareas.forEach(x=>m[x.id]=x);
    hi.tareas=ids.map(i=>m[i]).filter(Boolean).concat(hi.tareas.filter(x=>!ids.includes(x.id)));
    hi.tareas.forEach((x,i)=>{if(x.orden!==i){x.orden=i;tocar(x);}});
  }
}
function iniciarArr(){
  if(!arr||arr.activo)return;
  arr.activo=true;
  arr.el.classList.add('movida');
  arr.el.style.pointerEvents='none';
  document.body.classList.add('ordenando');
  if(navigator.vibrate)try{navigator.vibrate(12);}catch(e){}
}
function finArr(commit){
  if(!arr)return;
  clearTimeout(arr.t);
  if(arr.activo){
    arr.el.classList.remove('movida');
    arr.el.style.pointerEvents='';
    document.body.classList.remove('ordenando');
    ultimoDrag=Date.now();
    if(commit&&arr.movido){
      aplicarOrden(arr.el);
      guardarPronto();render();
      toast({proyecto:'Orden de proyectos guardado',hito:'Orden de hitos guardado',tarea:'Orden de subtareas guardado'}[arr.el.dataset.sort]);
    }
  }
  arr=null;
}

document.addEventListener('pointerdown',e=>{
  if(vista!=='proyectos')return;
  if(e.target.closest('button')||e.target.closest('input'))return;
  const asa=e.target.closest('.asa');
  const el=e.target.closest('[data-sort]');
  if(!el)return;
  const tactil=e.pointerType!=='mouse';
  if(!asa&&!tactil)return;               // con ratón, solo desde el asa
  arr={el,x0:e.clientX,y0:e.clientY,activo:false,tactil,movido:false,t:null};
  if(tactil)arr.t=setTimeout(iniciarArr,260);
},{passive:true});

document.addEventListener('pointermove',e=>{
  if(!arr)return;
  if(!arr.activo){
    const d=Math.abs(e.clientX-arr.x0)+Math.abs(e.clientY-arr.y0);
    if(arr.tactil){if(d>12){clearTimeout(arr.t);arr=null;}return;}
    if(d>4)iniciarArr();else return;
  }
  const bajo=document.elementFromPoint(e.clientX,e.clientY);
  if(!bajo||!bajo.closest)return;
  const t=bajo.closest('[data-sort="'+arr.el.dataset.sort+'"]');
  if(!t||t===arr.el||t.parentElement!==arr.el.parentElement)return;
  const r=t.getBoundingClientRect();
  const antes=e.clientY<r.top+r.height/2;
  t.parentElement.insertBefore(arr.el,antes?t:t.nextSibling);
  arr.movido=true;
},{passive:true});

document.addEventListener('pointerup',()=>finArr(true));
document.addEventListener('pointercancel',()=>finArr(false));
/* ============================================================
   ANÁLISIS — objetivo contra realidad, semana a semana y mes a mes
   ============================================================ */
var anaModo='semana', anaN=12;

function primerDiaMes(s){return s.slice(0,7)+'-01';}
function ultimoDiaMes(s){const d=parse(primerDiaMes(s));d.setMonth(d.getMonth()+1);d.setDate(0);return iso(d);}
function periodos(){
  const out=[];
  if(anaModo==='semana'){
    let l=lunesDe(hoyISO());
    for(let i=0;i<anaN;i++){out.unshift({id:semanaId(l),etq:espCorto(l),desde:l,hasta:addDays(l,6)});l=addDays(l,-7);}
  }else{
    const d=parse(hoyISO());
    for(let i=0;i<anaN;i++){
      const m=new Date(d.getFullYear(),d.getMonth()-i,1);
      const s=iso(m);
      out.unshift({id:s.slice(0,7),etq:MESES[m.getMonth()].slice(0,3)+' '+String(m.getFullYear()).slice(2),
        desde:primerDiaMes(s),hasta:ultimoDiaMes(s)});
    }
  }
  return out;
}
function realEn(desde,hasta){
  const r={};
  SES.forEach(s=>{if(s.fecha>=desde&&s.fecha<=hasta)r[s.proyecto]=(r[s.proyecto]||0)+s.horas;});
  return r;
}
function previstoEn(desde,hasta){
  const r={};
  Object.values(todasSemanas()).forEach(w=>{
    if(w.lunes<desde||w.lunes>hasta)return;
    Object.keys(w.porProyecto||{}).forEach(k=>r[k]=(r[k]||0)+w.porProyecto[k]);
  });
  return r;
}
function conReparto(){return D.proyectos.filter(p=>(p.pct||0)>0);}
function objetivoPct(pid){
  const act=conReparto().filter(p=>p.activo);
  const tot=act.reduce((a,p)=>a+(p.pct||0),0)||1;
  const p=P(pid);
  return p&&p.activo?100*(p.pct||0)/tot:null;
}
function sumaObj(o){return Object.values(o).reduce((a,b)=>a+b,0);}

/* ---------- gráfico de barras apiladas ---------- */
function barras(per,datos,previstos){
  const W=720,H=210,L=34,B=26,T=8;
  const max=Math.max(1,...per.map(p=>sumaObj(datos[p.id]||{})),...per.map(p=>sumaObj(previstos[p.id]||{})));
  const paso=(W-L)/per.length, ancho=Math.min(38,paso*0.56);
  const y=v=>T+(H-T-B)*(1-v/max);
  let g='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto" role="img">';
  for(let i=0;i<=4;i++){
    const v=max*i/4;
    g+='<line x1="'+L+'" y1="'+y(v)+'" x2="'+W+'" y2="'+y(v)+'" stroke="#2B333C" stroke-width="1"/>'+
       '<text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" fill="#5C6874" font-size="9" text-anchor="end">'+Math.round(v)+'</text>';
  }
  const saltoEtq=Math.ceil(per.length/12);
  per.forEach((p,i)=>{
    const x=L+paso*i+(paso-ancho)/2;
    let acc=0;
    D.proyectos.forEach(pr=>{
      const v=(datos[p.id]||{})[pr.id]||0;if(v<=0)return;
      const h1=(H-T-B)*v/max;
      g+='<rect x="'+x+'" y="'+(y(acc)-h1)+'" width="'+ancho+'" height="'+h1+'" fill="'+pr.color+'" rx="2">'+
         '<title>'+esc(p.etq+' · '+pr.nombre+' · '+fmtH(v))+'</title></rect>';
      acc+=v;
    });
    const prev=sumaObj(previstos[p.id]||{});
    if(prev>0)g+='<line x1="'+(x-3)+'" y1="'+y(prev)+'" x2="'+(x+ancho+3)+'" y2="'+y(prev)+'" stroke="#8B98A5" stroke-width="1.5" stroke-dasharray="3 2"><title>'+esc('Previsto '+fmtH(prev))+'</title></line>';
    if((per.length-1-i)%saltoEtq===0)
      g+='<text x="'+(x+ancho/2)+'" y="'+(H-9)+'" fill="#8B98A5" font-size="9" text-anchor="middle">'+esc(p.etq)+'</text>';
  });
  g+='</svg>';
  return g;
}

function vAnalisis(){
  const per=periodos();
  const datos={},previstos={};
  per.forEach(p=>{datos[p.id]=realEn(p.desde,p.hasta);previstos[p.id]=previstoEn(p.desde,p.hasta);});
  const desde=per[0].desde,hasta=per[per.length-1].hasta;
  const real=realEn(desde,hasta),prev=previstoEn(desde,hasta);

    '<p class="sub">'+espCorto(desde)+' – '+espCorto(hasta)+' · lo que dijiste que ibas a dedicar frente a lo que dedicaste.</p>';

  // objetivo contra realidad
  h+='<div class="card" style="margin-bottom:12px"><b style="font-size:14px">Objetivo contra realidad</b>'+
     '<p class="tiny muted" style="margin:3px 0 10px">Sobre todas las horas registradas en proyectos. Los bloques personales quedan fuera.</p>';
  conReparto().forEach(p=>{
    const obj=objetivoPct(p.id)||0;
    const rl=repRealTot?100*(real[p.id]||0)/repRealTot:0;
    const dif=rl-obj;
    const col=Math.abs(dif)<=7?'var(--ok)':Math.abs(dif)<=15?'var(--warn)':'var(--bad)';
    const veredicto=Math.abs(dif)<=7?'en línea':dif<0?'por debajo':'por encima';
    h+='<div class="objrow"><span class="on"><span class="dot" style="background:'+p.color+'"></span>'+esc(p.nombre)+'</span>'+
      '<span class="ob"><span class="track"><i style="width:'+Math.min(100,obj)+'%;background:var(--line2)"></i></span>'+
      '<span class="track" style="margin-top:3px"><i style="width:'+Math.min(100,rl)+'%;background:'+p.color+'"></i></span></span>'+
      '<span class="oc"><b>'+Math.round(rl)+' %</b><i>de '+Math.round(obj)+' % previsto</i></span>'+
      '<span class="od" style="color:'+col+'">'+(dif>=0?'+':'')+Math.round(dif)+' pts<br><span class="tiny">'+veredicto+'</span></span></div>';
  });
  const sinObj=D.proyectos.filter(p=>!(p.pct>0)&&(real[p.id]||0)>0);
  if(sinObj.length)h+='<p class="tiny muted" style="margin-top:10px">Sin porcentaje asignado: '+
    sinObj.map(p=>esc(p.nombre)+' '+fmtH(real[p.id])).join(' · ')+'. Ponles uno en Proyectos para poder compararlos.</p>';
  h+='</div>';

  // desglose por hito y subtarea
  const porTarea={};
  SES.forEach(s=>{if(s.fecha<desde||s.fecha>hasta)return;

  const filas=[];

      if(t.id===k){pid=p.id;hn=hh.nombre;tn=t.nombre;rec=!!t.rec;est=t.rec?null:t.horas;}})));
    if(!pid)return;

  filas.sort((a,b)=>b.h-a.h);
  h+='<div class="card"><b style="font-size:14px">En qué se fueron las horas</b>'+
     '<div style="overflow-x:auto;margin-top:8px"><table class="cfg"><tr><th>Proyecto</th><th>Hito</th><th>Subtarea</th><th>Horas</th><th>Sobre estimado</th></tr>';
  if(!filas.length)h+='<tr><td colspan="5" class="tiny muted" style="padding:12px 0">Todavía no hay horas registradas en este periodo.</td></tr>';
  filas.forEach(f=>{
    const pc=f.est?Math.round(100*f.h/f.est):null;
    const col=pc==null?'var(--muted)':pc>110?'var(--bad)':pc>=90?'var(--warn)':'var(--ok)';
    h+='<tr><td><span class="dot" style="background:'+colorDe(f.pid)+'"></span>'+esc(nombreDe(f.pid))+'</td>'+
      '<td class="tiny muted">'+esc(f.hn)+'</td><td>'+esc(f.tn)+'</td><td>'+fmtH(f.h)+'</td>'+
      '<td style="color:'+col+'">'+(pc==null?(f.rec?'recurrente':'sin estimación'):pc+' % de '+fmtH(f.est))+'</td></tr>';
  });
  h+='</table></div></div>';

  h+=bloqueMeteo(per,desde,hasta);
  h+=bloqueProtegido(per);
  h+=bloqueEnergia(per);
  h+=bloqueIndicadores(per,desde,hasta);

  // ---------- reparto por persona en los proyectos compartidos ----------
  D.proyectos.filter(p=>esCompartido(p.id)).forEach(p=>{
    const gente=miembrosDe(p.id);
    const filasC=[];
    p.hitos.forEach(hh=>{
      const fila={hito:hh.nombre,tareas:[],tot:{}};

          const a=s.autor||'—';por[a]=(por[a]||0)+s.horas;

    else{

      h+='</div>';

        f.tareas.forEach(t=>{

            cols.map(g=>'<td'+(t.por[g]?'':' class="muted"')+'>'+(t.por[g]?fmtH(t.por[g]):'·')+'</td>').join('')+
            '<td>'+fmtH(tot)+'</td></tr>';
        });
        h+='<tr><td style="padding-left:14px" class="tiny muted">subtotal del hito</td><td></td>'+
          cols.map(g=>'<td class="tiny muted">'+(f.tot[g]?fmtH(f.tot[g]):'·')+'</td>').join('')+
          '<td class="tiny muted">'+fmtH(Object.values(f.tot).reduce((a,b)=>a+b,0))+'</td></tr>';
      });
      h+='</table></div>';
    }
    h+='</div>';
  });
  return h;
}
/* ============================================================
   PROYECTOS COMPARTIDOS
   Se comparte el proyecto (hitos, subtareas, estimaciones, orden y horas
   registradas). No se comparte el calendario, ni la capacidad, ni el
   porcentaje de tiempo: eso es de cada uno.
   ============================================================ */
const AHORA=()=>new Date().toISOString();
const VIEJO='2000-01-01T00:00:00.000Z';

function compartidos(){D.config.compartidos=D.config.compartidos||[];return D.config.compartidos;}
function canalDe(pid){return compartidos().find(c=>c.proyectoId===pid&&c.activo);}
function autorNombre(){return (D.config.autor||'').trim()||(D.config.sync&&D.config.sync.dispositivo)||'Yo';}
function tocar(o){o.actualizado=AHORA();return o;}
function borrados(){D.borrados=D.borrados||[];return D.borrados;}
function anotarBorrado(id){
  if(!id)return;
  const b=borrados();
  if(b.some(x=>x.id===id))return;
  b.push({id,ts:AHORA()});
  if(b.length>3000)D.borrados=b.slice(-2000);
}

/* ---------- quién trabaja en el proyecto ---------- */
function miembrosDe(pid){
  const c=compartidos().find(x=>x.proyectoId===pid);
  const set=new Set((c&&c.miembros)||[]);
  set.add(autorNombre());
  SES.forEach(s=>{if(s.proyecto===pid&&s.autor)set.add(s.autor);});
  const p=P(pid);
  if(p)p.hitos.forEach(h=>h.tareas.forEach(t=>{if(t.asignado)set.add(t.asignado);}));
  return [...set].filter(Boolean).sort();
}
function esCompartido(pid){return !!canalDe(pid);}

/* ---------- empaquetar ---------- */
function proyectoPaquete(pid){
  const p=P(pid);if(!p)return null;
  const hitos=p.hitos.map((h,i)=>({id:h.id,nombre:h.nombre,peso:h.peso,horas:h.horas,fecha:h.fecha,
    estado:h.estado,orden:i,actualizado:h.actualizado||VIEJO}));
  const tareas=[];
  p.hitos.forEach(h=>h.tareas.forEach((t,i)=>tareas.push(Object.assign({},t,{hito:h.id,orden:i,
    actualizado:t.actualizado||VIEJO}))));
  const ses=SES.filter(s=>s.proyecto===pid).map(s=>Object.assign({},s,{autor:s.autor||autorNombre()}));
  return {proyecto:{id:p.id,nombre:p.nombre,color:p.color,tipo:p.tipo,fechaLimite:p.fechaLimite,
            actualizado:p.actualizado||VIEJO},
          hitos,tareas,sesiones:ses,borrados:borrados(),miembros:miembrosDe(pid),
          actividad:(p.actividad||[]).slice(-50),
          libres:Object.assign({},((compartidos().find(x=>x.proyectoId===pid)||{}).libres)||{},
                               (function(){const o={};o[autorNombre()]=horasLibresMias();return o;})()),
          correos:((compartidos().find(x=>x.proyectoId===pid)||{}).correos)||[],
          actualizado:AHORA(),autor:autorNombre()};
}

/* ---------- fusionar: gana la edición más reciente de cada pieza ---------- */
function fusionarProyecto(pid,rem){
  const p=P(pid);
  if(!p||!rem)return null;
  const r={nuevosHitos:0,nuevasTareas:0,cambios:0,horas:0};

  if(rem.proyecto&&(rem.proyecto.actualizado||VIEJO)>(p.actualizado||VIEJO)){
    p.nombre=rem.proyecto.nombre;p.color=rem.proyecto.color;
    p.fechaLimite=rem.proyecto.fechaLimite;p.actualizado=rem.proyecto.actualizado;r.cambios++;
  }
  // borrados: unión de las dos listas
  const bmap={};[...borrados(),...(rem.borrados||[])].forEach(b=>{if(!bmap[b.id]||bmap[b.id]<b.ts)bmap[b.id]=b.ts;});
  D.borrados=Object.keys(bmap).map(id=>({id,ts:bmap[id]}));

  // hitos
  const mh={};p.hitos.forEach(h=>mh[h.id]=h);
  (rem.hitos||[]).forEach(rh=>{
    const lh=mh[rh.id];
    if(!lh){
      if(bmap[rh.id]&&bmap[rh.id]>(rh.actualizado||VIEJO))return;
      p.hitos.push({id:rh.id,nombre:rh.nombre,peso:rh.peso,horas:rh.horas,fecha:rh.fecha,
        estado:rh.estado,orden:rh.orden,actualizado:rh.actualizado,tareas:[]});
      r.nuevosHitos++;
    }else if((rh.actualizado||VIEJO)>(lh.actualizado||VIEJO)){
      Object.assign(lh,{nombre:rh.nombre,peso:rh.peso,horas:rh.horas,fecha:rh.fecha,
        estado:rh.estado,orden:rh.orden,actualizado:rh.actualizado});r.cambios++;
    }else if(lh.orden===undefined)lh.orden=rh.orden;
  });
  // tareas
  const mt={};p.hitos.forEach(h=>h.tareas.forEach(t=>mt[t.id]={t,h}));
  (rem.tareas||[]).forEach(rt=>{
    const dest=p.hitos.find(h=>h.id===rt.hito);
    const cur=mt[rt.id];
    if(!cur){
      if(!dest)return;
      if(bmap[rt.id]&&bmap[rt.id]>(rt.actualizado||VIEJO))return;
      const copia=Object.assign({},rt);delete copia.hito;
      dest.tareas.push(copia);r.nuevasTareas++;
      fusionarComentarios(mt[rt.id]&&mt[rt.id].t,rt);
    }else if((rt.actualizado||VIEJO)>(cur.t.actualizado||VIEJO)){
      const copia=Object.assign({},rt);delete copia.hito;
      const coms=(cur.t.coment||[]).slice();
      if(dest&&dest.id!==cur.h.id){                       // ha cambiado de hito
        cur.h.tareas=cur.h.tareas.filter(x=>x.id!==rt.id);
        dest.tareas.push(copia);
        copia.coment=coms;fusionarComentarios(copia,rt);
      }else{Object.assign(cur.t,copia);cur.t.coment=coms;fusionarComentarios(cur.t,rt);}
      r.cambios++;
    }else fusionarComentarios(cur.t,rt);
  });
  // aplicar borrados y reordenar
  p.hitos=p.hitos.filter(h=>!(bmap[h.id]&&bmap[h.id]>(h.actualizado||VIEJO)));
  p.hitos.forEach(h=>{h.tareas=h.tareas.filter(t=>!(bmap[t.id]&&bmap[t.id]>(t.actualizado||VIEJO)));});
  p.hitos.sort((a,b)=>(a.orden==null?99:a.orden)-(b.orden==null?99:b.orden));
  p.hitos.forEach((h,i)=>{h.orden=i;h.tareas.sort((a,b)=>(a.orden==null?99:a.orden)-(b.orden==null?99:b.orden));
    h.tareas.forEach((t,j)=>t.orden=j);});

  // horas: unión por identificador, cada una con su autor
  const vistas={};SES.forEach(s=>vistas[s.id]=true);
  (rem.sesiones||[]).forEach(s=>{
    if(vistas[s.id])return;
    if(bmap[s.id])return;
    SES.push(Object.assign({},s,{proyecto:pid}));r.horas+=s.horas;
  });
  return r;
}

/* ---------- unirse: el proyecto del canal sustituye al local ---------- */
function adoptarProyecto(pid,rem){
  const p=P(pid);
  if(!p||!rem)return null;
  // al unirse se descarta lo local en silencio: nunca estuvo en el canal,
  // así que no se anota como borrado (haría desaparecer lo del otro lado)
  p.nombre=rem.proyecto.nombre;p.color=rem.proyecto.color;
  p.fechaLimite=rem.proyecto.fechaLimite;p.actualizado=rem.proyecto.actualizado;
  p.hitos=(rem.hitos||[]).slice().sort((a,b)=>(a.orden||0)-(b.orden||0)).map(h=>({
    id:h.id,nombre:h.nombre,peso:h.peso,horas:h.horas,fecha:h.fecha,estado:h.estado,
    orden:h.orden,actualizado:h.actualizado,
    tareas:(rem.tareas||[]).filter(t=>t.hito===h.id).sort((a,b)=>(a.orden||0)-(b.orden||0))
      .map(t=>{const c=Object.assign({},t);delete c.hito;return c;})}));
  SES=SES.filter(s=>s.proyecto!==pid);
  (rem.sesiones||[]).forEach(s=>SES.push(Object.assign({},s,{proyecto:pid})));
  D.borrados=(rem.borrados||[]).slice();
  return {hitos:p.hitos.length,tareas:(rem.tareas||[]).length};
}

/* ---------- sincronizar un canal ---------- */
async function llamarCanal(c,accion,payload){
  const cuerpo=JSON.stringify({clave:c.clave,accion,proyecto:c.canal||'canal',payload});
  const r=await fetch(c.url,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},body:cuerpo})
    .catch(e=>{registrarOperacion('canal:'+accion,'sin red: '+e.message,cuerpo.length,false);throw e;});
  const txt=await r.text();
  let j;
  try{j=JSON.parse(txt);}
  catch(e){registrarOperacion('canal:'+accion,'respuesta ilegible',0,false);throw new Error('respuesta inesperada: revisa que el acceso sea «cualquier persona»');}
  if(j.error){registrarOperacion('canal:'+accion,'error: '+j.error,0,false);throw new Error(j.error);}
  registrarOperacion('canal:'+accion,'correcto',cuerpo.length,true);
  return j;
}
async function sincronizarCanal(c,manual,unirse){
  if(!c.activo||!c.url||!P(c.proyectoId))return null;
  const j=await llamarCanal(c,'leerProyecto');
  const rem=j.payload;
  let res=null;
  if(unirse){
    if(!rem||!rem.proyecto){if(manual)toast('El canal está vacío: que la otra persona pulse antes «Compartir el mío»');return null;}
    const a=adoptarProyecto(c.proyectoId,rem);
    c.base=rem.actualizado;c.ultima=AHORA();
    c.miembros=[...new Set([...(rem.miembros||[]),autorNombre()])];
    if(manual)toast('Te has unido: '+a.hitos+' hitos y '+a.tareas+' subtareas');
    return a;
  }
  if(rem&&rem.actualizado!==c.base)res=fusionarProyecto(c.proyectoId,rem);
  if(rem&&rem.miembros)c.miembros=[...new Set([...(c.miembros||[]),...rem.miembros,autorNombre()])];
  if(rem)fusionarCanalExtra(c.proyectoId,rem,c);
  const p=proyectoPaquete(c.proyectoId);
  await llamarCanal(c,'guardarProyecto',p);
  c.base=p.actualizado;c.ultima=AHORA();
  if(manual){
    const n=res?(res.nuevosHitos+res.nuevasTareas+res.cambios):0;
    toast(n?('Actualizado: '+n+' cambio(s) de '+(rem.autor||'tu socio')):'Compartido al día');
  }
  return res;
}
async function sincronizarCompartidos(manual,unirsePid){
  const cs=compartidos().filter(c=>c.activo);
  if(!cs.length)return;
  for(const c of cs){
    try{await sincronizarCanal(c,manual,unirsePid===c.proyectoId);}
    catch(e){console.warn('canal',c.proyectoId,e);if(manual)toast('Canal de '+nombreDe(c.proyectoId)+': '+e.message);}
  }
  await guardar(false);render();
}

/* ---------- comentarios, actividad, horas libres y correos del canal ---------- */
function fusionarComentarios(lt,rt){
  if(!lt||!rt||!rt.coment||!rt.coment.length)return;
  lt.coment=lt.coment||[];
  const vistos={};lt.coment.forEach(c=>vistos[c.id]=true);
  rt.coment.forEach(c=>{if(!vistos[c.id])lt.coment.push(c);});
  lt.coment.sort((a,b)=>a.ts<b.ts?-1:1);
}
function fusionarCanalExtra(pid,rem,c){
  const p=P(pid);if(!p)return;
  if(rem.actividad&&rem.actividad.length){
    p.actividad=p.actividad||[];
    const v={};p.actividad.forEach(a=>v[a.id]=true);
    rem.actividad.forEach(a=>{if(!v[a.id])p.actividad.push(a);});
    p.actividad.sort((a,b)=>a.ts<b.ts?-1:1);
    if(p.actividad.length>200)p.actividad=p.actividad.slice(-200);
  }
  if(rem.libres){
    c.libres=Object.assign({},c.libres||{},rem.libres);
    delete c.libres[autorNombre()];
  }
  if(rem.correos&&rem.correos.length&&!(c.correos||[]).length)c.correos=rem.correos;
}

/* ---------- instalación y almacenamiento persistente ---------- */
async function prepararApp(){
  try{
    // Solo se registra si el archivo está publicado de verdad. En una vista
    // previa o con el HTML suelto no existe, y no tiene sentido intentarlo.
    if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
      const base=location.pathname.replace(/[^/]*$/,'');
      const r=await fetch(base+'sw.js',{method:'GET',cache:'no-store'}).catch(()=>null);
      const tipo=r&&r.headers&&r.headers.get?String(r.headers.get('content-type')||''):'';
      if(r&&r.ok&&tipo.indexOf('html')<0){
        await navigator.serviceWorker.register(base+'sw.js',{scope:base});
        registrarOperacion('service worker','registrado',0,true);
      }else{
        registrarOperacion('service worker','no publicado en este servidor: se omite',0,true);
      }
    }
  }catch(e){registrarOperacion('service worker','no se ha podido registrar: '+e.message,0,true);}
  try{
    if(navigator.storage&&navigator.storage.persist){
      const ya=await navigator.storage.persisted();
      if(!ya)await navigator.storage.persist();
    }
  }catch(e){}
}
async function tamanoDatos(){
  const trozo=o=>{try{return JSON.stringify(o).length;}catch(e){return 0;}};
  const kb=n=>n<1024?n+' B':(n/1024).toFixed(n<102400?1:0)+' kB';
  const t={config:trozo(D),semanas:trozo(SEM),sesiones:trozo(SES),incidencias:trozo(INC),archivo:trozo(ARCH)};
  const sync=t.config+t.semanas+t.sesiones+t.incidencias;
  let cuota=null;
  try{
    if(navigator.storage&&navigator.storage.estimate){
      const e=await navigator.storage.estimate();
      cuota={usado:e.usage,total:e.quota};
    }
  }catch(e){}
  return {t,sync,kb,cuota};
}

   FUSIÓN DE LA COPIA PERSONAL, ELEMENTO A ELEMENTO

   se ha cambiado en los dos lados desde la última base común.
   ============================================================ */
const VERSION_DATOS=5;
var ARCH={};                 // semanas archivadas
var conflictosPend=[];

function sello(o){if(o)o.actualizado=AHORA();return o;}
function selloCfg(k){D.config.sellos=D.config.sellos||{};D.config.sellos[k]=AHORA();}

    p.hitos.forEach(h=>{

    });
  });
  (D.config.reglas||[]).forEach(r=>{r.actualizado=r.actualizado||VIEJO;});
  const c=D.config.cuotas||{};

/* ---------- utilidades de comparación ---------- */
const CAMPOS_PROY=['nombre','color','tipo','prioridad','pct','minimo','activo','fechaInicio','fechaFin','fechaLimite','objetivoSesiones'];
const CAMPOS_HITO=['nombre','peso','horas','fecha','estado','dependeDe','orden','avanceManual'];
const CAMPOS_TAREA=['nombre','horas','contexto','estado','critica','bloqueante','desplaza','etiquetas','rec','asignado','orden'];
const CAMPOS_BLOQUE=['fecha','ini','fin','tipo','proyecto','tareaId','hito','nombre','nota','estado','quien','motivo','origen','fijo','ejercicio','recFijo','deudaId'];
const CAMPOS_SEMANA=['capacidad','util','margen','diasOff','jornadas','notas','porProyecto','usadas','sinSitio'];
const CAMPOS_REGLA=['nombre','tipo','dias','ini','fin','maxHoras','etiquetas','activa','proy','vigenteDesde','vigenteHasta','grupo'];

function recorta(o,campos){const r={};campos.forEach(k=>{if(o[k]!==undefined)r[k]=o[k];});return r;}
function copiar(dst,src,campos){campos.forEach(k=>{if(src[k]!==undefined)dst[k]=src[k];else delete dst[k];});dst.actualizado=src.actualizado;}
function iguales(a,b,campos){return JSON.stringify(recorta(a,campos))===JSON.stringify(recorta(b,campos));}

/* Comparación a tres bandas: cada elemento se compara con el estado que las dos
   copias tenían en la última sincronización. Así se distingue «lo ha cambiado
   el otro» de «lo he cambiado yo», que es lo que una simple fecha no sabe. */
var mapaBase={};
function construirMapa(){
  const m={};
  D.proyectos.forEach(p=>{
    m[p.id]=p.actualizado;
    p.hitos.forEach(h=>{m[h.id]=h.actualizado;h.tareas.forEach(t=>{m[t.id]=t.actualizado;});});
  });
  Object.values(SEM).forEach(w=>{
    m['W:'+w.id]=w.actualizado;
    (w.bloques||[]).forEach(b=>{m[b.id]=b.actualizado;});
  });
  (D.config.reglas||[]).forEach(r=>{m['R:'+r.id]=r.actualizado;});
  const q=D.config.cuotas||{};
  Object.keys(q).forEach(k=>{m['Q:'+k]=q[k].actualizado;});
  const sl=D.config.sellos||{};
  Object.keys(sl).forEach(k=>{m['S:'+k]=sl[k];});
  return m;
}
function fijarMapa(){syncCfg().mapa=construirMapa();}

function resolver(loc,rem,campos,clave,etiqueta,conf,res){
  const la=loc.actualizado||VIEJO, ra=rem.actualizado||VIEJO;
  if(iguales(loc,rem,campos)){if(ra>la)loc.actualizado=ra;return;}
  const ba=mapaBase[clave];
  const cambioAqui = ba===undefined ? true : la!==ba;
  const cambioAlla = ba===undefined ? true : ra!==ba;
  if(cambioAqui&&cambioAlla){
    conf.push({etiqueta,campos,loc,rem,
      resumen:{mio:resumenCampos(loc,campos),suyo:resumenCampos(rem,campos)}});
    return;
  }
  if(cambioAlla){copiar(loc,rem,campos);res.cambios++;}
}
function resumenCampos(o,campos){
  return campos.filter(k=>o[k]!==undefined&&typeof o[k]!=='object')
    .slice(0,4).map(k=>k+': '+o[k]).join(' · ')||'(sin detalle)';
}

/* ---------- fusión completa ---------- */
function fusionarPersonal(rem){
  mapaBase=syncCfg().mapa||{};
  const conf=[],res={cambios:0,nuevos:0,sesiones:0,semanas:0};
  const rd=rem.datos||{};

  // tumbas de las dos partes
  const bmap={};
  [...borrados(),...(rd.borrados||[])].forEach(b=>{if(!bmap[b.id]||bmap[b.id]<b.ts)bmap[b.id]=b.ts;});
  D.borrados=Object.keys(bmap).map(id=>({id,ts:bmap[id]}));
  const smap={};
  [...tumbasSes(),...(rd.sesBorradas||[])].forEach(b=>{if(!smap[b.id]||smap[b.id]<b.ts)smap[b.id]=b.ts;});
  D.sesBorradas=Object.keys(smap).map(id=>({id,ts:smap[id]}));
  const enterrado=(id,act)=>bmap[id]&&bmap[id]>(act||VIEJO);

  // ---- proyectos, hitos y tareas ----
  (rd.proyectos||[]).forEach(rp=>{
    let lp=P(rp.id);
    if(!lp){
      if(enterrado(rp.id,rp.actualizado))return;
      D.proyectos.push(JSON.parse(JSON.stringify(rp)));res.nuevos++;return;
    }
    resolver(lp,rp,CAMPOS_PROY,lp.id,'Proyecto «'+lp.nombre+'»',conf,res);
    (rp.hitos||[]).forEach(rh=>{
      let lh=lp.hitos.find(x=>x.id===rh.id);
      if(!lh){
        if(enterrado(rh.id,rh.actualizado))return;
        lp.hitos.push(JSON.parse(JSON.stringify(rh)));res.nuevos++;return;
      }
      resolver(lh,rh,CAMPOS_HITO,lh.id,'Hito «'+lh.nombre+'»',conf,res);
      (rh.tareas||[]).forEach(rt=>{
        const lt=lh.tareas.find(x=>x.id===rt.id);
        if(!lt){
          if(enterrado(rt.id,rt.actualizado))return;
          lh.tareas.push(JSON.parse(JSON.stringify(rt)));res.nuevos++;return;
        }
        resolver(lt,rt,CAMPOS_TAREA,lt.id,'Subtarea «'+lt.nombre+'»',conf,res);
      });
    });
  });
  // borrados que llegan de fuera
  D.proyectos.forEach(p=>{
    p.hitos=p.hitos.filter(h=>!enterrado(h.id,h.actualizado));
    p.hitos.forEach(h=>{h.tareas=h.tareas.filter(t=>!enterrado(t.id,t.actualizado));});
  });
  D.proyectos=D.proyectos.filter(p=>!enterrado(p.id,p.actualizado));

  // ---- semanas y bloques ----
  const rs=rem.semanas||{};
  Object.keys(rs).forEach(k=>{
    const rw=rs[k];
    let lw=SEM[k];
    if(!lw){SEM[k]=JSON.parse(JSON.stringify(rw));res.semanas++;return;}
    resolver(lw,rw,CAMPOS_SEMANA,'W:'+k,'Semana '+k,conf,res);
    (rw.bloques||[]).forEach(rb=>{
      const lb=(lw.bloques||[]).find(x=>x.id===rb.id);
      if(!lb){
        if(enterrado(rb.id,rb.actualizado))return;
        lw.bloques.push(JSON.parse(JSON.stringify(rb)));res.cambios++;return;
      }
      resolver(lb,rb,CAMPOS_BLOQUE,lb.id,'Bloque «'+(lb.nombre||'')+'»',conf,res);
    });
    lw.bloques=(lw.bloques||[]).filter(b=>!enterrado(b.id,b.actualizado));
  });

  // ---- sesiones e incidencias: unión por identificador ----
  const vistas={};SES.forEach(s=>vistas[s.id]=true);
  (rem.sesiones||[]).forEach(s=>{if(vistas[s.id]||smap[s.id])return;SES.push(s);res.sesiones++;});
  SES=SES.filter(s=>!smap[s.id]);
  const vi={};INC.forEach(i=>vi[i.id]=true);
  (rem.incidencias||[]).forEach(i=>{if(!vi[i.id])INC.push(i);});

  // ---- configuración: reglas, cuotas y ajustes sueltos ----
  const rc=rd.config||{};
  (rc.reglas||[]).forEach(rr=>{
    const lr=(D.config.reglas||[]).find(x=>x.id===rr.id);
    if(!lr){D.config.reglas.push(JSON.parse(JSON.stringify(rr)));res.cambios++;return;}
    resolver(lr,rr,CAMPOS_REGLA,'R:'+lr.id,'Franja «'+lr.nombre+'»',conf,res);
  });
  const rq=rc.cuotas||{};
  D.config.cuotas=D.config.cuotas||{};
  Object.keys(rq).forEach(m=>{
    const l=D.config.cuotas[m];
    if(!l){D.config.cuotas[m]=rq[m];res.cambios++;return;}
    resolver(l,rq[m],['jornadas'],'Q:'+m,'Cuota de '+m,conf,res);
  });
  const rsel=rc.sellos||{};
  D.config.sellos=D.config.sellos||{};
  Object.keys(rsel).forEach(k=>{
    const mio=D.config.sellos[k]||VIEJO, suyo=rsel[k];
    if(JSON.stringify(D.config[k])!==JSON.stringify(rc[k])){
      const ba=mapaBase['S:'+k];
      const aqui=ba===undefined?true:mio!==ba, alla=ba===undefined?true:suyo!==ba;
      if(!alla)return;
      if(aqui&&alla){
        conf.push({etiqueta:'Ajuste «'+k+'»',campos:[k],loc:D.config,rem:rc,
          resumen:{mio:k+': '+JSON.stringify(D.config[k]),suyo:k+': '+JSON.stringify(rc[k])},sello:k});
        return;
      }
      D.config[k]=rc[k];D.config.sellos[k]=suyo;res.cambios++;
    }
  });
  // los proyectos compartidos y la sincronización son de cada dispositivo
  return {conf,res};
}

const SEMANAS_VIVAS=13;
var archSucio=false;

function todasSemanas(){return Object.assign({},ARCH,SEM);}
function semanaDe(id){return SEM[id]||ARCH[id]||null;}

/* ---------- compactar sesiones: fuera lo vacío y lo redundante ---------- */
function compactarSesiones(){
  let quitados=0;
  SES.forEach(s=>{
    Object.keys(s).forEach(k=>{
      const v=s[k];
      if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)){delete s[k];quitados++;}
    });
    if(s.tipo==='trabajo')delete s.tipo;
    if(s.detalle&&!s.detalle.filter(Boolean).length){delete s.detalle;quitados++;}
  });
  return quitados;
}

/* ---------- archivar ---------- */
function archivarViejas(){
  const corte=addDays(lunesDe(hoyISO()),-7*SEMANAS_VIVAS);
  let n=0;
  Object.keys(SEM).forEach(k=>{
    const w=SEM[k];
    if(w.lunes<corte){ARCH[k]=w;delete SEM[k];n++;}
  });
  if(n){archSucio=true;compactarSesiones();}
  return n;
}

function diario(f){D.diario=D.diario||{};D.diario[f]=D.diario[f]||{};return D.diario[f];}
function cfgCierre(){
  D.config.cierre=Object.assign({activo:EDICION==='personal',minutos:5,notificar:false},D.config.cierre||{});
  return D.config.cierre;
}
/* primera franja protegida de la tarde según la regla vigente ese día */
function franjaProtegidaTarde(fecha){
  const d=diaSemana(fecha);
  const rs=reglasDe(d,fecha).filter(r=>r.tipo==='protegido'&&toMin(r.ini)>=toMin('12:00'));
  if(!rs.length)return null;
  rs.sort((a,b)=>toMin(a.ini)-toMin(b.ini));
  return rs[0];
}
function horaCierre(fecha){
  const r=franjaProtegidaTarde(fecha);
  if(!r)return null;
  return toMin(r.ini)-cfgCierre().minutos;
}
function ahoraMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function tocaCerrar(){
  const c=cfgCierre();if(!c.activo)return false;
  const f=hoyISO();
  if(diario(f).cerrado)return false;
  const h=horaCierre(f);
  return h!==null&&ahoraMin()>=h;
}
function enModoFamilia(){
  const f=hoyISO(),d=diario(f);
  if(!d.cerrado||d.salida)return false;
  const r=franjaProtegidaTarde(f);
  if(!r)return false;
  return ahoraMin()<toMin(r.fin);
}

  clearTimeout(avisoCierre);

  if(!c.activo||!c.notificar)return;
  if(typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const h=horaCierre(hoyISO());
  if(h===null)return;
  const falta=(h-ahoraMin())*60000;
  if(falta<=0||falta>12*3600000)return;
  avisoCierre=setTimeout(()=>{
    try{new Notification('Cierre del día',{body:'Un minuto y desconectas. Toca para cerrar.',tag:'cierre'});}catch(e){}
  },falta);
}

function trimestreVence(y,t){                       // T1 abr, T2 jul, T3 oct, T4 ene del año siguiente
  const mes=[4,7,10,1][t-1], anio=t===4?y+1:y;
  return anio+'-'+pad(mes)+'-20';
}
function obligacionesSL(pid,anios){
  const p=P(pid);if(!p)return 0;
  const hid='fisc_'+pid;
  let hi=p.hitos.find(x=>x.id===hid);
  if(!hi){
    hi=tocar({id:hid,nombre:'Obligaciones fiscales y societarias',peso:0,horas:0,fecha:null,
      estado:'en_curso',tareas:[]});
    p.hitos.push(hi);
  }
  const y0=parse(hoyISO()).getFullYear();
  let n=0;
  const anadir=(id,nombre,fecha,horas)=>{
    if(fecha<hoyISO())return;                      // lo ya vencido no se da de alta
    if(hi.tareas.some(t=>t.id===id))return;        // id determinista: nunca duplica
    hi.tareas.push(tocar({id,nombre,horas,contexto:'escritorio',estado:'pendiente',
      critica:true,bloqueante:false,desplaza:false,etiquetas:['escritorio'],
      vence:fecha,avisoDias:D.config.avisoFiscal||14,sinDeuda:true,
      rec:{activo:true,cada:0,horas,dia:null,hora:null,desde:hoyISO(),hasta:null,fija:fecha}}));
    n++;
  };
  for(let a=0;a<(anios||2);a++){
    const y=y0+a;
    FISCAL.forEach(o=>{
      if(o.cada==='T'){
        for(let t=1;t<=4;t++)anadir('fisc_'+o.m+'_'+y+'T'+t,o.nombre+' · '+y+' T'+t,trimestreVence(y,t),o.horas);
      }else if(o.cada==='202'){
        [[4,20],[10,20],[12,20]].forEach(([m,d],i)=>
          anadir('fisc_202_'+y+'P'+(i+1),o.nombre+' · '+y+' pago '+(i+1),y+'-'+pad(m)+'-'+pad(d),o.horas));
      }else{
        anadir('fisc_'+o.m+'_'+y,o.nombre+' · ejercicio '+(y-1),y+'-'+pad(o.mes)+'-'+pad(o.dia),o.horas);
      }
    });
    for(let m=1;m<=12;m++)
      anadir('fisc_conc_'+y+'M'+pad(m),'Conciliación mensual con la asesoría · '+MESES[m-1]+' '+y,
        (m===12?y+1:y)+'-'+pad(m===12?1:m+1)+'-10',0.75);
  }
  hi.tareas.sort((a,b)=>(a.vence||'')<(b.vence||'')?-1:1);
  return n;
}
function fiscalesProximas(dias){
  const lim=addDays(hoyISO(),dias||30),out=[];
  D.proyectos.forEach(p=>p.hitos.forEach(h=>h.tareas.forEach(t=>{
    if(!t.vence||t.estado==='completada')return;
    if(t.vence<hoyISO()||t.vence>lim)return;
    out.push({p:p.nombre,color:p.color,nombre:t.nombre,vence:t.vence,
      dias:diffDias(hoyISO(),t.vence),aviso:t.avisoDias||14});
  })));
  return out.sort((a,b)=>a.vence<b.vence?-1:1);
}

function ingresosLinea(p,mes){
  const i=indic(p),v=i.meses[mes]||{};
  return {subs:Number(v.ingSubs||0),patro:Number(v.ingPatro||0),certs:Number(v.ingCerts||0)};

function horasLinea(p,desde,hasta){
  const i=indic(p),r={subs:0,patro:0,certs:0,'':0};
  SES.forEach(s=>{
    if(s.proyecto!==p.id||!s.tareaId)return;
    if(s.fecha<desde||s.fecha>hasta)return;
    let hid=null;
    p.hitos.forEach(h=>{if(h.tareas.some(t=>t.id===s.tareaId))hid=h.id;});
    const l=(i.lineas[hid]!==undefined?i.lineas[hid]:'');
    r[l]=(r[l]||0)+s.horas;
  });
  return r;
}
function conversion(p,mes){
  const v=indic(p).meses[mes]||{};
  const t=Number(v.subs||0),pg=Number(v.subsPago||0);
  return t>0?100*pg/t:null;
}

/* ---------- 2.2 tiempo protegido consumido ---------- */
function clasificaProtegido(b){
  // se mira qué franjas solapa el bloque, no solo la de su hora de inicio:
  // en fin de semana el ejercicio reservado se cruza con la franja de cuota
  const d=diaSemana(b.fecha);
  const rs=reglasDe(d,b.fecha).filter(r=>toMin(r.ini)<b.fin&&toMin(r.fin)>b.ini);
  if(rs.some(r=>r.tipo==='cuota'))return 'cuota';
  if(rs.some(r=>r.tipo==='protegido'))return 'familia';
  if(rs.some(r=>r.tipo==='excepcional'))return 'excepcional';
  return null;
}
function protegidoEn(desde,hasta){
  const r={cuota:0,familia:0,excepcional:0,jornadas:[],dias:{}};
  Object.values(todasSemanas()).forEach(w=>{
    (w.bloques||[]).forEach(b=>{
      if(b.estado==='anulado'||b.fecha<desde||b.fecha>hasta)return;
      if(b.tipo!=='trabajo'&&b.tipo!=='coche')return;
      const c=clasificaProtegido(b);
      if(!c)return;
      const hs=(b.fin-b.ini)/60;
      r[c]+=hs;
      r.dias[b.fecha]=(r.dias[b.fecha]||0)+hs;
    });
    (w.jornadas||[]).forEach(j=>{if(j.fecha>=desde&&j.fecha<=hasta)r.jornadas.push(j.fecha);});
  });
  return r;
}
function findesSeguidos(fechas){
  const ls=[...new Set(fechas.map(f=>lunesDe(f)))].sort();
  let max=1,act=1;
  for(let i=1;i<ls.length;i++){act=diffDias(ls[i-1],ls[i])===7?act+1:1;max=Math.max(max,act);}
  return ls.length?max:0;
}
function bloqueProtegido(per){
  let h='<div class="card" style="margin-top:12px"><b style="font-size:14px">Tiempo protegido que has usado</b>'+
    '<p class="tiny muted" style="margin:3px 0 10px">Horas de trabajo dentro de franjas que tenías reservadas para otra cosa. No es un reproche: es para que lo veas.</p>';
  h+='<div style="overflow-x:auto"><table class="cfg"><tr><th>Periodo</th><th>Cuota de finde</th><th>Excepcional</th>'+
     '<th>A mano en familia</th><th>Jornadas</th><th>Cuota del mes</th></tr>';
  let totJor=[];
  per.forEach(p=>{
    const r=protegidoEn(p.desde,p.hasta);
    totJor=totJor.concat(r.jornadas);
    const mes=p.desde.slice(0,7);
    const cuota=cuotaMes(mes), usadas=r.jornadas.length;
    const exceso=anaModo==='mes'&&usadas>cuota;
    h+='<tr><td>'+esc(p.etq)+'</td>'+
      '<td>'+(r.cuota?fmtH(r.cuota):'·')+'</td><td>'+(r.excepcional?fmtH(r.excepcional):'·')+'</td>'+
      '<td'+(r.familia?' style="color:var(--warn)"':'')+'>'+(r.familia?fmtH(r.familia):'·')+'</td>'+
      '<td>'+(usadas||'·')+'</td>'+
      '<td'+(exceso?' style="color:var(--bad)"':'')+'>'+(anaModo==='mes'?usadas+' de '+cuota:'—')+'</td></tr>';
  });
  h+='</table></div>';
  const seg=findesSeguidos(totJor);
  if(seg>=2)h+='<div class="warnbox" style="margin-top:10px">Llevas '+seg+' fines de semana seguidos con jornada de obra. El Documento 2 avisaba de que ahí es donde se rompe el equilibrio. Igual toca saltarse el próximo.</div>';
  const mesAct=hoyISO().slice(0,7);
  const usadasMes=totJor.filter(f=>f.slice(0,7)===mesAct).length;
  if(usadasMes>cuotaMes(mesAct))h+='<div class="badbox" style="margin-top:10px">Este mes llevas '+usadasMes+
    ' jornadas de obra y la cuota que te pusiste era de '+cuotaMes(mesAct)+'.</div>';
  h+='</div>';
  return h;
}

/* ---------- 2.3 energía ---------- */
function bloqueEnergia(per){
  const dia=D.diario||{};
  const filas=per.map(p=>{
    let suma=0,n=0,mol=0;
    Object.keys(dia).forEach(f=>{
      if(f<p.desde||f>p.hasta)return;
      if(dia[f].energia){suma+=dia[f].energia;n++;}
      if((dia[f].molestias||[]).length)mol++;
    });
    const real=sumaObj(realEn(p.desde,p.hasta));
    return {etq:p.etq,media:n?suma/n:null,dias:n,mol,horas:real};
  });
  if(!filas.some(f=>f.dias))return '';
  const maxH=Math.max(1,...filas.map(f=>f.horas));
  let h='<div class="card" style="margin-top:12px"><b style="font-size:14px">Energía y horas</b>'+
    '<p class="tiny muted" style="margin:3px 0 10px">La media de cómo te levantas, junto a lo que acabaste haciendo.</p>'+
    '<div class="hbars">';
  filas.forEach(f=>{
    h+='<div class="hbar"><span class="tiny">'+esc(f.etq)+'</span>'+
      '<span class="track"><i style="width:'+(100*f.horas/maxH)+'%;background:var(--ok)"></i>'+
      (f.media?'<u style="left:'+(100*(f.media/5))+'%"></u>':'')+'</span>'+
      '<span class="tiny muted">'+fmtH(f.horas)+(f.media?' · energía '+f.media.toFixed(1):'')+
      (f.mol?' · '+f.mol+' con molestia':'')+'</span></div>';
  });
  h+='</div><p class="tiny muted" style="margin-top:8px">La marca gris de cada barra es la energía media sobre 5.</p></div>';
  return h;
}

const SEMANAS_CAL=4;
function rangoCal(){
  const desde=lunesDe(hoyISO());
  return {desde,hasta:addDays(desde,7*SEMANAS_CAL)};
}
function fechaHora(f,min){
  const d=parse(f);d.setHours(Math.floor(min/60),min%60,0,0);
  return d.toISOString();
}
function eventosDeBloques(){
  const {desde,hasta}=rangoCal();
  const out=[];
  Object.values(SEM).forEach(w=>{
    (w.bloques||[]).forEach(b=>{
      if(b.fecha<desde||b.fecha>=hasta)return;
      if(b.estado==='anulado')return;
      if(b.tipo==='margen')return;
      const hi=hitoDe(b), qn=quienDe(b);
      const obra=(b.tipo==='coche')||(b.proyecto==='CASA'&&clasificaProtegido(b)==='cuota');
      out.push({id:b.id,obra,
        titulo:nombreDe(b.proyecto)+(hi?' › '+hi:'')+' › '+b.nombre,
        descripcion:[b.nota?'Nota: '+b.nota:'',qn?'Asignada a: '+qn:'',b.motivo||''].filter(Boolean).join('\n'),
        inicio:fechaHora(b.fecha,b.ini),fin:fechaHora(b.fecha,b.fin)});
    });
  });
  return out;

function huellaEvento(e){return e.titulo+'|'+e.inicio+'|'+e.fin+'|'+(e.obra?1:0);}

async function escribirCalendario(manual){
  const c=cfgCal(),s=syncCfg();

    c.enviados=nuevos;c.ultima=AHORA();
    await guardar(false);
    if(manual)toast('Calendario: '+j.creados+' nuevos, '+j.actualizados+' actualizados, '+j.borrados+' borrados');
    return j;
  }catch(e){
    if(manual)toast('No se ha podido escribir: '+e.message);

  }

/* ============================================================
   ESTIMACIONES QUE APRENDEN Y VIABILIDAD PROBABILÍSTICA
   ============================================================ */

/* ---------- 3.2a factor de corrección por tipo de tarea ---------- */
function tipoTarea(t,hito){
  const et=(t.etiquetas||[]).slice().sort().join('+');
  if(hito&&/recurrente/i.test(hito.nombre||''))return 'recurrente:'+(t.nombre||'').split(' ')[0].toLowerCase();
  if(t.rec)return 'recurrente:'+(t.contexto||'escritorio');
  if(t.desplaza)return 'obra:'+(t.contexto||'obra');
  return (t.contexto||'escritorio')+(et?'|'+et:'');
}
function tareasDelTipo(tipo){
  const out=[];
  D.proyectos.forEach(p=>p.hitos.forEach(h=>h.tareas.forEach(t=>{
    if(tipoTarea(t,h)!==tipo)return;
    const real=horasTarea(t.id);
    const completa=t.estado==='completada'||(t.horas>0&&real>=t.horas*0.95);
    if(completa&&t.horas>0&&real>0)out.push({t,real,est:t.horas,fin:ultimaSesion(t.id)});
  })));
  return out.sort((a,b)=>(a.fin||'')<(b.fin||'')?1:-1);
}
function ultimaSesion(tid){
  let f=null;SES.forEach(s=>{if(s.tareaId===tid&&(!f||s.fecha>f))f=s.fecha;});
  return f;
}
const FACTOR_MIN=0.7, FACTOR_MAX=2, FACTOR_N=8, FACTOR_MINIMO=3;
function factorTipo(tipo){
  const hist=tareasDelTipo(tipo).slice(0,FACTOR_N);
  if(hist.length<FACTOR_MINIMO)return {factor:1,n:hist.length,activo:false};
  const est=hist.reduce((a,x)=>a+x.est,0), real=hist.reduce((a,x)=>a+x.real,0);
  const f=Math.min(FACTOR_MAX,Math.max(FACTOR_MIN,real/est));
  return {factor:Math.round(f*100)/100,n:hist.length,activo:true};
}
function factorDe(t,hito){return factorTipo(tipoTarea(t,hito));}
function aprende(pid){const p=P(pid);return p?p.aprender!==false:false;}
function horasCorregidas(t,hito,pid){
  const pend=Math.max(0,t.horas-horasTarea(t.id));
  if(!aprende(pid))return pend;
  const f=factorDe(t,hito);
  return f.activo?Math.round(pend*f.factor*100)/100:pend;
}

/* ---------- azar reproducible ---------- */
function azar(semilla){
  let s=semilla>>>0||123456789;
  return function(){s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};
}

/* ---------- 3.2b viabilidad por simulación ---------- */
function historicoSemanal(pid){
  const out=[];
  Object.values(todasSemanas()).forEach(w=>{
    if(!w.lunes||w.lunes>hoyISO())return;
    out.push({lunes:w.lunes,h:(w.porProyecto&&w.porProyecto[pid])||0});
  });
  return out.sort((a,b)=>a.lunes<b.lunes?-1:1);
}
function pendienteProyecto(p){
  let normal=0,obra=0;
  p.hitos.forEach(h=>h.tareas.forEach(t=>{
    if(t.rec||t.estado==='completada')return;
    const c=horasCorregidas(t,h,p.id);
    if(c<=0.1)return;
    if(t.desplaza)obra+=c;else normal+=c;
  }));
  return {normal,obra,total:normal+obra};
}
function cuotaFutura(mes){return cuotaMes(mes);}
function simularProyecto(p,opts){
  opts=opts||{};
  const rnd=azar(opts.semilla||0x5eed);
  const hist=historicoSemanal(p.id).slice(-26);
  const muestras=hist.map(x=>x.h);
  const pocas=muestras.length<6;
  const teorica=capacidadTeorica(lunesDe(hoyISO()))*0.85*((p.pct||0)/100||0.3);
  const pend=pendienteProyecto(p);
  const jorH=horasObraDia(addDays(lunesDe(hoyISO()),5))||6;   // lo que da un sábado tuyo
  const N=opts.n||1000, TOPE=opts.tope||160;
  const fechas=[];
  for(let k=0;k<N;k++){
    let restN=pend.normal, restO=pend.obra, lun=lunesDe(hoyISO()), s=0, usadasMes={};
    while(s<TOPE&&(restN>0.1||restO>0.1)){
      const mes=mesDe(lun);
      let h=pocas?teorica:muestras[Math.floor(rnd()*muestras.length)];
      // las jornadas de obra solo si queda cuota ese mes
      if(restO>0.1){
        const q=cuotaFutura(mes);
        usadasMes[mes]=usadasMes[mes]||0;
        if(usadasMes[mes]<q&&rnd()<0.8){usadasMes[mes]++;restO-=jorH;h=Math.max(0,h-jorH);}
      }
      restN-=Math.max(0,h);
      lun=addDays(lun,7);s++;
    }
    fechas.push(s>=TOPE?null:addDays(lun,-1));
  }
  const ok=fechas.filter(Boolean).sort();
  const pct=q=>ok.length?ok[Math.min(ok.length-1,Math.floor(ok.length*q))]:null;
  const p50=pct(0.5), p85=pct(0.85);
  const meta=p.fechaLimite;
  const prob=meta&&fechas.length?100*fechas.filter(f=>f&&f<=meta).length/fechas.length:null;
  return {p50,p85,prob:prob===null?null:Math.round(prob),pend,pocas,
    semanasMuestra:muestras.length,mediaSemanal:muestras.length?muestras.reduce((a,b)=>a+b,0)/muestras.length:teorica};
}
/* una modificación concreta que haría cumplir la fecha con P85 */
function ajusteParaCumplir(p,opts){
  if(!p.fechaLimite)return null;
  const base=simularProyecto(p,opts);
  if(base.p85&&base.p85<=p.fechaLimite)return {ya:true,sim:base};
  const semanas=Math.max(1,Math.round(diffDias(hoyISO(),p.fechaLimite)/7));
  // 1) más horas semanales
  for(let extra=0.5;extra<=12;extra+=0.5){
    const sim=simularProyecto(p,Object.assign({},opts,{n:300}));
    const necesarias=(base.pend.total/semanas);
    if(base.mediaSemanal+extra>=necesarias)
      return {tipo:'horas',extra:Math.round(extra*10)/10,necesarias,sim:base,
        texto:'Dedicarle '+fmtH(Math.round(extra*10)/10)+' más cada semana, hasta '+fmtH(base.mediaSemanal+extra)+'.'};
  }
  // 2) recortar alcance
  const recorte=Math.max(0,base.pend.total-semanas*base.mediaSemanal);
  if(recorte>0)return {tipo:'alcance',horas:Math.round(recorte),sim:base,
    texto:'Quitar '+fmtH(Math.round(recorte))+' de alcance, que es más o menos un hito mediano.'};
  return {tipo:'fecha',sim:base,texto:'Mover la fecha a '+esp(base.p85||base.p50)+'.'};
}

/* ---------- simulador de proyectos candidatos ---------- */
function escenariosCandidato(horasTotales,pctPropuesto){
  const lun=lunesDe(hoyISO());
  const libre=capacidadTeorica(lun)*0.85;
  const hist=[];
  Object.values(todasSemanas()).forEach(w=>{if(w.lunes<=hoyISO())hist.push(w.usadas||0);});
  const media=hist.length?hist.reduce((a,b)=>a+b,0)/hist.length:libre;
  const cuota=media*(pctPropuesto/100);
  const esc=[['P15','pesimista',0.6],['P50','probable',1],['P85','optimista',1.4]];
  return esc.map(([k,n,f])=>{
    const h=cuota*f;
    const sem=h>0?Math.ceil(horasTotales/h):null;
    return {k,n,horas:Math.round(h*10)/10,semanas:sem,fecha:sem?addDays(lun,7*sem):null};
  });
}

/* ---------- horas libres publicadas ---------- */
function horasLibresMias(){
  const out={};
  for(let i=0;i<2;i++){
    const lun=addDays(lunesDe(hoyISO()),7*i);
    const w=SEM[semanaId(lun)];
    const cap=w?w.util:capacidadTeorica(lun)*0.85;
    const usadas=w?w.usadas:0;
    out['s'+i]=Math.max(0,Math.round((cap-usadas)*10)/10);
  }
  return out;
}
function librePara(pid,quien){
  const c=compartidos().find(x=>x.proyectoId===pid);
  const m=(c&&c.libres)||{};
  if(quien===autorNombre())return horasLibresMias();
  return m[quien]||null;
}
function etiquetaLibre(pid,quien){
  const l=librePara(pid,quien);
  if(!l)return '';
  return ' · '+fmtH(l.s0)+' libres esta semana';
}
